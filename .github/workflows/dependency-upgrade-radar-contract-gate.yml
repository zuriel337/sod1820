name: Dependency Upgrade Radar Contract Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/*g3_system_upgrade_radar*.sql"
      - "test/dependency-upgrade-radar-contract.test.mjs"
      - "package.json"
      - ".github/workflows/dependency-upgrade-radar-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: system-watchman dependency upgrade radar contract
        run: node test/dependency-upgrade-radar-contract.test.mjs
