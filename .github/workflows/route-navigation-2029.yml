name: Route navigation 2029
on:
  pull_request:
    branches: [main]
    paths:
      - src/App2029.jsx
      - src/components/experience2029/RouteScrollReset2029.jsx
      - test/route-scroll-reset-2029.browser.test.mjs
      - .github/workflows/route-navigation-2029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-navigation-2029:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test test/route-scroll-reset-2029.browser.test.mjs
