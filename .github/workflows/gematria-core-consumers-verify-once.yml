name: Gematria Core Consumers Verify Once
on:
  push:
    branches: [gpt/gematria-core-consumers-adapter-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused Gematria tests
        run: node --test src/lib/research/gematriaCalculationContract.test.js src/lib/research/coreEngine.test.js
      - name: Build
        run: npm run build
