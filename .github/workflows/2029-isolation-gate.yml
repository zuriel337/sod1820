name: 2029 Isolation Gate

on:
  pull_request:
    paths:
      - "2029.html"
      - "src/main2029.jsx"
      - "src/App2029.jsx"
      - "src/App.jsx"
      - "src/pages/ResearchPage.jsx"
      - "src/components/ResearchHome.jsx"
      - "src/components/experience2029/**"
      - "src/pages/*2029Page.jsx"
      - "src/lib/designTokens.js"
      - "src/lib/timeFlow.js"
      - "src/lib/experienceContext.js"
      - "src/lib/operationalTraceContract.js"
      - "src/lib/supabase.js"
      - "src/lib/research/researchContext.js"
      - "src/lib/research/ResearchProvider.jsx"
      - "src/lib/research/numberExpressionFocus.js"
      - "src/lib/research/post2029Projection.js"
      - "src/lib/research/world2029Presentation.js"
      - "src/lib/research/topic2029Projection.js"
      - "src/lib/research/topicConvergence.js"
      - "src/lib/research/worldConvergenceLensProjection.js"
      - "src/lib/research/worldContextualProminence.js"
      - "src/lib/research/worldAllResearchProjection.js"
      - "src/lib/research/worldConvergencePr591SerialRepairA2.test.js"
      - "src/lib/research/worldConvergencePr591SerialRepairA3.test.js"
      - "src/lib/research/worldConvergencePr591PhaseBSourceMemberInspector.test.js"
      - "src/components/research/WorldConvergenceLens.jsx"
      - "src/lib/seo.js"
      - "src/pages/topic2029.css"
      - "src/pages/post2029.css"
      - "package.json"
      - "vite.config.js"
      - "vercel.json"
      - "scripts/test-experience-context-2029.mjs"
      - "scripts/test-operational-trace-contract.mjs"
      - "scripts/test-operational-trace-runtime.mjs"
      - "scripts/test-replayable-golden-no-black-box.mjs"
      - "supabase/functions/ai-analyze/index.ts"
      - "scripts/test-2029-isolation.mjs"
      - "scripts/test-2029-built-graph.mjs"
      - "scripts/test-2029-system-frame.mjs"
      - "scripts/test-2029-canonical-contract-wiring.mjs"
      - "scripts/test-2029-world-surface.mjs"
      - "scripts/test-2029-topic-surface.mjs"
      - "scripts/test-2029-researcher-corpus.mjs"
      - "scripts/test-2029-number-preview.mjs"
      - "scripts/test-2029-post-preview.mjs"
      - "scripts/test-legacy-research-containment.mjs"
      - "tests/world2029-release.spec.cjs"
      - ".github/workflows/2029-isolation-gate.yml"
  workflow_dispatch:

jobs:
  hard-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Experience Context 2029 acceptance
        run: npm run test:experience-context
      - name: No Black Box operational trace acceptance
        run: npm run test:operational-trace
      - name: Operational Trace Runtime persistence acceptance
        run: npm run test:operational-trace-runtime
      - name: Replayable Golden No-Black-Box acceptance
        run: npm run test:replayable-golden
      - name: Server capability execution gate acceptance
        run: npm run test:server-capability-gate
      - name: 2029 server SEO / AI metadata parity
        run: npm run test:2029-server-seo-ai
      - name: Research Path resumability runtime acceptance
        run: npm run test:research-path-resume
      - name: 2029 cheap route/test/least-privilege hardening
        run: npm run test:2029-cheap-hardening
      - name: Legacy Research containment + unopened Heichal entrypoint acceptance
        run: npm run test:legacy-research-containment
      - name: Source isolation regression
        run: node scripts/test-2029-isolation.mjs
      - name: Native System Frame acceptance
        run: node scripts/test-2029-system-frame.mjs
      - name: Canonical 2029 contract wiring acceptance
        run: node scripts/test-2029-canonical-contract-wiring.mjs
      - name: Native World surface acceptance
        run: node scripts/test-2029-world-surface.mjs
      - name: World Convergence PR591 focused acceptance
        run: npm run test:world-convergence-pr591
      - name: Native Topic surface acceptance
        run: node scripts/test-2029-topic-surface.mjs
      - name: Native Researcher corpus acceptance
        run: node scripts/test-2029-researcher-corpus.mjs
      - name: Native Number preview acceptance
        run: node scripts/test-2029-number-preview.mjs
      - name: Native Post preview acceptance
        run: npm run test:2029-post-preview
      - name: Production build
        run: npm run build
      - name: Built dependency graph isolation
        run: node scripts/test-2029-built-graph.mjs
      - name: Verify isolated HTML artifact
        run: |
          test -f dist/2029.html
          ! grep -q "site.webmanifest" dist/2029.html
          ! grep -q "/logo.png" dist/2029.html
      - name: Install browser acceptance runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated 2029 preview
        run: |
          cp dist/2029.html dist/index.html
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sod1820-2029-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/world >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sod1820-2029-preview.log
          exit 1
      - name: Real World browser acceptance
        run: |
          mkdir -p test-results/release-visual
          npx playwright test tests/world2029-release.spec.cjs --reporter=line
      - name: Upload native World screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-2029-visual-evidence
          path: test-results/release-visual
          if-no-files-found: warn
          retention-days: 14
      - name: Show isolated preview log on failure
        if: failure()
        run: cat /tmp/sod1820-2029-preview.log || true
