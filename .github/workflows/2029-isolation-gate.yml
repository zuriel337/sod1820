name: 2029 Isolation Gate

on:
  pull_request:
    paths:
      - "2029.html"
      - "src/main2029.jsx"
      - "src/App2029.jsx"
      - "src/components/experience2029/**"
      - "src/lib/AuthContext.jsx"
      - "src/lib/auth.js"
      - "src/lib/tracking.js"
      - "src/lib/supabase.js"
      - "src/lib/research/**"
      - "src/lib/gematria.js"
      - "src/lib/engine.js"
      - "src/theme.js"
      - "src/components/GematriaCalculator.jsx"
      - "src/components/CanonicalGematriaCalculator.jsx"
      - "src/components/GematriaCalculatorLegacy.jsx"
      - "src/components/GematriaMiniDemo.jsx"
      - "src/components/GematriaCube.jsx"
      - "src/components/GematriaCalculator3D.jsx"
      - "src/components/MethodAnalyze.jsx"
      - "src/pages/CommunityCalculatorPage.jsx"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vercel.json"
      - "scripts/test-2029-isolation.mjs"
      - "scripts/test-2029-built-graph.mjs"
      - "scripts/test-gematria-authority-isolation.mjs"
      - "test/normalize-parity.test.mjs"
      - "test/fixtures/normalize-parity.json"
      - ".github/workflows/2029-isolation-gate.yml"
  workflow_dispatch:

jobs:
  hard-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Source isolation regression
        run: node scripts/test-2029-isolation.mjs
      - name: Gematria authority isolation regression
        run: node scripts/test-gematria-authority-isolation.mjs
      - name: Legacy JS / canonical SQL parity snapshot
        run: node test/normalize-parity.test.mjs
      - name: Production build
        run: npm run build
      - name: Built dependency graph isolation
        run: node scripts/test-2029-built-graph.mjs
      - name: Verify isolated HTML artifact
        run: |
          test -f dist/2029.html
          ! grep -q "site.webmanifest" dist/2029.html
          ! grep -q "/logo.png" dist/2029.html
