  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependency setup is the only networked phase. Lifecycle hooks are disabled.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned test tools without package hooks
        run: |
          npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 esbuild@0.28.2
          node "$RUNNER_TEMP/ci-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/ci-tools" >> "$GITHUB_ENV"
          echo "PERF_CHROME=$(node -e "console.log(require('$RUNNER_TEMP/ci-tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          echo "SOD_CI_ESBUILD=$RUNNER_TEMP/ci-tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: Prepare immutable comparison source (never execute base CI scripts)
        env:
          BASE_SHA: 0825b326ea0fd9faa57b41d0d48bdadada9f3c7f
        run: |
          mkdir -p "$RUNNER_TEMP/nav-base" "$RUNNER_TEMP/nav-results"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/nav-base"
          npm ci --prefix "$RUNNER_TEMP/nav-base" --ignore-scripts --no-audit --no-fund
      - name: Frozen snapshot preflight and isolated navigation acceptance
        env:
          SOD_CI_SNAPSHOT: ${{ github.workspace }}/test/fixtures/ci-2029/navigation.json.gz
        run: |
          # The reviewed manifest and complete nonempty snapshots are required inputs.
          # Missing inputs fail before any application connection; never capture live.
          snapshot_sha="$(node scripts/ci-isolation/snapshot-sha.mjs navigation)"
          export SOD_CI_SNAPSHOT_SHA256="$snapshot_sha"
          bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/navigation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-replay-isolated-evidence
          path: |
            ${{ runner.temp }}/nav-results
            test-results/release-visual
          if-no-files-found: warn
          retention-days: 14
  performance-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependency setup is the only networked phase. Lifecycle hooks are disabled.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned test tools without package hooks
        run: |
          npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 esbuild@0.28.2
          node "$RUNNER_TEMP/ci-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/ci-tools" >> "$GITHUB_ENV"
          echo "PERF_CHROME=$(node -e "console.log(require('$RUNNER_TEMP/ci-tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          echo "SOD_CI_ESBUILD=$RUNNER_TEMP/ci-tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: Prepare immutable comparison source (never execute base CI scripts)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/perf-base" "$RUNNER_TEMP/nav-results"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/perf-base"
          npm ci --prefix "$RUNNER_TEMP/perf-base" --ignore-scripts --no-audit --no-fund
      - name: Frozen snapshot preflight and isolated performance acceptance
        env:
          SOD_CI_SNAPSHOT: ${{ github.workspace }}/test/fixtures/ci-2029/performance.json.gz
        run: |
          # The reviewed manifest and complete nonempty snapshots are required inputs.
          # Missing inputs fail before any application connection; never capture live.
          snapshot_sha="$(node scripts/ci-isolation/snapshot-sha.mjs performance)"
          export SOD_CI_SNAPSHOT_SHA256="$snapshot_sha"
          bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/performance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-replay-isolated-evidence
          path: |
            ${{ runner.temp }}/perf-results
            test-results/release-visual
          if-no-files-found: warn
          retention-days: 14
  hard-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Dependency setup is the only networked phase. Lifecycle hooks are disabled.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned test tools without package hooks
        run: |
          npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 esbuild@0.28.2
          node "$RUNNER_TEMP/ci-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/ci-tools" >> "$GITHUB_ENV"
          echo "PERF_CHROME=$(node -e "console.log(require('$RUNNER_TEMP/ci-tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
          echo "SOD_CI_ESBUILD=$RUNNER_TEMP/ci-tools/node_modules/.bin/esbuild" >> "$GITHUB_ENV"
      - name: Source, A3 isolated storage, negative egress and build acceptance without external network
        run: bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/hard-source.sh
      - name: Frozen snapshot preflight and isolated browser acceptance
        env:
          SOD_CI_SNAPSHOT: ${{ github.workspace }}/test/fixtures/ci-2029/browser.json.gz
        run: |
          # The reviewed manifest and complete nonempty snapshots are required inputs.
          # Missing inputs fail before any application connection; never capture live.
          snapshot_sha="$(node scripts/ci-isolation/snapshot-sha.mjs browser)"
          export SOD_CI_SNAPSHOT_SHA256="$snapshot_sha"
          bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/hard-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hard-isolation-isolated-evidence
          path: |
            ${{ runner.temp }}/sod-2029-preview.log
            test-results/release-visual
          if-no-files-found: warn
          retention-days: 14
