name: Community Gematria Projection Patch Once

on:
  push:
    branches:
      - gpt/community-gematria-projection-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Community Gematria Projection V1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/community-gematria-projection-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch community calculator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/pages/CommunityCalculatorPage.jsx';
          let s = fs.readFileSync(p, 'utf8');
          const rep = (a,b,label) => { if (!s.includes(a)) throw new Error(`missing ${label}`); s = s.replace(a,b); };

          rep('import { waHref } from "../lib/share.js";\n', 'import { waHref } from "../lib/share.js";\nimport { track } from "../lib/tracking.js";\nimport { calculateGematriaEnvelope } from "../lib/research/gematriaCalculationContract.js";\nimport { fetchGematriaMethodStates } from "../lib/research/gematriaMethodRegistry.js";\n', 'imports');
          rep('const gemAll = name => ALL_METHODS.map(m => ({ key: m.key, sub: m.sub || m.soul || "", value: m.fn(name) }));', 'const gemAll = (name, methodStates = null) => calculateGematriaEnvelope(name, methodStates).results;', 'gemAll');
          rep('function BabyNameTool({ P }) {', 'function BabyNameTool({ P, methodStates }) {', 'BabyNameTool signature');
          rep('const all = gemAll(nm);', 'const all = gemAll(nm, methodStates);', 'baby analyzed gemAll');
          rep('}), [names]);', '}), [names, methodStates]);', 'baby analyzed deps');
          rep('return { name: fnm, all: gemAll(fnm), value: regularOf(fnm) };', 'return { name: fnm, all: gemAll(fnm, methodStates), value: regularOf(fnm) };', 'family gemAll');
          rep('}, [family]);', '}, [family, methodStates]);', 'family deps');
          rep('  const loc = useLocation();\n  const [name1, setName1] = useState("");', '  const loc = useLocation();\n  const sharedSeed = useMemo(() => (new URLSearchParams(loc.search).get("w") || "").trim(), [loc.search]);\n  const [methodStates, setMethodStates] = useState(null);\n  const [name1, setName1] = useState("");', 'page state');
          rep('  const [deepName, setDeepName] = useState("");\n  useEffect(() => { const t = setTimeout(() => setDeepName(name1.trim()), 900); return () => clearTimeout(t); }, [name1]);', '  const [deepName, setDeepName] = useState("");\n  const gemTracked = useRef(sharedSeed);\n  useEffect(() => { const t = setTimeout(() => setDeepName(name1.trim()), 900); return () => clearTimeout(t); }, [name1]);\n  useEffect(() => {\n    let live = true;\n    fetchGematriaMethodStates().then(rows => { if (live) setMethodStates(rows); }).catch(() => { if (live) setMethodStates(null); });\n    return () => { live = false; };\n  }, []);', 'registry state');
          rep('  // הגעה משיתוף (?w=) → ממלא את השם ומראה «בדוק את שלך»\n  useEffect(() => {\n    const w = new URLSearchParams(loc.search).get("w");\n    if (w) { setName1(w); setFromShare(true); }\n  }, [loc.search]);', '  // הגעה משיתוף (?w=) → ממלא את השם, לא נספרת כחישוב חדש, ומשתמרת במעבר למקצועי.\n  useEffect(() => {\n    if (sharedSeed) { gemTracked.current = sharedSeed; setName1(sharedSeed); setFromShare(true); }\n  }, [sharedSeed]);', 'share seed effect');
          rep('  const r1 = useMemo(() => onlyHeb(name1).length ? { value: regularOf(name1), all: gemAll(name1) } : null, [name1]);\n  const r2 = useMemo(() => (compare && onlyHeb(name2).length) ? { value: regularOf(name2), all: gemAll(name2) } : null, [compare, name2]);', '  const r1 = useMemo(() => onlyHeb(name1).length ? { value: regularOf(name1), all: gemAll(name1, methodStates) } : null, [name1, methodStates]);\n  const r2 = useMemo(() => (compare && onlyHeb(name2).length) ? { value: regularOf(name2), all: gemAll(name2, methodStates) } : null, [compare, name2, methodStates]);', 'main calculations');
          rep('  const matches = useMemo(() => (r1 && r2) ? r1.all.filter((a, i) => a.value === r2.all[i].value) : [], [r1, r2]);', '  const matches = useMemo(() => (r1 && r2) ? r1.all.filter((a, i) => a.value === r2.all[i].value) : [], [r1, r2]);\n\n  // 📊 Telemetry parity with the professional calculator: settled word only, deduped, seed-load excluded.\n  useEffect(() => {\n    const word = name1.trim();\n    if (!r1 || onlyHeb(word).length < 2) return;\n    const t = setTimeout(() => {\n      if (word === gemTracked.current) return;\n      gemTracked.current = word;\n      try { track("gematria", word.slice(0, 60), "compute", { value: r1.value, projection: "community" }); } catch { /* telemetry never breaks UX */ }\n    }, 900);\n    return () => clearTimeout(t);\n  }, [name1, r1?.value]); // eslint-disable-line', 'telemetry');
          rep('<Link to="/research?tool=gematria" style={{ color: P.accentDim, fontFamily: F.heading, fontSize: 13, fontWeight: 700 }}>🔬 למחשבון המקצועי →</Link>', '<Link to={`/research?tool=gematria${onlyHeb(name).length ? `&w=${encodeURIComponent(name.trim())}` : ""}`} style={{ color: P.accentDim, fontFamily: F.heading, fontSize: 13, fontWeight: 700 }}>🔬 למחשבון המקצועי →</Link>', 'reveal professional link');
          rep('{babyMode && <div style={{ marginBottom: 20 }}><BabyNameTool P={P} /></div>}', '{babyMode && <div style={{ marginBottom: 20 }}><BabyNameTool P={P} methodStates={methodStates} /></div>}', 'baby prop');
          rep('<Link to="/research?tool=gematria" style={{ color: P.accentText, fontFamily: F.heading, fontSize: 14, fontWeight: 700 }}>\n          רוצים לעומק? המחשבון המקצועי — 20 שיטות, הצלבות ומנוע מלא →\n        </Link>', '<Link to={`/research?tool=gematria${onlyHeb(name1).length ? `&w=${encodeURIComponent(name1.trim())}` : ""}`} style={{ color: P.accentText, fontFamily: F.heading, fontSize: 14, fontWeight: 700 }}>\n          רוצים לעומק? המחשבון המקצועי — שיטות מתקדמות, הצלבות ומנוע מלא →\n        </Link>', 'bottom professional link');
          fs.writeFileSync(p, s);
          NODE
      - name: Verify focused invariants
        run: |
          npm install
          node --test src/lib/research/gematriaCalculationContract.test.js
          npm run build
      - name: Commit patch
        run: |
          git config user.name "zuriel337"
          git config user.email "128194013+zuriel337@users.noreply.github.com"
          git add src/pages/CommunityCalculatorPage.jsx
          git commit -m "Apply Community Gematria Projection V1"
          git push origin HEAD:gpt/community-gematria-projection-v1
