name: System Self Maintenance V1 Contract Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/*system_self_maintenance*.sql"
      - "test/system-self-maintenance-v1-contract.test.mjs"
      - ".github/workflows/system-self-maintenance-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Self-maintenance contract
        run: node test/system-self-maintenance-v1-contract.test.mjs
