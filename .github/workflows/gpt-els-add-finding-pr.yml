name: GPT ELS Add Finding PR

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'gpt/els-research-journey-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply add-finding bridge patch
        run: python scripts/gpt_els_add_finding_once.py
      - name: Install
        run: npm ci
      - name: Journey contract
        run: node scripts/verify-els-journey-contract.mjs
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Commit target change and clean one-shot scaffolding
        run: |
          git config user.name 'GPT Research Agent 2'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/els/els-code.template.html public/tzofen.html src/components/TzofenEmbed.jsx src/pages/ElsWorkAreaPage.jsx
          git rm .github/workflows/gpt-els-add-finding-pr.yml scripts/gpt_els_add_finding_once.py
          git commit -m 'feat(els): add canonical finding search to lab'
          git push origin HEAD:${{ github.head_ref }}
