name: Post-Deploy Canary

# G3_RELIABILITY_PRECLOSE — deterministic, zero-AI canary against the exact deployed SHA.
# GitHub commit status context sod1820/post-deploy-canary is the release evidence.
# Supabase is read-only here: only a bounded public heartbeat-status RPC is called.
# Failure blocks the NEXT release; there is no automatic rollback.
on:
  deployment_status:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  actions: read
  statuses: write

concurrency:
  group: post-deploy-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve exact deployed SHA, URL and sparse budget
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          EVENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          set -euo pipefail
          KIND="manual"
          SKIP="false"
          if [ "$EVENT" = "deployment_status" ]; then
            SHA="$EVENT_SHA"; URL="$EVENT_URL"; KIND="deploy"
          else
            ID=""
            for i in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=20" --jq '.[].id'); do
              S=$(gh api "repos/${{ github.repository }}/deployments/$i/statuses?per_page=1" --jq '.[0].state')
              if [ "$S" = "success" ]; then ID="$i"; break; fi
            done
            if [ -z "$ID" ]; then echo "::error::no successful Production deployment"; exit 1; fi
            SHA=$(gh api "repos/${{ github.repository }}/deployments/$ID" --jq '.sha')
            URL="https://sod1820.co.il"
            if [ "$EVENT" = "schedule" ]; then KIND="scheduled"; fi
            TODAY="$(date -u +%Y-%m-%dT00:00:00Z)"
            COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/post-deploy-canary.yml/runs?per_page=100"               --jq "[.workflow_runs[] | select((.event == \"schedule\" or .event == \"workflow_dispatch\") and .created_at >= \"$TODAY\")] | length")
            if [ "$COUNT" -gt 4 ]; then SKIP="true"; fi
          fi
          if [ -z "$SHA" ] || [ -z "$URL" ]; then echo "::error::could not resolve exact SHA/URL"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Canary
        id: canary
        if: steps.target.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/post-deploy-canary.mjs --url "${{ steps.target.outputs.url }}" --sha "${{ steps.target.outputs.sha }}" --kind "${{ steps.target.outputs.kind }}"
      - name: Record exact-SHA canary status
        if: always() && steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE="failure"
          DESCRIPTION="Post-deploy canary failed"
          if [ "${{ steps.canary.outcome }}" = "success" ]; then
            STATE="success"
            DESCRIPTION="Post-deploy canary passed"
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ steps.target.outputs.sha }}"             -f state="$STATE"             -f context="sod1820/post-deploy-canary"             -f description="$DESCRIPTION"             -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Enforce canary outcome
        if: steps.target.outputs.skip != 'true' && steps.canary.outcome != 'success'
        run: exit 1
