name: Post-Deploy Canary

# G3_RELIABILITY_RUNTIME_CORE_V1 — deterministic, zero-AI canary against the EXACT deployed SHA.
# Sparse by design: on Vercel deployment success + at most 4 scheduled runs/day.
# Failure only fails this run (the next release checks it); there is no automatic rollback.

on:
  deployment_status:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: post-deploy-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Resolve exact deployed SHA and URL
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.deployment.sha }}
          EVENT_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [ "$EVENT" = "deployment_status" ]; then
            SHA="$EVENT_SHA"; URL="$EVENT_URL"
          else
            ID=$(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=20" --jq '.[0].id')
            for i in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=20" --jq '.[].id'); do
              S=$(gh api "repos/${{ github.repository }}/deployments/$i/statuses?per_page=1" --jq '.[0].state')
              if [ "$S" = "success" ]; then ID="$i"; break; fi
            done
            SHA=$(gh api "repos/${{ github.repository }}/deployments/$ID" --jq '.sha')
            URL="https://sod1820.co.il"
          fi
          if [ -z "$SHA" ] || [ -z "$URL" ]; then echo "::error::could not resolve exact SHA/URL"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"; echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Canary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/post-deploy-canary.mjs --url "${{ steps.target.outputs.url }}" --sha "${{ steps.target.outputs.sha }}"
