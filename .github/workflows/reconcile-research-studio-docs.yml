name: Research Studio docs reconcile once
on:
  push:
    branches: [gpt/research-studio-v1-contract]
    paths: ['.github/workflows/reconcile-research-studio-docs.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/research-studio-v1-contract
          fetch-depth: 0
      - name: Reconcile Roadmap and Master State
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import date

          roadmap = Path('SOD1820_MASTER_ROADMAP.md')
          master = Path('SOD1820_MASTER_STATE.md')
          r = roadmap.read_text(encoding='utf-8')
          m = master.read_text(encoding='utf-8')

          r_marker = '## 🧭 RESEARCH STUDIO v1 — RECONCILIATION 24.8.2026'
          m_marker = '## 0-A. RESEARCH STUDIO v1 — ARCHITECTURE DECISION (24.8.2026)'
          if r_marker in r or m_marker in m:
              raise SystemExit('reconciliation markers already present; refusing duplicate write')

          # Roadmap: version/freshness at the navigation layer. Historical text below remains provenance.
          r = r.replace('# 🧭 SOD1820 — מפת־העל התפעולית (MASTER ROADMAP) · v5.1 (קנוני)',
                        '# 🧭 SOD1820 — מפת־העל התפעולית (MASTER ROADMAP) · v5.2 (מועמד לקנוניזציה — PR #187)', 1)

          insertion_anchor = '---\n\n## 🏷️ אוצר־תגיות v5'
          if insertion_anchor not in r:
              raise SystemExit('roadmap insertion anchor missing')

          section = '''---\n\n## 🧭 RESEARCH STUDIO v1 — RECONCILIATION 24.8.2026\n> **DECISION — ZURIEL Human-Gate, 24.8.2026.** סעיף זה הוא שכבת-הניווט העדכנית של המפה ומחליף, לצורך `ACTIVE_NOW` וסדר-הבנייה, הפניות ישנות יותר ל-`WS-GEMATRIA-CORPUS-PACKAGES` כעמדה-היחידה. ההיסטוריה שמתחת נשמרת כ-provenance ואינה נמחקת. מקור: `docs/research-studio-v1-contract.md` + `docs/research-universal-finding-contract.md` + `work_log` actor=GPT. עד למיזוג PR #187 ל-`main`, זהו **מועמד-קנוני מאושר-Human-Gate**, לא מסמך-main קנוני.\n\n### ACTIVE_NOW החדש — `WS-RESEARCH-STUDIO-FOUNDATION`\n**מטרה:** לחבר את המנועים והישויות הקיימים ל-Research OS אחד, בלי מנוע/Graph/Store מקביל.\n\n**חוזה מוצר:** `Discovery → Universal Findings → Investigation → Judgment`.\n- `Clean ↔ Pro` = עומק-תצוגה על אותו State, לא שתי אפליקציות.\n- Journey = היסטוריית-מחקר אוטומטית עם restore מדויק, לא מוצר שלישי.\n- 2D / Layered / 3D = renderers של אותו Finding/Research State; אין 3D truth נפרד.\n- 2D+Focus/Fit הוא baseline מהיר; שכבות/3D lazy/on-demand; מטריצות גדולות מיועדות ל-virtualization.\n- AI/Raziel מציע Candidates בלבד; Candidate ≠ Finding ≠ Fact ≠ Claim ≠ Interpretation ≠ Canonical ≠ Published.\n\n### סדר-הבנייה המעודכן\n1. **Universal Finding Contract** — חוזה זהות/provenance משותף לכל מקור. `CONTRACT: APPROVED`; מימוש-ראשון קיים ב-Draft #188.\n2. **Global Research Workspace / ResearchProvider** — reuse של `src/lib/research/ResearchProvider.jsx` + `research_items`; אין Store/טבלה מקבילים.\n3. **ELS Lens integration** — #186/#188: ELS exact identity, Journey, Findings, Matrix, Verse, 2D/Layered/3D; ה-ELS הוא Lens ראשון, לא בעל-הבית של ה-Workspace.\n4. **Number/Gematria Adapter + NumberHub** — מחובר רק דרך `gematria_methods` והפונקציות הקנוניות; `WS-GEMATRIA-CORPUS-PACKAGES` נשמר ואינו מבוטל, אך מוזן מעכשיו אל Research Studio במקום לעמוד כ-workstream מבודד.\n5. **Discovery Layer** — Cross Search, Auto Terms, AI Suggestions, EntityHub/Graph, אנשים/ישויות, פסוקים ומחקר קיים כ-Candidates/Findings עם provenance.\n6. **Global Findings Workspace UX** — multi-Finding, compare, pin, dismiss-from-view, restore, source-neutral inspect, adapter-specific promote.\n7. **Judgment Surface** — Evidence / Claim / Interpretation / confidence מוסבר + Human Gate; אין מערכת Judgment מקבילה.\n8. **Legacy Capability Reconciliation** — למפות את inventory הישן (כולל D4/FORMS/Research Journey prior-art) אל הארכיטקטורה החדשה; לספוג רק יכולות חסרות ובעלות-ערך, בלי raw merge.\n9. **Depth Dimensions / Research Universe** — הרחבה על אותם contracts; depth semantics תמיד מפורשים (`verse/source/time/method/research-track/confidence/relation-family`).\n\n### יחס לסדר-היסוד הישן\n`Corpus Classification → Corpus Persistence → Research DNA → Identity/Multilingual/Numeric → Cross/ELS → Entity Hub → Raziel` **נשמר כסדר-תלויות/יסודות** ואינו נמחק. השינוי הוא בניווט-הבנייה: Research Studio Foundation הופך למעטפת המאחדת שמחברת את אותם workstreams. אין צורך "לסיים את כל הקורפוס" לפני חיבור המעטפת, וכל workstream שומר את Gate/STATE האמיתי שלו.\n\n### מצב חי שנקלט ב-reconciliation\n- `main` כולל את PR #185 (`a665a4dc`) — ELS state/Matrix/2D-Layered-3D/hidden bridge/Verse integration.\n- Draft #186 = Research Journey v2 + Focus/Fit + add-Finding cross bridge; לא merged/deployed.\n- Draft #187 = חוזה Research Studio + Universal Finding; docs-only.\n- Draft #188 = Universal Finding adapter מעל ResearchProvider + `📌 למחקר`; stacked על #186, לא merged/deployed.\n- `ResearchProvider` קיים ב-main ומחזיק cart/saved/pinned/history/collections/journeys/mode; reuse חובה.\n\n### NEXT_ACTION\nHuman Preview ל-#188 (`📌 למחקר` persistence בלי שינוי ציר) → אימות callable path קנוני של Number/Gematria → Adapter שני. אין עוד הרחבת-UI אד-הוק לפני החיבור הזה.\n\n'''
          r = r.replace(insertion_anchor, section + '---\n\n## 🏷️ אוצר־תגיות v5', 1)

          # Mark freshness block as superseded by this candidate reconciliation without rewriting history below.
          r = r.replace('- **SYNC STATUS:** `SYNCED` — **v5.1 קנוני, בונה על v5/`f1503a28` + Research DNA v1 Foundation (`95005d78`)**, לא-עוד DRAFT.',
                        '- **SYNC STATUS:** `STALE on main` / **`RECONCILED-CANDIDATE` on PR #187** — v5.2 candidate captures verified work through 24.8.2026; main remains v5.1 until Human-Gate merge.', 1)

          # Master State: append approved architecture immediately before §1 while preserving §0 governance.
          master_anchor = '\n---\n\n## 1. רישום השיטות — `gematria_methods`'
          if master_anchor not in m:
              raise SystemExit('master insertion anchor missing')
          master_section = '''\n---\n\n## 0-A. RESEARCH STUDIO v1 — ARCHITECTURE DECISION (24.8.2026)\n> **STATUS: APPROVED by ZURIEL Human-Gate · DOCUMENTED on Draft PR #187 · not merged/deployed by this decision alone.**\n> provenance: `docs/research-studio-v1-contract.md`, `docs/research-universal-finding-contract.md`, work_log 24.8 actor=GPT, live verification of `ResearchProvider`/main + PRs #185/#186/#188.\n\n### DECISION\nSOD1820 מחזיק **Research OS אחד**: Reality Graph אחד, Research Workspace גלובלי אחד ו-Human Gate אחד. ELS, Gematria/Numbers, Cross, Verse, Entity/Person/Name, Reality Signals, research/posts ו-AI הם engines/sources/lenses בתוך אותו Research OS — לא מוצרים/עצי-אמת מקבילים.\n\nה-flow המאושר: **Discovery → Universal Findings → Investigation → Judgment**.\n- `Clean ↔ Pro` הם presentation-depth של אותו state.\n- Journey הוא workflow/history אוטומטי עם exact identity/restore, לא אפליקציה שלישית.\n- Universal Finding שומר source-native identity + provenance; display/view metadata לעולם אינו identity.\n- AI suggestions נכנסות כ-`candidate`; אין קידום אוטומטי ל-Finding/Fact/Canonical/Published.\n- Numbers הם first-class graph entities; תוצאת שיטת-גימטריה וה-Number Entity אינם אותה identity.\n\n### LAYERED / 3D FIRST-CLASS LAW\n2D, Layered ו-3D/Depth הם projections/renderers של **אותו Research/Finding State**. אסור מנוע-3D, Matrix truth או Finding store מקביל. כל adapter חדש צריך לחשוף, כאשר טבעי למקור, stable anchors/relations/dimensions שמאפשרים projection ל-2D/Layered/3D. Depth semantics חייבים להיות מפורשים.\n\nPerformance: 2D+Focus/Fit הוא baseline זול; Layered/3D lazy/on-demand; large matrices מיועדות ל-viewport virtualization; חומרה חלשה/מובייל משנה renderer strategy בלבד, לא research truth/canonical data.\n\n### GLOBAL WORKSPACE / STORAGE DECISION\n`src/lib/research/ResearchProvider.jsx` הקיים הוא תשתית-ה-Workspace הקנונית להרחבה. `cart/saved/pinned/history/collections/journeys/mode` ו-cloud path דרך `research_items` נשמרים. חוזה Universal Finding **אינו** מאשר טבלת `findings` או Context/Store מקביל.\n\n### PRIORITY DECISION\n`ACTIVE_NOW` עובר ברמת-הניווט ל-**Research Studio Foundation**. `WS-GEMATRIA-CORPUS-PACKAGES` אינו מבוטל ואינו SUPERSEDED; הוא נשאר workstream יסודי/תלות ומתחבר כ-Number/Gematria source לתוך Research Studio. סדר הבנייה המאושר: Universal Finding → Global Workspace → ELS Lens integration → Number/Gematria Adapter → Discovery adapters → Findings Workspace UX → Judgment Surface → legacy capability reconciliation → Depth/Research Universe.\n\n### IMPLEMENTATION STATE (24.8)\n- PR #185: merged/main — ELS state + Matrix + 2D/Layered/3D + Verse integration.\n- PR #186: BUILDING/DRAFT — exact Journey + Focus/Fit + add-Finding cross bridge.\n- PR #187: DOCS/DRAFT — architecture + Universal Finding contracts.\n- PR #188: BUILDING/DRAFT stacked on #186 — Universal Finding adapter over existing ResearchProvider + explicit `📌 למחקר`.\n- No merge/deploy to main is authorized by this Master-State entry itself.\n\n### NEXT ACTION\nHuman Preview #188 → verify canonical Number/Gematria callable path → add Number/Gematria adapter. Do not build a parallel Workspace/Graph/engine and do not calculate gematria from memory.\n'''
          m = m.replace(master_anchor, master_section + master_anchor, 1)

          roadmap.write_text(r, encoding='utf-8')
          master.write_text(m, encoding='utf-8')
          PY
          git diff --check
          grep -q 'WS-RESEARCH-STUDIO-FOUNDATION' SOD1820_MASTER_ROADMAP.md
          grep -q 'RESEARCH STUDIO v1 — ARCHITECTURE DECISION' SOD1820_MASTER_STATE.md
      - name: Commit reconciled docs and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/reconcile-research-studio-docs.yml
          git config user.name 'GPT Research Agent 2'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add SOD1820_MASTER_ROADMAP.md SOD1820_MASTER_STATE.md .github/workflows/reconcile-research-studio-docs.yml
          git commit -m 'docs: reconcile Research Studio v1 into Master and Roadmap'
          git push origin HEAD:gpt/research-studio-v1-contract
