name: ELS Core Compatibility Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260916150900_g3_els_core_compatibility_extension_v1.sql'
      - 'supabase/migrations/20260916151000_g3_els_core_compatibility_truth_hardening_v1.sql'
      - 'test/els-core-compatibility.test.mjs'
      - 'test/els-core-compatibility-fixture.sql'
      - 'test/els-core-compatibility.sql'
      - 'supabase/migrations/20260930083354_g3_els_tanakh_canonical_stream_build_v1.sql'
      - 'test/els-tanakh-canonical-stream.test.mjs'
      - 'test/els-tanakh-canonical-stream-fixture.sql'
      - '.github/workflows/els-core-compatibility-gate.yml'
      - 'src/lib/research/els2029*.js'
      - 'src/lib/research/elsRazielContext.js'
      - 'src/lib/research/researchContext.js'
      - 'src/lib/research/ResearchProvider.jsx'
      - 'src/lib/research/elsSavedDiscovery.js'
      - 'src/lib/research/elsDiscoveryStructureSources.js'
      - 'src/lib/research/elsStructureInspection.js'
      - 'src/components/experience2029/ElsLexiconResearch2029.jsx'
      - 'src/components/experience2029/ElsSavedDiscovery2029.jsx'
      - 'test/els-saved-discovery*.test.mjs'
      - 'test/fixtures/els-saved-discovery.mjs'
      - 'test/els-discovery-structure*.test.mjs'
      - 'test/fixtures/els-discovery-structures.mjs'
      - 'src/pages/Els2029Page.jsx'
      - 'src/components/experience2029/Els2029Representation.jsx'
      - 'src/components/experience2029/ElsNativeClassic2029.jsx'
      - 'src/components/experience2029/elsNativeClassic2029.css'
      - 'src/components/experience2029/elsPresentation2029.js'
      - 'src/components/experience2029/SystemFrame2029.jsx'
      - 'src/components/experience2029/SystemToolDock2029.jsx'
      - 'src/components/experience2029/systemToolDock2029.css'
      - 'src/components/experience2029/els2029-representation.css'
      - 'test/els-2029-*.test.mjs'
      - 'test/els-raziel-context.test.mjs'
      - 'test/els-host-bridge.test.mjs'
      - 'test/els-search-bridge.test.mjs'
      - 'supabase/migrations/20260930123615_g3_els_verify_batch_v1.sql'
      - 'supabase/migrations/20260930123633_g3_els_publish_truth_gate_v1.sql'
      - 'supabase/migrations/20260930004844_g3_els_one_engine_compat_wrapper_closure_v1.sql'
      - 'supabase/migrations/20260929200732_g3_els_provenance_v3_to_v9_reconciliation_v1.sql'
      - 'supabase/functions/els-search-bridge/**'
      - 'src/components/TzofenEmbed.jsx'
      - 'tools/els/**'
      - 'public/tzofen.html'
      - 'test/els-verify-batch.test.mjs'
      - 'supabase/migrations/*_els_*save*.sql'
      - 'test/els-*save*.sql'
      - 'test/els-adaptive-router.test.mjs'
      - 'test/els-browser-truth-census.test.mjs'
      - 'test/els-browser-cutover.test.mjs'
      - 'test/els-native-ui-browser.test.mjs'
      - 'test/els-window-directions.test.mjs'
      - 'test/els-search-parity-repairs.test.mjs'
      - 'test/els-*.test.mjs'
      - 'test/helpers/els-matrix-reading*.mjs'
      - 'test/fixtures/els-matrix-reading*.sql'
      - 'test/fixtures/els-matrix-reading/**'
      - 'supabase/functions/_shared/elsMatrixReading*.js'
      - 'supabase/functions/_shared/elsChanceModel.js'
      - 'supabase/migrations/20261029125427_els_matrix_reading_durable_jobs.sql'
      - 'scripts/els-browser-shards.mjs'
      - 'src/components/experience2029/ElsSavePanel2029.jsx'
      - 'src/lib/elsSavedMatrix.js'
      - 'package-lock.json'
      - '.nvmrc'
  workflow_dispatch:

# Cancel only superseded PR checks. Manual and push runs retain their own run identity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  els-core-contracts:
    # Pin the generator toolchain as well as browser compatibility; newer Python/zlib
    # can produce different gzip bytes for identical canonical text.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install application and pinned test-only helpers
        run: |
          npm ci
          npm install --no-save --prefix "$RUNNER_TEMP/els-tools" acorn@8.15.0
          echo "NODE_PATH=$RUNNER_TEMP/els-tools/node_modules" >> "$GITHUB_ENV"

      - name: Complete and disjoint native scenario coverage
        run: node --test test/els-browser-shards.test.mjs

      - name: Static one-engine contract tests
        run: node --test test/els-core-compatibility.test.mjs

      - name: Deterministic template -> public/tzofen.html build sync
        run: |
          python3 tools/els/build.py
          git diff --exit-code -- public/tzofen.html

      - name: Adaptive router + browser truth-authority census
        run: node --test test/els-adaptive-router.test.mjs test/els-browser-truth-census.test.mjs test/els-window-directions.test.mjs test/els-search-parity-repairs.test.mjs

      - name: Exact replay and 2029 projection acceptance
        run: |
          node --test \
            test/els-2029-presentation.test.mjs \
            test/els-host-bridge.test.mjs \
            test/els-search-bridge.test.mjs \
            test/els-2029-semantic-surface.test.mjs \
            test/els-2029-result-projection.test.mjs \
            test/els-2029-layered-projection.test.mjs \
            test/els-2029-vector-geometry.test.mjs \
            test/els-2029-spatial-depth.test.mjs \
            test/els-2029-matrix-volume.test.mjs \
            test/els-2029-matrix-mode.test.mjs \
            test/els-2029-matrix-profile-switch.test.mjs \
            test/els-2029-classic-faithful-port.test.mjs \
            test/els-2029-visual-representation.test.mjs \
            test/els-2029-exact-replay-visual-feed.test.mjs \
            test/els-2029-raziel-consumer.test.mjs \
            test/els-2029-explain-guidance.test.mjs \
            test/els-raziel-context.test.mjs
          node --test test/els-saved-discovery.test.mjs test/els-discovery-structure-sources.test.mjs
          node --test test/els-matrix-reading-indicator.test.mjs test/els-matrix-reading-activity.test.mjs test/els-matrix-reading-transport.test.mjs

      - name: Install PostgreSQL server + client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'postgres'"
          sudo -u postgres createdb sod1820_els_compat
          PGPASSWORD=postgres psql -h localhost -U postgres -d sod1820_els_compat -v ON_ERROR_STOP=1 -Atqc 'select version()'

      - name: Executable canonical stream, batch verifier, privacy and durable SQL acceptance
        env:
          ELS_REQUIRE_EXECUTABLE: '1'
        run: >-
          node --test --test-concurrency=1 test/els-tanakh-canonical-stream.test.mjs test/els-verify-batch.test.mjs
          test/els-matrix-reading-durable-jobs-sql.test.mjs test/els-matrix-reading-durable-postgres-integration.test.mjs

      - name: Compile migrations and run executable SQL acceptance
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: sod1820_els_compat
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f test/els-core-compatibility-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150500_g3_els_callable_core_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150600_g3_els_callable_core_search_path_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150700_g3_els_callable_wrapper_security_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150800_g3_els_legacy_projection_parity_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150900_g3_els_core_compatibility_extension_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916151000_g3_els_core_compatibility_truth_hardening_v1.sql
          psql -v ON_ERROR_STOP=1 -f test/els-core-compatibility.sql

  els-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            companion: test/els-browser-cutover.test.mjs
          - shard: 2
            companion: test/els-saved-discovery-browser.test.mjs
          - shard: 3
            companion: test/els-discovery-structures-browser.test.mjs
    env:
      ELS_REQUIRE_EXECUTABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned browser runner and manifest parser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/els-tools" playwright@1.64.1 acorn@8.15.0
          echo "NODE_PATH=$RUNNER_TEMP/els-tools/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/els-browsers" >> "$GITHUB_ENV"
          echo "ELS_NATIVE_CACHE_DIR=$RUNNER_TEMP/els-native-vite" >> "$GITHUB_ENV"
      - name: Cache exact Chromium revision
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/els-browsers
          key: ubuntu-24.04-${{ runner.arch }}-els-playwright-1.64.1-v1
      - name: Install Chromium and preserve the gate's system dependencies
        run: '"$RUNNER_TEMP/els-tools/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Native browser scenarios (one disjoint third)
        run: node scripts/els-browser-shards.mjs run ${{ matrix.shard }} els-reports/shard-${{ matrix.shard }}.json
      - name: Companion browser acceptance
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 ${{ matrix.companion }}
      - name: Upload exact coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: els-browser-${{ matrix.shard }}
          path: els-reports/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Preserve the required check name; every child and the exact coverage must succeed.
  els-core-compatibility:
    if: ${{ always() }}
    needs: [els-core-contracts, els-browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all contract and browser jobs
        env:
          CONTRACTS_RESULT: ${{ needs.els-core-contracts.result }}
          BROWSER_RESULT: ${{ needs.els-browser.result }}
        run: test "$CONTRACTS_RESULT" = success && test "$BROWSER_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned manifest parser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/els-tools" acorn@8.15.0
          echo "NODE_PATH=$RUNNER_TEMP/els-tools/node_modules" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: els-browser-*
          path: els-reports
          merge-multiple: true
      - name: Prove no native scenario was missing, duplicated, skipped or stale
        run: node scripts/els-browser-shards.mjs verify els-reports
