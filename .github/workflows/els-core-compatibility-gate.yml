name: ELS Core Compatibility Gate

on:
  pull_request:
    paths:
      - 'supabase/migrations/20260916150900_g3_els_core_compatibility_extension_v1.sql'
      - 'supabase/migrations/20260916151000_g3_els_core_compatibility_truth_hardening_v1.sql'
      - 'test/els-core-compatibility.test.mjs'
      - 'test/els-core-compatibility-fixture.sql'
      - 'test/els-core-compatibility.sql'
      - 'supabase/migrations/20260930083354_g3_els_tanakh_canonical_stream_build_v1.sql'
      - 'test/els-tanakh-canonical-stream.test.mjs'
      - 'test/els-tanakh-canonical-stream-fixture.sql'
      - '.github/workflows/els-core-compatibility-gate.yml'
      - 'src/lib/research/els2029*.js'
      - 'src/lib/research/elsRazielContext.js'
      - 'src/lib/research/researchContext.js'
      - 'src/lib/research/ResearchProvider.jsx'
      - 'src/pages/Els2029Page.jsx'
      - 'src/components/experience2029/Els2029Representation.jsx'
      - 'src/components/experience2029/SystemFrame2029.jsx'
      - 'src/components/experience2029/els2029-representation.css'
      - 'test/els-2029-*.test.mjs'
      - 'test/els-raziel-context.test.mjs'
      - 'test/els-host-bridge.test.mjs'
      - 'test/els-search-bridge.test.mjs'
      - 'supabase/migrations/20260930123615_g3_els_verify_batch_v1.sql'
      - 'supabase/migrations/20260930123633_g3_els_publish_truth_gate_v1.sql'
      - 'supabase/migrations/20260930004844_g3_els_one_engine_compat_wrapper_closure_v1.sql'
      - 'supabase/migrations/20260929200732_g3_els_provenance_v3_to_v9_reconciliation_v1.sql'
      - 'supabase/functions/els-search-bridge/**'
      - 'src/components/TzofenEmbed.jsx'
      - 'tools/els/**'
      - 'public/tzofen.html'
      - 'test/els-verify-batch.test.mjs'
      - 'test/els-adaptive-router.test.mjs'
      - 'test/els-browser-truth-census.test.mjs'
      - 'test/els-browser-cutover.test.mjs'
  workflow_dispatch:

jobs:
  els-core-compatibility:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sod1820_els_compat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Static one-engine contract tests
        run: node --test test/els-core-compatibility.test.mjs

      - name: Tanakh canonical stream oracle + admission contract
        run: node --test test/els-tanakh-canonical-stream.test.mjs

      - name: Deterministic template -> public/tzofen.html build sync
        run: |
          python3 tools/els/build.py
          git diff --exit-code -- public/tzofen.html

      - name: Adaptive router + browser truth-authority census
        run: node --test test/els-adaptive-router.test.mjs test/els-browser-truth-census.test.mjs

      - name: Exact replay and 2029 projection acceptance
        run: |
          node --test \
            test/els-host-bridge.test.mjs \
            test/els-search-bridge.test.mjs \
            test/els-2029-semantic-surface.test.mjs \
            test/els-2029-result-projection.test.mjs \
            test/els-2029-layered-projection.test.mjs \
            test/els-2029-vector-geometry.test.mjs \
            test/els-2029-spatial-depth.test.mjs \
            test/els-2029-matrix-volume.test.mjs \
            test/els-2029-matrix-mode.test.mjs \
            test/els-2029-matrix-profile-switch.test.mjs \
            test/els-2029-classic-faithful-port.test.mjs \
            test/els-2029-visual-representation.test.mjs \
            test/els-2029-exact-replay-visual-feed.test.mjs \
            test/els-2029-raziel-consumer.test.mjs \
            test/els-2029-explain-guidance.test.mjs \
            test/els-raziel-context.test.mjs

      - name: Install PostgreSQL server + client
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-client

      - name: Install Playwright Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Executable batch verifier (Postgres) + browser acceptance (Chromium) - skips are failures
        env:
          ELS_REQUIRE_EXECUTABLE: '1'
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          node --test test/els-tanakh-canonical-stream.test.mjs test/els-verify-batch.test.mjs test/els-browser-cutover.test.mjs

      - name: Compile migrations and run executable SQL acceptance
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: sod1820_els_compat
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f test/els-core-compatibility-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150500_g3_els_callable_core_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150600_g3_els_callable_core_search_path_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150700_g3_els_callable_wrapper_security_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150800_g3_els_legacy_projection_parity_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916150900_g3_els_core_compatibility_extension_v1.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260916151000_g3_els_core_compatibility_truth_hardening_v1.sql
          psql -v ON_ERROR_STOP=1 -f test/els-core-compatibility.sql
