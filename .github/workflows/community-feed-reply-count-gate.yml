name: Community Feed Reply Count
# The Community feed page with each root's public reply count (speed series 2, step 2): an additive invoker wrapper over the two public
# readers. Local Postgres only; nothing reaches a shared database. Proves rows, order, rights and counts, the rollback, and that both files
# refuse to run out of order.
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261116230000_community_feed_page_v2.sql'
      - 'supabase/proposed/ROLLBACK_20261116230000_community_feed_page_v2.sql'
      - 'supabase/migrations/20261112100000_community_thread_bump_staff_v1.sql'
      - 'tests/sql/community_feed_reply_count_v1.sql'
      - '.github/workflows/community-feed-reply-count-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
# Cancel only superseded PR checks. Manual and push runs retain their own run identity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reply-count:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: community_feed_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: fixture_only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: community_feed_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Apply, compare with community_feed_page, roll back
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/community_feed_reply_count_v1.sql
      - name: Both files refuse to run out of order and leave the function in place
        run: |
          if psql -v ON_ERROR_STOP=1 -q -f supabase/proposed/ROLLBACK_20261116230000_community_feed_page_v2.sql; then echo "rollback ran without the wrapper"; exit 1; fi
          psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261116230000_community_feed_page_v2.sql
          if psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261116230000_community_feed_page_v2.sql; then echo "the migration ran twice"; exit 1; fi
          test "$(psql -Atc "select count(*) from public.community_feed_page_v2(0, 10, 'newest')")" = 6
