name: ELS Journey state guard one-shot

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  guard-test-commit:
    if: github.event.pull_request.head.ref == 'gpt/els-research-journey-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Accept Journey state only after exact hitId verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/ElsWorkAreaPage.jsx')
          s=p.read_text(encoding='utf-8')
          old='''  const onState = useCallback((next) => {
    setEngineState(next); setSeen((x) => x + 1); setWaiting(false); setFirstRunHint(false);
    const pending = journeyPendingRef.current;
    const nextTerm = next?.termRaw || next?.term || "";
    if (!pending || next?.status !== "ok" || (nextTerm !== pending.loadItem.term && next?.term !== pending.loadItem.term)) return;
    if (!journeyAnchorMatches(next, pending.target)) {
      journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null);
      setJourneyError("המנוע חזר למופע אחר מהעוגן שביקשנו — המסע לא התקדם."); return;
    }
    if (pending.kind === "promote") setJourneyTrail((prev) => [...prev, pending.snapshot]);
    else if (pending.kind === "restore") {
      setJourneyTrail(pending.nextTrail || []);
      const v = pending.restoreView || {};
      if (v.mode && MODES.some((m) => m.id === v.mode)) setMode(v.mode);
      if (v.viewMode && VIEW_MODES.some((m) => m.id === v.viewMode)) setViewMode(v.viewMode);
      if (typeof v.matrixRtl === "boolean") setMatrixRtl(v.matrixRtl);
      if (Number.isFinite(Number(v.cellSize))) setCellSize(Number(v.cellSize));
    }
    setQuery(nextTerm); setSelectedCell(null); setJourneyError("");
    journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null);
  }, []);'''
          new='''  const onState = useCallback((next) => {
    const pending = journeyPendingRef.current;
    const nextTerm = next?.termRaw || next?.term || "";
    if (pending) {
      const sameTargetTerm = nextTerm === pending.loadItem.term || next?.term === pending.loadItem.term;
      if (next?.status !== "ok" || !sameTargetTerm) return;
      if (!journeyAnchorMatches(next, pending.target)) {
        journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null); setWaiting(false);
        setJourneyError("המנוע חזר למופע אחר מהעוגן שביקשנו — המצב המוצג לא הוחלף."); return;
      }
    }
    // Only accepted engine state reaches the visible Surface.
    setEngineState(next); setSeen((x) => x + 1); setWaiting(false); setFirstRunHint(false);
    if (!pending) return;
    if (pending.kind === "promote") setJourneyTrail((prev) => [...prev, pending.snapshot]);
    else if (pending.kind === "restore") {
      setJourneyTrail(pending.nextTrail || []);
      const v = pending.restoreView || {};
      if (v.mode && MODES.some((m) => m.id === v.mode)) setMode(v.mode);
      if (v.viewMode && VIEW_MODES.some((m) => m.id === v.viewMode)) setViewMode(v.viewMode);
      if (typeof v.matrixRtl === "boolean") setMatrixRtl(v.matrixRtl);
      if (Number.isFinite(Number(v.cellSize))) setCellSize(Number(v.cellSize));
    }
    setQuery(nextTerm); setSelectedCell(null); setJourneyError("");
    journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null);
  }, []);'''
          if s.count(old)!=1: raise SystemExit(f'onState guard match count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          grep -F 'Only accepted engine state reaches the visible Surface.' src/pages/ElsWorkAreaPage.jsx
      - name: Verify and build
        run: |
          node scripts/verify-els-journey-contract.mjs
          npm ci
          npm run build
      - name: Commit and remove one-shot
        run: |
          git config user.name 'GPT Research Agent 2'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/els-journey-state-guard-one-shot.yml
          git add src/pages/ElsWorkAreaPage.jsx
          git commit -m 'fix(els-lab): verify Journey hit before visible state swap'
          git push origin HEAD:${{ github.head_ref }}
