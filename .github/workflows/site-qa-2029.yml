name: Site QA (isolated login)

# "בדוק את האתר" with a login and, next, writes (ZURIEL 26.11.2026). Everything runs inside this job and is destroyed with it:
# a throwaway local Supabase (Docker, GoTrue + PostgREST only), the built production artifact served at the production URLs by the existing
# fixture server, Chromium mapping the Supabase host to the local stack and every other host to nothing, and a synthetic account created
# here with a random password. No secret, no GitHub environment, no production key or row. Manual only.

on:
  # TEMPORARY (remove before merge): proves the runner from this branch.
  push:
    branches: [claude/site-e2e-p2-ui]
    paths: [.github/workflows/site-qa-2029.yml, scripts/qa-*.mjs, scripts/build-qa-*.mjs, qa/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-qa
  cancel-in-progress: false

jobs:
  qa:
    if: github.repository == 'zuriel337/sod1820'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Dependencies and the production artifact (the build the CI already uses)
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-public-reading-production.mjs
      - name: Browser tooling (1.64.1, the version the ELS browser gates use)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Local Supabase (throwaway, Docker) with the existing ELS verification function
        run: |
          node scripts/build-qa-prod-definitions.mjs
          node scripts/build-qa-schema.mjs
          node scripts/build-qa-corpus.mjs
          # The real Edge Function the site calls to verify every occurrence is served by the local edge runtime, from the repository's own file (a copy made at job time, not committed).
          mkdir -p qa/supabase/functions/els-search-bridge
          cp supabase/functions/els-search-bridge/index.ts qa/supabase/functions/els-search-bridge/index.ts
          npx --yes supabase@3.4.0 start --workdir qa -x studio,imgproxy,logflare,vector,realtime,storage-api,mailpit,postgres-meta,supavisor
          npx --yes supabase@3.4.0 status --workdir qa -o env > "$RUNNER_TEMP/qa.env"
          echo "status variables: $(cut -d= -f1 "$RUNNER_TEMP/qa.env" | tr '\n' ' ')"
          set -a; . "$RUNNER_TEMP/qa.env"; set +a
          # the existing Torah corpus (public text) into the QA database
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "\\copy public.torah_stream(idx,ch) from 'qa/corpus/torah.csv' csv"
          psql "$DB_URL" -At -c "select count(*) from public.torah_stream" | sed 's/^/torah_stream rows: /'
          # QA configuration (not user data): the availability flag the edge function names is present and open, as on a live site
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.site_flags(key, enabled, message, mode) values ('lock_els', false, null, 'all') on conflict (key) do nothing"
      - name: QA check (login and the three publication tiers against the local backend)
        run: |
          set -a; . "$RUNNER_TEMP/qa.env"; set +a
          export QA_SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export QA_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export QA_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          echo "::add-mask::$QA_ANON_KEY"; echo "::add-mask::$QA_SERVICE_ROLE_KEY"
          set +e
          node scripts/qa-site-2029.mjs 2>&1 | tee qa.log
          code=${PIPESTATUS[0]}
          { echo '### בדיקת האתר בסביבה מבודדת'; echo '```'; grep -E '^(PASS|FAIL)' qa.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node scripts/site-e2e-report-2029.mjs qa-out/report.json >> "$GITHUB_STEP_SUMMARY" || true
          exit $code
      - name: Stop and discard the local stack
        if: always()
        run: npx --yes supabase@3.4.0 stop --workdir qa --no-backup
