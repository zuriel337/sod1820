name: One-off Legacy Dark Background Dropbox Import

on:
  push:
    branches:
      - gpt/legacy-dark-bg-dropbox-20260930-v2

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original from Dropbox
        env:
          DROPBOX_URL: 'https://uc5f892bca2d29659b3b8fed31b3.dl.dropboxusercontent.com/cd/0/get/DJGWmj7-ME5Lx3z-v_o2H5-VudyT3Ux45pji7iVj_dUDOOCelIi0sIGb0wHbUUXlHaIgX3mVeKcNZwJ_diWe6cx3Yx0FTwpN8BpyghfFBKYkFTplKSlGGxabOA7YlblkXpMPgRvVgb8vmq97ouePVeLa6LYj7KXhBlrdm3Pa8oVJWA/file?c_luid=bc1a06a4'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/legacy-bg.png "$DROPBOX_URL"
          test "$(stat -c %s /tmp/legacy-bg.png)" = "1470880"

      - name: Verify Dropbox content hash and PNG dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          p=Path('/tmp/legacy-bg.png')
          data=p.read_bytes()
          assert len(data)==1470880, len(data)
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          block=4*1024*1024
          digests=b''.join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
          dbx=hashlib.sha256(digests).hexdigest()
          assert dbx=='2f8cc4ff62359e66e88885c94b74c0203fc317a17e8b34529937f9636abe2028', dbx
          w,h=struct.unpack('>II',data[16:24])
          print(f'verified Dropbox original: {len(data)} bytes, {w}x{h}, content_hash={dbx}')
          PY

      - name: Install exact PNG and patch Legacy SpaceBackground only
        run: |
          set -euo pipefail
          cp /tmp/legacy-bg.png public/legacy-dark-bg-2026-09-30.png
          python - <<'PY'
          from pathlib import Path
          p=Path('src/legacy/legacy.jsx')
          s=p.read_text()
          old='backgroundImage: "url(https://images.unsplash.com/photo-1444723121867-7a241cacace9?w=1920&q=80)",'
          new='backgroundImage: "url(/legacy-dark-bg-2026-09-30.png)",'
          count=s.count(old)
          assert count==1, f'expected exactly one SpaceBackground city URL, found {count}'
          p.write_text(s.replace(old,new))
          PY
          cmp --silent /tmp/legacy-bg.png public/legacy-dark-bg-2026-09-30.png
          git diff --check
          git diff -- src/legacy/legacy.jsx

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit exact asset and one-line Legacy change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/legacy-dark-bg-2026-09-30.png src/legacy/legacy.jsx
          git commit -m "Legacy: replace dark city background with SOD1820 asset"
          git push origin HEAD:gpt/legacy-dark-bg-dropbox-20260930-v2
