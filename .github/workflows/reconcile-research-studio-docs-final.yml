name: Research Studio docs reconcile final once
on:
  push:
    branches: [gpt/research-studio-v1-contract]
    paths: ['.github/workflows/reconcile-research-studio-docs-final.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/research-studio-v1-contract
          fetch-depth: 0
      - name: Finalize reconciliation wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          rp=Path('SOD1820_MASTER_ROADMAP.md'); mp=Path('SOD1820_MASTER_STATE.md')
          r=rp.read_text(encoding='utf-8'); m=mp.read_text(encoding='utf-8')

          old='> **✅ v5.1 קנוני.** Reconciliation ממוקד של v5 בעקבות סגירת **Research DNA v1 Foundation Contract**'
          if old not in r: raise SystemExit('roadmap v5.1 intro anchor missing')
          r=r.replace(old, '> **🟡 v5.2 מועמד-קנוני על PR #187; v5.1 נשאר קנוני ב-main עד merge.** Reconciliation 24.8 מוסיף את Research Studio v1 המאושר ואת סדר-העדיפות החדש; ההמשך ההיסטורי של v5.1 נשמר להלן כ-provenance. בסיס v5.1 נוצר בעקבות סגירת **Research DNA v1 Foundation Contract**',1)
          r=r.replace('**`ACTIVE_NOW` אינו-משתנה ב-pass הזה** — עדיין `WS-GEMATRIA-CORPUS-PACKAGES`, ללא-הצדקה-לשינוי.', '**הערת-היסטוריה v5.1:** באותו pass `ACTIVE_NOW` נשאר `WS-GEMATRIA-CORPUS-PACKAGES`; **החלטת 24.8 למעלה מחליפה זאת בניווט ל-`WS-RESEARCH-STUDIO-FOUNDATION`**, בלי לבטל את workstream הקורפוס.',1)
          r=r.replace('- **LAST_RECONCILED:** `2026-08-22` (v5.1 reconciliation;', '- **LAST_RECONCILED (main canonical):** `2026-08-22` (v5.1 reconciliation;',1)
          sync='- **SYNC STATUS:** `STALE on main` / **`RECONCILED-CANDIDATE` on PR #187** — v5.2 candidate captures verified work through 24.8.2026; main remains v5.1 until Human-Gate merge.'
          if sync not in r: raise SystemExit('sync candidate line missing')
          r=r.replace(sync, '- **LAST_RECONCILED (PR #187 candidate):** `2026-08-24` against main `a665a4dc` + verified work_log/PR state through #188.\n'+sync,1)

          marker='### NEXT ACTION\nHuman Preview #188 → verify canonical Number/Gematria callable path → add Number/Gematria adapter. Do not build a parallel Workspace/Graph/engine and do not calculate gematria from memory.'
          if marker not in m: raise SystemExit('master next action marker missing')
          add='''### CHANGE LOG ENTRY — 24.8.2026\n- **מה השתנה:** Research Studio v1 + Universal Finding + Layered/3D first-class + ResearchProvider reuse + priority order documented in §0-A and Roadmap v5.2 candidate.\n- **למה:** Human-Gate ZURIEL approved the architecture; live state after PR #185 and Drafts #186/#188 made Roadmap v5.1 stale.\n- **מה הוחלף:** navigation-level `ACTIVE_NOW=WS-GEMATRIA-CORPUS-PACKAGES` is superseded by `WS-RESEARCH-STUDIO-FOUNDATION`; the corpus workstream itself is preserved as a dependency/source, not deleted or superseded.\n- **סטטוס:** `APPROVED` architecture/priority decision · `DOCUMENTED` on Draft PR #187 · product code remains `BUILDING` on Drafts #186/#188 · no merge/deploy implied.\n\n'''
          m=m.replace(marker, marker+'\n\n'+add,1)
          rp.write_text(r,encoding='utf-8'); mp.write_text(m,encoding='utf-8')
          PY
          git diff --check
          grep -q 'LAST_RECONCILED (PR #187 candidate).*2026-08-24' SOD1820_MASTER_ROADMAP.md
          grep -q 'CHANGE LOG ENTRY — 24.8.2026' SOD1820_MASTER_STATE.md
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/reconcile-research-studio-docs-final.yml
          git config user.name 'GPT Research Agent 2'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add SOD1820_MASTER_ROADMAP.md SOD1820_MASTER_STATE.md .github/workflows/reconcile-research-studio-docs-final.yml
          git commit -m 'docs: finalize Research Studio v5.2 reconciliation'
          git push origin HEAD:gpt/research-studio-v1-contract
