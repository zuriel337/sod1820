name: Gematria Foundation Focused Test Once

on:
  pull_request:
    branches: [main]

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --test src/lib/research/gematriaCalculationContract.test.js
