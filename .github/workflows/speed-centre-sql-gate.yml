name: Speed Centre SQL
# The speed centre (ZURIEL 17.11.2026): the extended Traffic Intelligence reader (admin_2029_analytics) and the Web Vitals watch inside the
# existing health watch. Local Postgres only; nothing reaches a shared database. Starts from the reviewed definitions in the repository,
# applies the migration, checks the report and the watch (regression, measurement gap, de-duplication, privileges), rolls back to the exact
# previous definitions and proves both files refuse to run out of order.
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261117120000_speed_centre_web_vitals.sql'
      - 'supabase/proposed/ROLLBACK_20261117120000_speed_centre_web_vitals.sql'
      - 'supabase/proposed/20261115180000_measurement_identity_PROPOSAL.sql'
      - 'supabase/migrations/20260929170000_g3_reliability_preclose_v1.sql'
      - 'tests/sql/speed_centre_*.sql'
      - 'tests/sql/run-speed-centre.sh'
      - 'tests/sql/extract-function.mjs'
      - 'supabase/migrations/20261117160000_post_document_freshness.sql'
      - 'supabase/proposed/ROLLBACK_20261117160000_post_document_freshness.sql'
      - 'tests/sql/post_document_*.sql'
      - 'tests/sql/live/posts-writers-*.sql'
      - 'tests/sql/run-post-document-freshness.sh'
      - 'tests/sql/post-document-keys-check.mjs'
      - 'post-document-freshness.js'
      - 'supabase/migrations/20261119220000_egress_24h_window.sql'
      - 'supabase/proposed/ROLLBACK_20261119220000_egress_24h_window.sql'
      - 'tests/sql/egress_24h_*'
      - 'tests/sql/live/egress-readers-20261119.sql'
      - 'tests/sql/run-egress-24h.sh'
      - 'route-legitimacy.js'
      - '.github/workflows/speed-centre-sql-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speed-centre-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: speed_centre_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: fixture_only
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: speed_centre_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fixture, reviewed base definitions, migration, report and watch assertions, rollback, refuse twice
        run: bash tests/sql/run-speed-centre.sh
      # Post document freshness (ZURIEL 17.11.2026, CDN experiment): the live writers of posts (bodies equal to the live ones by md5) through
      # the editor, agent and SQL paths; every document change is logged in the same transaction and asks for a purge; non-document changes
      # are not; a change that cannot be logged does not happen; purges are confirmed, retried once and reported; edge and database agree on
      # every address key; exact rollback. A fresh database, so the speed centre run above does not leak into it.
      - name: Post document freshness (writers incl. information units, log, purge requests, confirmation watch, edge keys, rollback)
        run: |
          psql -d postgres -c "create database post_document_fixture"
          PGDATABASE=post_document_fixture bash tests/sql/run-post-document-freshness.sh
      - name: Observed Egress 24h (measured windows, explicit coverage, duplicate revisions, missing data, reader permissions, rollback)
        run: |
          psql -d postgres -c "create database egress_window_fixture"
          PGDATABASE=egress_window_fixture bash tests/sql/run-egress-24h.sh
