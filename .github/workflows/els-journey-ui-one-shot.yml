name: ELS Journey UI one-shot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  wire-test-commit:
    if: github.event.pull_request.head.ref == 'gpt/els-research-journey-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Harden exact-anchor failure and wire Journey host UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) Canonical engine: exact Journey load must fail atomically + report to host.
          path = 'tools/els/els-code.template.html'
          old = '''  function loadMatrix(item,filmTimes){
    st.zoom=1;st.fit=true;   // כל טעינה מתחילה מותאמת-למסך
    st.verseHL=-1;   // 📖 מטריצה חדשה = מנקים הדגשת-פסוק קודמת (המצב עצמו נשאר כפי שהוא)
    st.scope=item.scope==="tanakh"?"tanakh":"torah";updateScopeUI();   // מטריצה שמורה נטענת בהיקף שבו נמצאה
    st.postUrl=item.postUrl||"";st.postTitle=item.postTitle||"";   // 📖 קישור-לפוסט של המטריצה
    st.desc=item.desc||"";   // 📖 הסבר-הצופן (מוצג מתחת למטריצה, שמור באתר)
    st.author=item.author||"";   // ✍️ שם-המחבר (לפרֵה-מילוי חלון חובת-ההסבר בשמירה חוזרת)
    st.cipherSlug=item.slug||"";st.cipherTerm=item.term||"";   // 🔗 1ב — הקשר-הצופן: מאפשר «שתף כממצא» כתגובה

    q.value=item.term;st.raw=item.term;st.res=findAll(item.term,4000);
    if(!st.res.hits.length){updGem();render();return;}
    const exactStart=item.start!=null?Number(item.start):null;
    const exactDir=item.dir===1||item.dir===-1?item.dir:null;
    const exactRequested=Number.isFinite(exactStart)&&exactDir!=null&&item.skip!=null;'''
          new = '''  function loadMatrix(item,filmTimes){
    const exactStart=item.start!=null?Number(item.start):null;
    const exactDir=item.dir===1||item.dir===-1?item.dir:null;
    const exactRequested=Number.isFinite(exactStart)&&exactDir!=null&&item.skip!=null;
    const prev=exactRequested?{zoom:st.zoom,fit:st.fit,verseHL:st.verseHL,scope:st.scope,postUrl:st.postUrl,postTitle:st.postTitle,desc:st.desc,author:st.author,cipherSlug:st.cipherSlug,cipherTerm:st.cipherTerm,raw:st.raw,res:st.res,q:q.value}:null;
    const failExact=()=>{if(prev){st.zoom=prev.zoom;st.fit=prev.fit;st.verseHL=prev.verseHL;st.scope=prev.scope;st.postUrl=prev.postUrl;st.postTitle=prev.postTitle;st.desc=prev.desc;st.author=prev.author;st.cipherSlug=prev.cipherSlug;st.cipherTerm=prev.cipherTerm;st.raw=prev.raw;st.res=prev.res;q.value=prev.q;updateScopeUI();}
      postHost({type:"load-error",reason:"exact-anchor-miss",requested:{term:item.term||"",hitId:item.hitId||"",skip:item.skip,start:item.start,dir:item.dir}});toast("לא ניתן לעגן את הממצא המדויק");};
    st.zoom=1;st.fit=true;   // כל טעינה מתחילה מותאמת-למסך
    st.verseHL=-1;   // 📖 מטריצה חדשה = מנקים הדגשת-פסוק קודמת (המצב עצמו נשאר כפי שהוא)
    st.scope=item.scope==="tanakh"?"tanakh":"torah";updateScopeUI();   // מטריצה שמורה נטענת בהיקף שבו נמצאה
    st.postUrl=item.postUrl||"";st.postTitle=item.postTitle||"";   // 📖 קישור-לפוסט של המטריצה
    st.desc=item.desc||"";   // 📖 הסבר-הצופן (מוצג מתחת למטריצה, שמור באתר)
    st.author=item.author||"";   // ✍️ שם-המחבר (לפרֵה-מילוי חלון חובת-ההסבר בשמירה חוזרת)
    st.cipherSlug=item.slug||"";st.cipherTerm=item.term||"";   // 🔗 1ב — הקשר-הצופן: מאפשר «שתף כממצא» כתגובה

    q.value=item.term;st.raw=item.term;st.res=findAll(item.term,4000);
    if(!st.res.hits.length){if(exactRequested){failExact();return;}updGem();render();return;}'''
          replace_once(path, old, new, 'engine atomic exact load')
          replace_once(path,
              '    if(idx<0&&exactRequested){toast("לא ניתן לעגן את הממצא המדויק");return;}',
              '    if(idx<0&&exactRequested){failExact();return;}',
              'engine exact miss callback')
          replace_once(path,
              '      st.editId=d.item.id||null; st.editTerm=norm(d.item.term||"");',
              '      if(!d.item.journey){st.editId=d.item.id||null; st.editTerm=norm(d.item.term||"");}',
              'engine journey edit isolation')

          # 2) TzofenEmbed: raw host loadRequest for the same canonical iframe + explicit error callback.
          path = 'src/components/TzofenEmbed.jsx'
          replace_once(path,
              'export default function TzofenEmbed({ seed = "", full = false, matrix = null, fromTopic = null, onQuality = null, onState = null, hiddenBridge = false, lensRequest = null, onLens = null }) {',
              'export default function TzofenEmbed({ seed = "", full = false, matrix = null, fromTopic = null, onQuality = null, onState = null, hiddenBridge = false, lensRequest = null, onLens = null, loadRequest = null, onLoadError = null }) {',
              'embed props')
          replace_once(path,
              '        if (matrix) postToTool({ type: "load-matrix", item: rowToItem(matrix) });   // 🔗 עמוד-צופן קנוני\n        // 📜 בקשת-Lens פעילה',
              '        if (matrix) postToTool({ type: "load-matrix", item: rowToItem(matrix) });   // 🔗 עמוד-צופן קנוני\n        if (loadRequest?.item?.term) postToTool({ type: "load-matrix", item: loadRequest.item });   // 🧭 Journey — אותו מנוע, עוגן מדויק\n        // 📜 בקשת-Lens פעילה',
              'embed ready load request')
          replace_once(path,
              '      if (d.type === "lens") {\n        // 📜 תשובת-Lens on-demand (למשל verse-context) — קריאה בלבד, לא נוגעת ב-state/Finding.\n        onLens?.(d);\n        return;\n      }',
              '      if (d.type === "lens") {\n        // 📜 תשובת-Lens on-demand (למשל verse-context) — קריאה בלבד, לא נוגעת ב-state/Finding.\n        onLens?.(d);\n        return;\n      }\n      if (d.type === "load-error") {\n        onLoadError?.(d);\n        return;\n      }',
              'embed load error')
          replace_once(path,
              '  }, [verified, postTier, saveToCloud, user, pushSavedMatrices, matrix, postToTool, navigate, isAdmin, onQuality, onState, onLens, lensRequest]);',
              '  }, [verified, postTier, saveToCloud, user, pushSavedMatrices, matrix, postToTool, navigate, isAdmin, onQuality, onState, onLens, lensRequest, loadRequest, onLoadError]);',
              'embed message deps')
          replace_once(path,
              '  // עמוד-צופן קנוני: אם ה-matrix מתחלף אחרי שהכלי כבר נטען — טוענים אותו מחדש.',
              '  // 🧭 Journey/navigation load — raw loadMatrix item from the host. Re-sent on ready above if the iframe was not ready yet.\n  useEffect(() => {\n    if (!loadRequest?.item?.term) return;\n    postToTool({ type: "load-matrix", item: loadRequest.item });\n  }, [loadRequest, postToTool]);\n\n  // עמוד-צופן קנוני: אם ה-matrix מתחלף אחרי שהכלי כבר נטען — טוענים אותו מחדש.',
              'embed load effect')

          # 3) Lab Surface: exact promote/restore, breadcrumb, no React-side ELS calculation.
          path = 'src/pages/ElsWorkAreaPage.jsx'
          replace_once(path,
              'import TzofenEmbed from "../components/TzofenEmbed.jsx";\n',
              'import TzofenEmbed from "../components/TzofenEmbed.jsx";\nimport { buildJourneyPromotion, buildJourneyRestore, journeyAnchorMatches } from "../lib/elsJourney.js";\n',
              'lab journey import')
          replace_once(path,
              '  const [activeVerseIndex, setActiveVerseIndex] = useState(null);\n',
              '  const [activeVerseIndex, setActiveVerseIndex] = useState(null);\n  // 🧭 Research Journey — host navigation only. Every transition is an exact engine-owned hitId load.\n  const [journeyTrail, setJourneyTrail] = useState([]);\n  const [journeyPending, setJourneyPending] = useState(null);\n  const [journeyLoad, setJourneyLoad] = useState(null);\n  const [journeyError, setJourneyError] = useState("");\n  const journeyPendingRef = useRef(null);\n',
              'lab journey state')
          old = '''  const onState = useCallback((next) => {
    setEngineState(next); setSeen((x) => x + 1); setWaiting(false); setFirstRunHint(false);
  }, []);
  const runSearch = (e) => {
    e?.preventDefault?.(); const q = query.trim(); if (q.length < 2) return;
    setEngineState(null); setSelectedCell(null); setSeed(q); setWaiting(true); setFirstRunHint(false); setRunNonce((x) => x + 1);
  };'''
          new = '''  const onState = useCallback((next) => {
    setEngineState(next); setSeen((x) => x + 1); setWaiting(false); setFirstRunHint(false);
    const pending = journeyPendingRef.current;
    const nextTerm = next?.termRaw || next?.term || "";
    if (!pending || next?.status !== "ok" || (nextTerm !== pending.loadItem.term && next?.term !== pending.loadItem.term)) return;
    if (!journeyAnchorMatches(next, pending.target)) {
      journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null);
      setJourneyError("המנוע חזר למופע אחר מהעוגן שביקשנו — המסע לא התקדם."); return;
    }
    if (pending.kind === "promote") setJourneyTrail((prev) => [...prev, pending.snapshot]);
    else if (pending.kind === "restore") {
      setJourneyTrail(pending.nextTrail || []);
      const v = pending.restoreView || {};
      if (v.mode && MODES.some((m) => m.id === v.mode)) setMode(v.mode);
      if (v.viewMode && VIEW_MODES.some((m) => m.id === v.viewMode)) setViewMode(v.viewMode);
      if (typeof v.matrixRtl === "boolean") setMatrixRtl(v.matrixRtl);
      if (Number.isFinite(Number(v.cellSize))) setCellSize(Number(v.cellSize));
    }
    setQuery(nextTerm); setSelectedCell(null); setJourneyError("");
    journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null);
  }, []);
  const onLoadError = useCallback((d) => {
    if (d?.reason !== "exact-anchor-miss") return;
    journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null); setWaiting(false);
    setJourneyError("העוגן המדויק כבר לא זמין בתוצאת המנוע. המצב הקודם נשמר ולא הוחלף.");
  }, []);
  const runSearch = (e) => {
    e?.preventDefault?.(); const q = query.trim(); if (q.length < 2) return;
    journeyPendingRef.current = null; setJourneyPending(null); setJourneyLoad(null); setJourneyTrail([]); setJourneyError("");
    setEngineState(null); setSelectedCell(null); setSeed(q); setWaiting(true); setFirstRunHint(false); setRunNonce((x) => x + 1);
  };'''
          replace_once(path, old, new, 'lab state handler')
          replace_once(path,
              '  const lenses = Array.isArray(matrix?.lenses) ? matrix.lenses : [];\n',
              '''  const lenses = Array.isArray(matrix?.lenses) ? matrix.lenses : [];

  const beginJourneyLoad = (pending, item) => {
    journeyPendingRef.current = pending; setJourneyPending(pending); setJourneyError(""); setWaiting(true); setSelectedCell(null);
    setJourneyLoad({ id: `${Date.now()}-${Math.random()}`, item });
  };
  const promoteFinding = (finding) => {
    const p = buildJourneyPromotion(s, finding, { scope: s?.scope, view: { mode, viewMode, matrixRtl, cellSize } });
    if (!p.ok) { setJourneyError("לממצא הזה אין כרגע עוגן מוצג שאפשר להפוך לציר."); return; }
    beginJourneyLoad({ kind: "promote", target: p.target, snapshot: p.snapshot, loadItem: p.loadItem }, p.loadItem);
  };
  const restoreJourney = (snapshot, index) => {
    const r = buildJourneyRestore(snapshot);
    if (!r.ok) { setJourneyError("לא ניתן לשחזר את נקודת המחקר הזו."); return; }
    beginJourneyLoad({ kind: "restore", target: r.target, loadItem: r.loadItem, nextTrail: journeyTrail.slice(0, index), restoreView: snapshot.view }, r.loadItem);
  };
''',
              'lab journey actions')
          replace_once(path,
              '<TzofenEmbed key={`${seed}-${runNonce}`} seed={seed || undefined} onState={onState} hiddenBridge={!showEngine} lensRequest={lensRequest} onLens={onLens} />',
              '<TzofenEmbed key={`${seed}-${runNonce}`} seed={seed || undefined} onState={onState} hiddenBridge={!showEngine} lensRequest={lensRequest} onLens={onLens} loadRequest={journeyLoad} onLoadError={onLoadError} />',
              'lab embed props')
          replace_once(path,
              '    <div className="els-native-layout"><main style={{ minWidth: 0 }}>',
              '''    {(journeyTrail.length > 0 || ok || journeyError) && <div style={{ ...card, padding: "9px 11px", marginBottom: 10, display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
      <span style={{ ...title, fontSize: 11.5 }}>🧭 מסלול מחקר</span>
      {journeyTrail.map((snap, i) => <React.Fragment key={`${snap.axis?.hitId || snap.term}-${i}`}><button type="button" disabled={Boolean(journeyPending)} onClick={() => restoreJourney(snap, i)} style={{ minHeight: 38, borderRadius: 999, padding: "0 12px", border: `1px solid ${P.border}`, background: P.cardSoft, color: P.accentText, fontFamily: F.heading, fontWeight: 850, cursor: "pointer" }}>↩ {snap.term}</button><span style={{ color: P.inkSoft }}>←</span></React.Fragment>)}
      {ok && <span style={{ minHeight: 38, display: "inline-flex", alignItems: "center", borderRadius: 999, padding: "0 12px", background: P.accentBtn, color: P.onAccent, fontFamily: F.heading, fontWeight: 900 }}>{s.termRaw || s.term}</span>}
      {journeyPending && <span style={{ ...muted, fontSize: 11.5 }}>מעגן במנוע…</span>}
      {journeyError && <span style={{ color: "#b42318", fontFamily: F.body, fontSize: 11.5 }}>{journeyError}</span>}
    </div>}

    <div className="els-native-layout"><main style={{ minWidth: 0 }}>''',
              'lab breadcrumb')
          replace_once(path,
              '    {mode === "discover" && <section',
              '''    {ok && findings.length > 0 && <section style={{ ...card, padding: 14, marginTop: 12 }}><div style={title}>🧭 המשך מה־Finding</div><div style={{ ...muted, fontSize: 11.5, marginTop: 4 }}>הפוך ממצא מוצג לציר הבא. המנוע טוען בדיוק את אותו hitId; הציר הקודם נשמר במסלול ובזהב.</div><div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginTop: 9 }}>{findings.map((f, i) => <button key={`${f.t}-${i}`} type="button" disabled={Boolean(journeyPending) || !Array.isArray(f.shown) || !f.shown.length} onClick={() => promoteFinding(f)} style={{ minHeight: 42, borderRadius: 12, padding: "0 12px", border: `1px solid ${P.border}`, background: P.cardSoft, color: P.ink, fontFamily: F.heading, fontWeight: 850, opacity: Array.isArray(f.shown) && f.shown.length ? 1 : .45 }}><i style={{ display: "inline-block", width: 8, height: 8, borderRadius: 3, background: f.color, marginInlineEnd: 5 }} />↑ ציר · {f.t}</button>)}</div></section>}

    {mode === "discover" && <section''',
              'lab promote actions')
          replace_once(path,
              '<Next>פסוק/context on-demand יהיה שכבת־המחקר הראשונה שאינה רק renderer.</Next>',
              '<Next>בחר ממצא ב־«המשך מה־Finding» כדי להפוך אותו לציר חדש; החזרה נעשית דרך מסלול המחקר למעלה.</Next>',
              'lab investigate next text')
          PY

      - name: Rebuild canonical ELS artifact
        run: |
          cd tools/els
          python3 build.py

      - name: Verify Journey contract and source invariants
        run: |
          node scripts/verify-els-journey-contract.mjs
          grep -F 'type:"load-error",reason:"exact-anchor-miss"' tools/els/els-code.template.html
          grep -F 'loadRequest={journeyLoad}' src/pages/ElsWorkAreaPage.jsx
          grep -F '↑ ציר' src/pages/ElsWorkAreaPage.jsx
          grep -F 'buildJourneyRestore' src/lib/elsJourney.js
          git diff --check

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit verified Journey slice and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'GPT Research Agent 2'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/els-journey-ui-one-shot.yml
          git add tools/els/els-code.template.html public/tzofen.html src/components/TzofenEmbed.jsx src/pages/ElsWorkAreaPage.jsx
          git commit -m 'feat(els-lab): wire exact Research Journey navigation'
          git push origin HEAD:${{ github.head_ref }}
