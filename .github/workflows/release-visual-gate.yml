name: Release Visual Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mobile-accessibility:
    name: Mobile + Accessibility Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built app
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sod1820-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sod1820-preview.log
          exit 1

      - name: Run visual release acceptance
        run: |
          mkdir -p test-results/release-visual .release-gate
          cat > .release-gate/release-visual.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'http://127.0.0.1:4173';
          const PATH = '/entity-hub-preview/number/1237';
          const widths = [320, 360, 390, 1440];

          async function assertHealthy(page, width, mode = 'dark') {
            const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
            await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
            await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
            await expect(page.locator('body')).not.toBeEmpty();
            await expect(page.locator('#sp29-title')).toBeVisible();

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyText: document.body.innerText.trim().length,
            }));
            expect(metrics.bodyText).toBeGreaterThan(100);
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);

            const interactive = page.locator('a, button, [tabindex="0"]');
            expect(await interactive.count()).toBeGreaterThan(3);
            const first = interactive.first();
            await first.focus();
            await expect(first).toBeFocused();

            await page.screenshot({
              path: `test-results/release-visual/${mode}-${width}.png`,
              fullPage: true,
            });
          }

          for (const width of widths) {
            test(`dark ${width}px has no overflow and remains interactive`, async ({ page }) => {
              await assertHealthy(page, width, 'dark');
            });
          }

          for (const mode of ['light', 'lab']) {
            test(`${mode} projection is healthy at 390px`, async ({ page }) => {
              await assertHealthy(page, 390, mode);
              await expect(page.locator('.sp29')).toHaveClass(new RegExp(`sp29--${mode}`));
            });
          }

          test('reduced motion removes ambient animation', async ({ page }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const animationName = await page.locator('.sp29-core').evaluate((el) => getComputedStyle(el).animationName);
            expect(animationName).toBe('none');
          });

          test('gallery FIT_WHOLE_IMAGE preserves all source edges across aspect ratios and release widths', async ({ page }) => {
            for (const width of widths) {
              await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
              await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
              for (const fixture of [
                { name: 'landscape', w: 1600, h: 900, tall: false },
                { name: 'portrait', w: 900, h: 1600, tall: true },
                { name: 'legacy-gematria-ratio', w: 1080, h: 1920, tall: true },
              ]) {
                const result = await page.evaluate(async ({ fixture }) => {
                  const root = document.createElement('div');
                  root.id = 'lb-release-fixture';
                  root.innerHTML = `<div class="lb-main${fixture.tall ? ' lb-scroll' : ''}" style="position:fixed;inset:0;width:100vw;height:100vh;display:flex;flex-direction:column;background:#000;z-index:2147483600"><div class="lb-imgpane" style="display:flex;flex:1 1 auto;width:100%;min-height:0"><img class="lb-img${fixture.tall ? ' tall' : ''}" alt="fixture" /></div><aside class="lb-panel" style="height:120px;flex-shrink:0">fixture</aside></div>`;
                  document.body.appendChild(root);
                  const img = root.querySelector('img');
                  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${fixture.w}" height="${fixture.h}" viewBox="0 0 ${fixture.w} ${fixture.h}"><rect width="100%" height="100%" fill="black"/><rect x="2" y="2" width="${fixture.w - 4}" height="${fixture.h - 4}" fill="none" stroke="white" stroke-width="4"/></svg>`;
                  img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
                  await img.decode();
                  const pane = root.querySelector('.lb-imgpane').getBoundingClientRect();
                  const box = img.getBoundingClientRect();
                  const style = getComputedStyle(img);
                  const out = {
                    objectFit: style.objectFit,
                    imageWidth: box.width,
                    imageHeight: box.height,
                    fullyInside: box.left >= pane.left - 0.5 && box.right <= pane.right + 0.5 && box.top >= pane.top - 0.5 && box.bottom <= pane.bottom + 0.5,
                  };
                  root.remove();
                  return out;
                }, { fixture });
                expect(result.objectFit).toBe('contain');
                expect(result.imageWidth).toBeGreaterThan(0);
                expect(result.imageHeight).toBeGreaterThan(0);
                expect(result.fullyInside).toBe(true);
              }
            }
          });

          test('shared focus-visible baseline remains visible in dark light and lab', async ({ page }) => {
            for (const mode of ['dark', 'light', 'lab']) {
              const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
              const button = page.locator('.sp29-mini-grid button').first();
              await button.focus();
              const focus = await button.evaluate((el) => {
                const s = getComputedStyle(el);
                return { style: s.outlineStyle, width: s.outlineWidth, color: s.outlineColor, offset: s.outlineOffset };
              });
              expect(focus.style).not.toBe('none');
              expect(parseFloat(focus.width)).toBeGreaterThanOrEqual(2);
              expect(parseFloat(focus.offset)).toBeGreaterThanOrEqual(2);
            }
          });

          test('200 percent text zoom and long Hebrew labels preserve layout at narrow width', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            await page.addStyleTag({ content: 'html{font-size:200%!important}' });
            await page.evaluate(() => {
              const target = document.querySelector('.sp29-mini-grid button');
              if (target) target.querySelector('span').textContent = 'כפתור מחקר עם תווית עברית ארוכה במיוחד שצריכה להישבר בצורה בטוחה בלי ליצור גלילה אופקית';
            });
            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);
            await expect(page.locator('#sp29-title')).toBeVisible();
          });

          test('mixed bidi evidence keeps Hebrew context and isolated LTR URL readable without overflow', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const result = await page.evaluate(() => {
              const host = document.createElement('div');
              host.className = 'sod-bidi-evidence';
              host.innerHTML = 'מחקר 1237 · קישור <span class="sod-ltr-island" dir="ltr">https://sod1820.co.il/number/1237?ref=ABC-42</span> · פסוק א:ב';
              host.style.maxWidth = '100%';
              host.style.padding = '12px';
              document.querySelector('.sp29-mini')?.appendChild(host);
              const url = host.querySelector('[dir="ltr"]');
              const hs = getComputedStyle(host);
              const us = getComputedStyle(url);
              const box = host.getBoundingClientRect();
              return {
                hostDirection: hs.direction,
                urlDirection: us.direction,
                right: box.right,
                left: box.left,
                viewport: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              };
            });
            expect(result.hostDirection).toBe('rtl');
            expect(result.urlDirection).toBe('ltr');
            expect(result.left).toBeGreaterThanOrEqual(0);
            expect(result.right).toBeLessThanOrEqual(result.viewport + 0.5);
            expect(result.scrollWidth).toBe(result.viewport);
          });
          EOF
          npx playwright test .release-gate/release-visual.spec.cjs --reporter=line

      - name: Upload acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-evidence
          path: test-results/release-visual
          if-no-files-found: warn
          retention-days: 14

      - name: Show preview server log on failure
        if: failure()
        run: cat /tmp/sod1820-preview.log || true
