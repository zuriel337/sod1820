name: Release Visual Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: release-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # G3_RELIABILITY_PRECLOSE — deploy_on_request v3 preflight: the NEXT release requires the latest exact-SHA
  # production canary to be a SUCCESS (fn_release_canary_gate). Failure/missing evidence blocks; no auto rollback.
  release-canary-gate:
    name: Production Canary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reliability pre-close focused contract
        run: node --test test/g3-reliability-preclose.test.mjs

      - name: Gate on latest production canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=""
          for i in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=20" --jq '.[].id'); do
            S=$(gh api "repos/${{ github.repository }}/deployments/$i/statuses?per_page=1" --jq '.[0].state')
            if [ "$S" = "success" ]; then SHA=$(gh api "repos/${{ github.repository }}/deployments/$i" --jq '.sha'); break; fi
          done
          echo "current production sha: ${SHA:-unknown}"
          if [ -z "$SHA" ]; then
            echo "cannot resolve current successful Production deployment SHA" >&2
            exit 1
          fi
          BOOTSTRAP_ARG=""
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            set +e
            BASE_PROBE=$(gh api "repos/${{ github.repository }}/contents/scripts/release-canary-gate.mjs?ref=$BASE_SHA" 2>&1)
            BASE_RC=$?
            set -e
            if [ "$BASE_RC" -ne 0 ]; then
              if printf '%s' "$BASE_PROBE" | grep -q 'HTTP 404'; then
                echo "canary gate bootstrap install release: base does not contain gate runtime"
                BOOTSTRAP_ARG="--allow-bootstrap"
              else
                echo "failed to verify base canary-gate runtime; failing closed" >&2
                printf '%s\n' "$BASE_PROBE" >&2
                exit 1
              fi
            fi
          fi
          node scripts/release-canary-gate.mjs --production-sha "$SHA" $BOOTSTRAP_ARG

  mobile-accessibility:
    name: Mobile + Accessibility Acceptance
    # Keep Playwright 1.55 on its supported image; ubuntu-latest now selects26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_HOME_2029_ENABLED: "true"
        run: npm run build

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove the telemetry-write guard (fail-closed; no live network)
        # Blocking, and it runs before the app is started or the acceptance run begins. Proves on THIS job's Playwright and Chromium that every
        # write / telemetry / third-party / unexpected request is denied before it leaves the browser, that an abort is never accepted as a
        # denial, and that the exact hook block of the spec below is wired correctly. Chromium goes through a local tripwire proxy, so even a
        # broken guard could not reach Supabase or any third party from this step. The same script runs in release-visual-egress-proof.yml.
        run: bash scripts/release-visual-egress-proof.sh

      - name: Start built app
        run: |
          # Legacy is retired: vite preview needs an index document for its SPA fallback; serve the 2029 document there.
          cp dist/2029.html dist/index.html
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sod1820-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sod1820-preview.log
          exit 1

      - name: Run visual release acceptance
        run: |
          mkdir -p test-results/release-visual .release-gate
          cat > .release-gate/release-visual.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');
          const { installStorageEgressGuard } = require('../tests/playwright-storage-egress-guard.cjs');
          const { installReleaseVisualEgress } = require('../tests/fixtures/release-visual-egress.cjs');

          const BASE = 'http://127.0.0.1:4173';
          // FAIL-CLOSED egress. This run drives the plain production build, which sends visit/identity telemetry (track_visit,
          // ingest_event, link_identity) on every route change. None of it may reach the canonical Supabase project from CI:
          // the guard denies every request that is not an explicit read before it leaves the browser, and afterEach fails the
          // test if a request the policy blocks was not actually denied. Page-level routes below may only fulfill or fall back:
          // a page-level route.continue() would bypass the context-level guard (forbidden by test/release-visual-egress-contract).
          test.use({ serviceWorkers: 'block' });
          const egressByContext = new WeakMap();
          test.beforeEach(async ({ context }) => {
            await installStorageEgressGuard(context);
            egressByContext.set(context, await installReleaseVisualEgress(context, { baseUrl: BASE }));
          });
          test.afterEach(async ({ context }, testInfo) => {
            const egress = egressByContext.get(context);
            if (!egress) throw new Error('release_visual_egress_guard_missing');
            try { await egress.finish(testInfo); } finally { await egress.dispose(); }
          });
          const PATH = '/entity-hub-preview/number/1237';
          const widths = [320, 360, 390, 1440];
          // The document may reserve native scrollbar space at both edges to center the crown.
          // Measure the native gutter in this browser independently of the page's content width.
          async function expectNoHorizontalOverflow(page, scrollWidth, clientWidth) {
            const reserved = await page.evaluate(() => {
              const root = document.documentElement;
              const probe = document.createElement('div');
              probe.style.cssText = 'position:fixed;visibility:hidden;inset:0 auto auto 0;width:100px;height:1px;box-sizing:border-box;border:0;padding:0;overflow:auto;scrollbar-gutter:stable';
              root.appendChild(probe);
              const gutter = probe.offsetWidth - probe.clientWidth;
              probe.remove();
              const sides = getComputedStyle(root).scrollbarGutter.includes('both-edges') ? 2 : 1;
              return gutter * sides;
            });
            expect(scrollWidth, 'the document overflows the viewport').toBeLessThanOrEqual(clientWidth);
            expect(clientWidth - scrollWidth, 'unused width exceeds native scrollbar reservation').toBeLessThanOrEqual(reserved + 1);
          }
          // Launch gates are runtime configuration read from the live site_flags table. A gate that exercises a
          // launch-gated tool pins that state explicitly instead of depending on what is open or closed today
          // (enabled=true means the launch lock is closed, enabled=false means open).
          const LAUNCH_FLAG_KEYS = ['lock_number', 'lock_world', 'lock_books', 'lock_heichal', 'lock_life_journey', 'lock_convergence_tree', 'lock_raziel_site'];
          async function pinLaunchFlags(page, { closed = [] } = {}) {
            await page.route('**/rest/v1/site_flags*', async (route) => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify(LAUNCH_FLAG_KEYS.map((key) => ({ key, enabled: closed.includes(key), mode: 'all', message: '' }))),
            }));
          }

          test.beforeEach(async ({ page }, testInfo) => {
            if (testInfo.title.includes('guest signup popup')) return;
            await page.addInitScript(() => {
              try { sessionStorage.setItem('sod_guest_signup_popup_dismissed', '1'); } catch {}
              // The guest newsletter invite opens after 22s or a scroll past 450px and would be the unexpected open sidecar in
              // unrelated scenarios (Bennett). Only its dismissal hint is set; no consent or subscription is simulated.
              try { localStorage.setItem('sod_legacy_newsletter_invite_until', String(Date.now() + 86400000)); } catch {}
            });
          });

          test('2029 Preview Home keeps the entrance band, public series and one dock without claiming a Production opening', async ({ page }) => {
            test.setTimeout(120_000);
            await page.route('**/rest/v1/site_flags*', async (route) => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify([{ key: 'lock_world', enabled: false, mode: 'all', message: '' }]),
            }));
            for (const width of [320, 390, 1440]) {
              await page.setViewportSize({ width, height: 900 });
              await page.goto(`${BASE}/2029`, { waitUntil: 'networkidle' });
              const home = page.locator('[data-experience-capability="home-composition"]');
              await expect(home).toBeVisible({ timeout: 30_000 });
              // Current Home contract (HomeComposition2029, ZURIEL 8.11.2026, PLAN37 HOME-03 addendum): the closed, illustration-only
              // "updates preview" card is gone by design (the live strip reads the shared "עכשיו" feed). Both former markers must be absent.
              // The note describes upcoming sections and keeps the newsletter action originally moved from the entrance band
              // to the top of the Home (HomeBuildingNote, before the pinned מפת המציאות lead): exactly one note, visible; the old tile is gone.
              await expect(home.locator('[data-home-entry-band="true"]')).toHaveCount(1, { timeout: 30_000 });
              await expect(home.locator('[data-home-top-updates="public-closed"]')).toHaveCount(0);
              await expect(home.locator('[data-home-updates-preview="illustration"]')).toHaveCount(0);
              // ZURIEL 25.11.2026 (D5/D9, approved): ONE construction note with ONE sign-up button, at the foot of "עדכונים אחרונים"
              // (BuildingSignupNote2029), replaces the old top note. Exactly one, visible, with the approved text and the existing action.
              const buildingNote = home.locator('[data-building-note="home"]');
              await expect(buildingNote).toHaveCount(1);
              await expect(buildingNote).toBeVisible();
              await expect(buildingNote).toContainText('האתר נבנה מבפנים');
              await expect(buildingNote).not.toContainText('הדף בבנייה');
              await expect(buildingNote.getByRole('button', { name: 'הרשמה לעדכונים' })).toBeVisible();
              await expect(home.getByText('האתר בבנייה', { exact: true })).toHaveCount(0);
              await expect(home.locator('[data-home-public-series="true"]')).toHaveCount(1);
              await expect(home.locator('[data-home-public-series="true"] .h29-series-card:not(.h29-skel)').first()).toBeVisible({ timeout: 30_000 });
              await expect(home.locator('[data-home-launch-notice="gradual-opening"]')).toHaveCount(0);
              await expect(home.locator('[data-home-world="open"]')).toHaveCount(0);
              // ZURIEL 17.11.2026 (Speed Law): the reality stream and its source arrivals (#home-sources) load when the reader reaches them;
              // until then one truthful status holds their place. Reaching it brings the arrivals list in; the opening is then screenshotted again.
              const streamPlaceholder = home.getByText('זרם המציאות ייטען כשתגיעו אליו', { exact: true });
              await expect(streamPlaceholder).toHaveCount(1);
              await streamPlaceholder.scrollIntoViewIfNeeded();
              await expect(home.locator('#home-sources')).toHaveCount(1, { timeout: 20_000 });
              await page.evaluate(() => window.scrollTo(0, 0));
              await expect(page.getByRole('toolbar', { name: 'מסלול המחקר והפעולות הזמינות עכשיו', exact: true })).toHaveCount(1);
              const widthMetrics = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }));
              expect(widthMetrics.clientWidth).toBe(width);
              await expectNoHorizontalOverflow(page, widthMetrics.scrollWidth, widthMetrics.clientWidth);
              await page.screenshot({ path: `test-results/release-visual/home-core-opening-${width}.png`, fullPage: false });
            }
          });

          test('guest signup popup stays absent and the surface remains accessible', async ({ page }) => {
            await page.addInitScript(() => {
              const nativeSetTimeout = window.setTimeout.bind(window);
              window.setTimeout = (fn, delay, ...args) => nativeSetTimeout(fn, delay === 120000 ? 50 : delay, ...args);
            });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const dialog = page.getByRole('dialog', { name: 'האתר בבנייה — ואתם מוזמנים להיות חלק מהדרך' });
            await page.waitForTimeout(300);
            await expect(dialog).toHaveCount(0);
            await expect(page.locator('main')).toBeVisible();
            await expect(page.getByRole('button', { name: 'פתח ניווט' })).toBeVisible();
            await expect(page.locator('#sp29-title')).toContainText('מרחב מחקר');
          });

          async function installClsObserver(page) {
            await page.addInitScript(() => {
              window.__sodCls = { windowStart: null, lastShiftAt: null, windowValue: 0, maxValue: 0, sources: [] };
              try {
                const observer = new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (entry.hadRecentInput) continue;
                    const s = window.__sodCls;
                    if (
                      s.windowStart == null ||
                      s.lastShiftAt == null ||
                      entry.startTime - s.lastShiftAt >= 1000 ||
                      entry.startTime - s.windowStart >= 5000
                    ) {
                      s.windowStart = entry.startTime;
                      s.windowValue = 0;
                    }
                    s.windowValue += entry.value;
                    s.lastShiftAt = entry.startTime;
                    if (s.windowValue > s.maxValue) {
                      s.maxValue = s.windowValue;
                      s.sources = Array.from(entry.sources || []).map((source) => {
                        const node = source?.node;
                        if (!node || node.nodeType !== 1) return null;
                        const id = node.id ? `#${node.id}` : '';
                        const cls = typeof node.className === 'string'
                          ? node.className.trim().split(/\\s+/).filter(Boolean).slice(0, 3).map((x) => `.${x}`).join('')
                          : '';
                        return `${String(node.tagName || '').toLowerCase()}${id}${cls}`;
                      }).filter(Boolean).slice(0, 6);
                    }
                  }
                });
                observer.observe({ type: 'layout-shift', buffered: true });
              } catch {}
            });
          }

          async function assertHealthy(page, width, mode = 'dark') {
            const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
            await installClsObserver(page);
            await page.route('**/entity-hub-preview/**', async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
              await route.fulfill({ status: response.status(), headers: response.headers(), body: await response.body() });
            });
            await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
            await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(500);
            await expect(page.locator('body')).not.toBeEmpty();
            await expect(page.locator('#sp29-title')).toBeVisible();

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyText: document.body.innerText.trim().length,
              cls: Number(window.__sodCls?.maxValue || 0),
              clsSources: window.__sodCls?.sources || [],
            }));
            expect(metrics.bodyText).toBeGreaterThan(100);
            await expectNoHorizontalOverflow(page, metrics.scrollWidth, metrics.clientWidth);
            expect(metrics.cls, `CLS ${metrics.cls.toFixed(4)} exceeded 0.1; latest max-window sources: ${metrics.clsSources.join(', ') || 'unknown'}`).toBeLessThanOrEqual(0.1);

            const interactive = page.locator('a, button, [tabindex="0"]');
            expect(await interactive.count()).toBeGreaterThan(3);
            const researchLink = page.locator('.sp29-actions a').first();
            await researchLink.focus();
            await expect(researchLink).toBeFocused();

            await page.screenshot({
              path: `test-results/release-visual/${mode}-${width}.png`,
              fullPage: true,
            });
          }

          for (const width of widths) {
            test(`dark ${width}px has no overflow and remains interactive`, async ({ page }) => {
              await assertHealthy(page, width, 'dark');
            });
          }

          for (const mode of ['light', 'lab']) {
            test(`${mode} projection is healthy at 390px`, async ({ page }) => {
              await assertHealthy(page, 390, mode);
              await expect(page.locator('.sp29')).toHaveClass(new RegExp(`sp29--${mode}`));
            });
          }

          async function assertGolden1237ContextualFlow(page, width) {
            const height = width < 600 ? 844 : 1000;
            await pinLaunchFlags(page);
            await page.route('**/entity-hub-preview/**', async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
              await route.fulfill({
                status: response.status(),
                headers: response.headers(),
                body: await response.body(),
              });
            });
            await page.setViewportSize({ width, height });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });

            expect(await page.title()).toBe('סוד 1820'); // approved brand title in 2029.html (#1191); the 2029 asset check below still proves the document
            await expect(page.locator('script[src*="/assets/2029-"]')).toHaveCount(1);
            const golden = page.locator('[data-experience-surface="golden-1237-focus"]');
            await expect(golden).toBeVisible({ timeout: 20_000 });
            await expect(page.locator('[data-experience-capability="contextual-sidecar"]')).toHaveCount(0);
            await expect(page.locator('[data-experience-capability="spatial-method-stage"]')).toHaveCount(0);

            await golden.getByRole('button', { name: 'התגלות · מסתתר', exact: true }).first().click();

            const sidecar = page.locator('[data-experience-capability="contextual-sidecar"]');
            const drawer = sidecar.locator('.sod29-number-drawer2029');
            await expect(sidecar).toBeVisible({ timeout: 30_000 });
            await expect(sidecar).toHaveAttribute('data-desktop-projection', 'left-context-sidecar');
            await expect(sidecar).toHaveAttribute('data-mobile-projection', 'bottom-context-sheet');
            await expect(page.getByRole('dialog')).toHaveCount(1);
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'focus');
            await expect(drawer.locator('.sod29-number-v10-expression strong')).toHaveText('התגלות', { timeout: 20_000 });

            const method = drawer.locator('[data-experience-capability="number-method-glance"] > button').filter({ hasText: 'מסתתר' }).first();
            await expect(method).toBeVisible({ timeout: 20_000 });
            await expect(method).toHaveAttribute('aria-pressed', 'true');

            await expect.poll(async () => page.evaluate(() => {
              const key = Object.keys(sessionStorage).find((name) => name.startsWith('sod_research_context_v2:'));
              if (!key) return '';
              const stored = JSON.parse(sessionStorage.getItem(key) || 'null');
              const selection = stored?.selection || {};
              return JSON.stringify([selection.expression || null, selection.method || null, Number(selection.resultValue)]);
            }), { timeout: 5_000 }).toBe(JSON.stringify(['התגלות', 'מסתתר', 1237]));

            await expect(sidecar).toBeHidden();   // still hidden after the whole flow (the rail geometry contract returns with the research stage)

            await page.screenshot({
              path: `test-results/release-visual/post-2029-contextual-${width}.png`,
              fullPage: false,
            });
          }

          test('Post 2029 Bennett fixture: context rail hidden, number flow with lazy trace and exact back at 390px', async ({ page }) => {
            await assertPost2029ContextualFlow(page, 390);
          });

          test('Post 2029 Bennett fixture: context rail hidden, number flow with lazy trace and exact back at 1440px', async ({ page }) => {
            await assertPost2029ContextualFlow(page, 1440);
          });

          test('reduced motion removes ambient animation', async ({ page }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const animationName = await page.locator('.sp29-core').evaluate((el) => getComputedStyle(el).animationName);
            expect(animationName).toBe('none');
          });

          // Removed with Legacy: the former 'gallery FIT_WHOLE_IMAGE' test verified the Legacy document's LightboxVisualFoundation.css
          // (loaded only by the Legacy entry; 2029 never shipped it). The 2029 Lightbox keeps its own behaviour: tall images scroll at >=920px.

          test('shared focus-visible baseline remains visible in dark light and lab', async ({ page }) => {
            for (const mode of ['dark', 'light', 'lab']) {
              const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
              const button = page.locator('.sp29-mini-grid button').first();
              await expect(button).toBeVisible();

              // Exercise the same interaction modality that :focus-visible is designed for.
              // Programmatic element.focus() may legitimately suppress the ring, so walk the
              // real keyboard tab order until this target receives focus.
              let reachedByKeyboard = false;
              for (let i = 0; i < 40; i += 1) {
                await page.keyboard.press('Tab');
                reachedByKeyboard = await button.evaluate((el) => document.activeElement === el);
                if (reachedByKeyboard) break;
              }
              expect(reachedByKeyboard).toBe(true);
              await expect(button).toBeFocused();

              const focus = await button.evaluate((el) => {
                const s = getComputedStyle(el);
                return { style: s.outlineStyle, width: s.outlineWidth, color: s.outlineColor, offset: s.outlineOffset };
              });
              expect(focus.style).not.toBe('none');
              expect(parseFloat(focus.width)).toBeGreaterThanOrEqual(2);
              expect(parseFloat(focus.offset)).toBeGreaterThanOrEqual(2);
            }
          });

          test('200 percent text zoom and long Hebrew labels preserve layout at narrow width', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.route('**/entity-hub-preview/**', async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
              await route.fulfill({ status: response.status(), headers: response.headers(), body: await response.body() });
            });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            await page.addStyleTag({ content: 'html{font-size:200%!important}' });
            await page.evaluate(() => {
              const target = document.querySelector('.sp29-mini-grid button');
              if (target) target.querySelector('span').textContent = 'כפתור מחקר עם תווית עברית ארוכה במיוחד שצריכה להישבר בצורה בטוחה בלי ליצור גלילה אופקית';
            });
            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            await expectNoHorizontalOverflow(page, metrics.scrollWidth, metrics.clientWidth);
            await expect(page.locator('#sp29-title')).toBeVisible();
          });

          test('mixed bidi evidence keeps Hebrew context and isolated LTR URL readable without overflow', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const result = await page.evaluate(() => {
              const host = document.createElement('div');
              host.className = 'sod-bidi-evidence';
              host.innerHTML = 'מחקר 1237 · קישור <span class="sod-ltr-island" dir="ltr">https://sod1820.co.il/number/1237?ref=ABC-42</span> · פסוק א:ב';
              host.style.maxWidth = '100%';
              host.style.padding = '12px';
              document.querySelector('.sp29-mini')?.appendChild(host);
              const url = host.querySelector('[dir="ltr"]');
              const hs = getComputedStyle(host);
              const us = getComputedStyle(url);
              const box = host.getBoundingClientRect();
              return {
                hostDirection: hs.direction,
                urlDirection: us.direction,
                right: box.right,
                left: box.left,
                viewport: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              };
            });
            expect(result.hostDirection).toBe('rtl');
            expect(result.urlDirection).toBe('ltr');
            expect(result.left).toBeGreaterThanOrEqual(0);
            expect(result.right).toBeLessThanOrEqual(result.viewport + 0.5);
            await expectNoHorizontalOverflow(page, result.scrollWidth, result.viewport);
          });
          test('explicit 2029 Post Preview preserves equality interactions', async ({ page }) => {
            test.setTimeout(90_000);
            await pinLaunchFlags(page);
            const slug = 'צופן-חותים-5784';
            const postPath = `/post/${encodeURIComponent(slug)}`;
            // Vite preview does not execute Vercel rewrites. Preserve the real
            // legacy document handoff and serve the native document at its target.
            await page.route(`**${postPath}*`, async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
