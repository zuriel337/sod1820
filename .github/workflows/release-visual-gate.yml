          test('Calculator 2029 viral Golden completes compute discovery Raziel share loop', async ({ page }) => {
            const calculatorPath = '/2029/gematria';
            const goldens = ['צוריאל', 'צוריאל פולייס', 'שער נון', 'אנכי'];
            const install2029Rewrite = async (targetPage) => {
              await targetPage.route('**/2029/gematria*', async (route) => {
                const response = await targetPage.request.get(`${BASE}/2029.html`);
                await route.fulfill({
                  status: response.status(),
                  headers: response.headers(),
                  body: await response.body(),
                });
              });
            };
            await install2029Rewrite(page);

            for (const width of [390, 1440]) {
              const aiRequests = [];
              page.on('request', (request) => {
                if (/ai-analyze|anthropic|openai/i.test(request.url())) aiRequests.push(request.url());
              });
              await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
              await page.goto(`${BASE}${calculatorPath}`, { waitUntil: 'networkidle' });

              const input = page.locator('#calculator-2029-input');
              const fixedCore = page.locator('.sod29-calc2029-grid button[data-preview-state="preview"]');
              await expect(fixedCore).toHaveCount(9);
              for (let index = 0; index < 9; index += 1) {
                await expect(fixedCore.nth(index).locator('strong')).toHaveText('0');
              }

              await input.fill('א');
              await expect(page.locator('.sod29-calc2029-grid button[data-preview-state="preview"]')).toHaveCount(9);
              await expect(page.locator('.sod29-calc2029-grid button').filter({ hasText: 'רגיל' }).first()).toContainText('1');
              await expect(page.locator('.sod29-calc2029-grid button').filter({ hasText: 'מילוי' }).first()).toContainText('111');
              await expect(page.locator('.sod29-calc2029-grid button').filter({ hasText: 'ריבוע' }).first()).toContainText('1');

              await input.fill('אב');
              await expect(page.locator('.sod29-calc2029-grid button[data-preview-state="preview"]')).toHaveCount(9);
              await expect(page.locator('.sod29-calc2029-grid button').filter({ hasText: 'רגיל' }).first()).toContainText('3');

              await input.fill('אבא');
              await expect(page.locator('.sod29-calc2029-grid button[data-preview-state="preview"]')).toHaveCount(9);
              await expect(page.locator('.sod29-calc2029-grid button').filter({ hasText: 'רגיל' }).first()).toContainText('4');

              const gridTopBeforeSettle = await page.locator('.sod29-calc2029-grid').evaluate((el) => el.getBoundingClientRect().top);
              await input.fill(goldens[0]);
              await expect(page.getByRole('button', { name: 'חשב', exact: true })).toHaveCount(0);
              expect(aiRequests).toEqual([]);
              await expect(page.locator('.sod29-calc2029-engine-status')).toBeVisible();
              await expect(page.locator('.sod29-calc2029-results')).toBeVisible({ timeout: 20_000 });
              await expect(page.locator('.sod29-calc2029-grid button[data-preview-state="verified"]').first()).toBeVisible({ timeout: 20_000 });
              const gridTopAfterSettle = await page.locator('.sod29-calc2029-grid').evaluate((el) => el.getBoundingClientRect().top);
              expect(Math.abs(gridTopAfterSettle - gridTopBeforeSettle)).toBeLessThanOrEqual(2);
              expect(aiRequests).toEqual([]);
              const inspector = page.locator('.sod29-calc2029-inspector');
              await expect(inspector).toBeVisible();
              await expect(inspector).toContainText(goldens[0]);
              const selectedMethod = await inspector.getAttribute('data-calculation-selection');
              expect(selectedMethod).toBeTruthy();
              const selectedValue = (await page.locator('.sod29-calc2029-selection-value').innerText()).trim();
              expect(selectedValue).toMatch(/^\d+$/);

              const metrics = await page.evaluate(() => ({
                clientWidth: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));
              expect(metrics.scrollWidth).toBe(metrics.clientWidth);

              const badTargets = await page.evaluate(() => Array.from(
                document.querySelectorAll('.sod29-calc2029 button:not([disabled]), .sod29-calc2029 a[href]')
              ).filter((el) => {
                const r = el.getBoundingClientRect();
                return r.width > 0 && r.height > 0 && (r.width < 44 || r.height < 44);
              }).map((el) => ({ text: (el.textContent || '').trim(), width: el.getBoundingClientRect().width, height: el.getBoundingClientRect().height })));
              expect(badTargets).toEqual([]);

              const methodOpen = page.getByRole('button', { name: 'פתח את השיטה' });
              if (await methodOpen.count()) {
                await methodOpen.click();
                await expect(page.locator('[data-method-lens="evidence"]')).toBeVisible({ timeout: 20_000 });
              }

              const share = page.locator('.sod29-calc2029-share');
              await expect(share).toBeVisible();
              const shareUrl = await share.getAttribute('data-share-url');
              expect(shareUrl).toContain('q=');
              expect(shareUrl).toContain('m=');
              expect(shareUrl).toContain('v=');
              expect(shareUrl).toContain('s=');

              await page.locator('.sod29-calc2029-actions .is-raziel').click();
              const dialog = page.getByRole('dialog');
              await expect(dialog).toBeVisible();
              await expect(dialog).toContainText(goldens[0]);
              await expect(dialog).toContainText(selectedValue);
              await page.keyboard.press('Escape');

              await page.screenshot({
                path: `test-results/release-visual/gematria-viral-${width}.png`,
                fullPage: true,
              });

              const shared = await page.context().newPage();
              await shared.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
              await install2029Rewrite(shared);
              await shared.goto(shareUrl, { waitUntil: 'networkidle' });
              const sharedCard = shared.locator('.sod29-calc2029-shared');
              await expect(sharedCard).toBeVisible({ timeout: 20_000 });
              await expect(sharedCard).toContainText(goldens[0]);
              await expect(sharedCard).toContainText(selectedValue);
              await shared.getByRole('button', { name: 'מה מסתתר בשם שלך?' }).click();
              await expect(shared.locator('#calculator-2029-input')).toBeFocused();
              await expect(shared.locator('#calculator-2029-input')).toHaveValue('');
              await shared.close();

              if (width === 390) {
                await page.getByRole('button', { name: 'השווה', exact: true }).click();
                await expect(page.locator('.sod29-calc-compare')).toBeVisible();
                await page.locator('#calculator-compare-b').fill('צוריאל פולייס');
                await expect(page.locator('.sod29-calc-compare-b-result')).toBeVisible({ timeout: 20_000 });
                await page.locator('.sod29-calc2029-actions button[aria-expanded="true"]').click();

                for (const phrase of goldens.slice(1)) {
                  await input.fill(phrase);
                  await expect(page.locator('.sod29-calc2029-inspector')).toContainText(phrase, { timeout: 20_000 });
                  expect(aiRequests).toEqual([]);
                }

                const noRelation = 'תתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתתת';
                await input.fill(noRelation);
                await expect(page.locator('.sod29-calc2029-selection-value')).toHaveText('16000', { timeout: 20_000 });
                expect(aiRequests).toEqual([]);
                const noRelationOpen = page.getByRole('button', { name: 'פתח את השיטה' });
                await noRelationOpen.click();
                await expect(page.getByText('אין כרגע ביטוי נוסף מאומת בשיטה ובערך האלה.')).toBeVisible({ timeout: 20_000 });
              }
            }
          });

          test('public page view never requests self-hosted video before explicit intent', async ({ page }) => {
            const eager = [];
            page.on('request', (req) => {
              const url = req.url();
              if (
                /\.supabase\.co\/storage\/v1\/object\/public\//i.test(url) &&
                /\.(?:mp4|webm|m4v|mov)(?:[?#]|$)/i.test(url)
              ) eager.push(url);
            });

            await page.setViewportSize({ width: 390, height: 844 });
            for (const path of ['/', '/the-location-of-the-location']) {
              eager.length = 0;
              await page.goto(BASE + path, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(4500);
              expect(eager, `${path} emitted self-hosted video before user intent: ${eager.join(', ')}`).toEqual([]);
            }
          });

