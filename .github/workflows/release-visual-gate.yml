name: Release Visual Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: release-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # G3_RELIABILITY_PRECLOSE — deploy_on_request v3 preflight: the NEXT release requires the latest exact-SHA
  # production canary to be a SUCCESS (fn_release_canary_gate). Failure/missing evidence blocks; no auto rollback.
  release-canary-gate:
    name: Production Canary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reliability pre-close focused contract
        run: node --test test/g3-reliability-preclose.test.mjs

      - name: Gate on latest production canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=""
          for i in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=20" --jq '.[].id'); do
            S=$(gh api "repos/${{ github.repository }}/deployments/$i/statuses?per_page=1" --jq '.[0].state')
            if [ "$S" = "success" ]; then SHA=$(gh api "repos/${{ github.repository }}/deployments/$i" --jq '.sha'); break; fi
          done
          echo "current production sha: ${SHA:-unknown}"
          if [ -z "$SHA" ]; then
            echo "cannot resolve current successful Production deployment SHA" >&2
            exit 1
          fi
          BOOTSTRAP_ARG=""
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            set +e
            BASE_PROBE=$(gh api "repos/${{ github.repository }}/contents/scripts/release-canary-gate.mjs?ref=$BASE_SHA" 2>&1)
            BASE_RC=$?
            set -e
            if [ "$BASE_RC" -ne 0 ]; then
              if printf '%s' "$BASE_PROBE" | grep -q 'HTTP 404'; then
                echo "canary gate bootstrap install release: base does not contain gate runtime"
                BOOTSTRAP_ARG="--allow-bootstrap"
              else
                echo "failed to verify base canary-gate runtime; failing closed" >&2
                printf '%s\n' "$BASE_PROBE" >&2
                exit 1
              fi
            fi
          fi
          node scripts/release-canary-gate.mjs --production-sha "$SHA" $BOOTSTRAP_ARG

  mobile-accessibility:
    name: Mobile + Accessibility Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright runner and Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start built app
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sod1820-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sod1820-preview.log
          exit 1

      - name: Run visual release acceptance
        run: |
          mkdir -p test-results/release-visual .release-gate
          cat > .release-gate/release-visual.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');

          const BASE = 'http://127.0.0.1:4173';
          const PATH = '/entity-hub-preview/number/1237';
          const widths = [320, 360, 390, 1440];

          test.beforeEach(async ({ page }, testInfo) => {
            if (testInfo.title.includes('guest signup popup')) return;
            await page.addInitScript(() => {
              try { sessionStorage.setItem('sod_guest_signup_popup_dismissed', '1'); } catch {}
            });
          });

          test('guest signup popup remains dismissible without replacing surface acceptance', async ({ page }) => {
            await page.addInitScript(() => {
              const nativeSetTimeout = window.setTimeout.bind(window);
              window.setTimeout = (fn, delay, ...args) => nativeSetTimeout(fn, delay === 120000 ? 50 : delay, ...args);
            });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const dialog = page.getByRole('dialog', { name: 'האתר בבנייה — ואתם מוזמנים להיות חלק מהדרך' });
            await expect(dialog).toBeVisible({ timeout: 6000 });
            await dialog.getByRole('button', { name: 'סגירה' }).click();
            await expect(dialog).toBeHidden();
            await expect(page.locator('#sp29-title')).toBeVisible();
          });

          async function installClsObserver(page) {
            await page.addInitScript(() => {
              window.__sodCls = { windowStart: null, lastShiftAt: null, windowValue: 0, maxValue: 0, sources: [] };
              try {
                const observer = new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    if (entry.hadRecentInput) continue;
                    const s = window.__sodCls;
                    if (
                      s.windowStart == null ||
                      s.lastShiftAt == null ||
                      entry.startTime - s.lastShiftAt >= 1000 ||
                      entry.startTime - s.windowStart >= 5000
                    ) {
                      s.windowStart = entry.startTime;
                      s.windowValue = 0;
                    }
                    s.windowValue += entry.value;
                    s.lastShiftAt = entry.startTime;
                    if (s.windowValue > s.maxValue) {
                      s.maxValue = s.windowValue;
                      s.sources = Array.from(entry.sources || []).map((source) => {
                        const node = source?.node;
                        if (!node || node.nodeType !== 1) return null;
                        const id = node.id ? `#${node.id}` : '';
                        const cls = typeof node.className === 'string'
                          ? node.className.trim().split(/\\s+/).filter(Boolean).slice(0, 3).map((x) => `.${x}`).join('')
                          : '';
                        return `${String(node.tagName || '').toLowerCase()}${id}${cls}`;
                      }).filter(Boolean).slice(0, 6);
                    }
                  }
                });
                observer.observe({ type: 'layout-shift', buffered: true });
              } catch {}
            });
          }

          async function assertHealthy(page, width, mode = 'dark') {
            const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
            await installClsObserver(page);
            await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
            await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
            await page.waitForTimeout(500);
            await expect(page.locator('body')).not.toBeEmpty();
            await expect(page.locator('#sp29-title')).toBeVisible();

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              bodyText: document.body.innerText.trim().length,
              cls: Number(window.__sodCls?.maxValue || 0),
              clsSources: window.__sodCls?.sources || [],
            }));
            expect(metrics.bodyText).toBeGreaterThan(100);
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);
            expect(metrics.cls, `CLS ${metrics.cls.toFixed(4)} exceeded 0.1; latest max-window sources: ${metrics.clsSources.join(', ') || 'unknown'}`).toBeLessThanOrEqual(0.1);

            const interactive = page.locator('a, button, [tabindex="0"]');
            expect(await interactive.count()).toBeGreaterThan(3);
            const first = interactive.first();
            await first.focus();
            await expect(first).toBeFocused();

            await page.screenshot({
              path: `test-results/release-visual/${mode}-${width}.png`,
              fullPage: true,
            });
          }

          for (const width of widths) {
            test(`dark ${width}px has no overflow and remains interactive`, async ({ page }) => {
              await assertHealthy(page, width, 'dark');
            });
          }

          for (const mode of ['light', 'lab']) {
            test(`${mode} projection is healthy at 390px`, async ({ page }) => {
              await assertHealthy(page, 390, mode);
              await expect(page.locator('.sp29')).toHaveClass(new RegExp(`sp29--${mode}`));
            });
          }

          async function assertGolden1237ContextualFlow(page, width) {
            const height = width < 600 ? 844 : 1000;
            await page.route('**/entity-hub-preview/**', async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
              await route.fulfill({
                status: response.status(),
                headers: response.headers(),
                body: await response.body(),
              });
            });
            await page.setViewportSize({ width, height });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });

            expect(await page.title()).toBe('SOD1820 · 2029');
            await expect(page.locator('script[src*="/assets/2029-"]')).toHaveCount(1);
            const golden = page.locator('[data-experience-surface="golden-1237-focus"]');
            await expect(golden).toBeVisible({ timeout: 20_000 });
            await expect(page.locator('[data-experience-capability="contextual-sidecar"]')).toHaveCount(0);
            await expect(page.locator('[data-experience-capability="spatial-method-stage"]')).toHaveCount(0);

            await golden.getByRole('button', { name: 'התגלות · מסתתר', exact: true }).first().click();

            const sidecar = page.locator('[data-experience-capability="contextual-sidecar"]');
            const drawer = sidecar.locator('.sod29-number-drawer2029');
            await expect(sidecar).toBeVisible({ timeout: 30_000 });
            await expect(sidecar).toHaveAttribute('data-desktop-projection', 'left-context-sidecar');
            await expect(sidecar).toHaveAttribute('data-mobile-projection', 'bottom-context-sheet');
            await expect(page.getByRole('dialog')).toHaveCount(1);
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'focus');
            await expect(drawer.locator('.sod29-number-v10-expression strong')).toHaveText('התגלות', { timeout: 20_000 });

            const method = drawer.locator('[data-experience-capability="number-method-glance"] > button').filter({ hasText: 'מסתתר' }).first();
            await expect(method).toBeVisible({ timeout: 20_000 });
            await expect(method).toHaveAttribute('aria-pressed', 'true');

            await expect.poll(async () => page.evaluate(() => {
              const key = Object.keys(sessionStorage).find((name) => name.startsWith('sod_research_context_v2:'));
              if (!key) return '';
              const stored = JSON.parse(sessionStorage.getItem(key) || 'null');
              const selection = stored?.selection || {};
              return JSON.stringify([selection.expression || null, selection.method || null, Number(selection.resultValue)]);
            }), { timeout: 5_000 }).toBe(JSON.stringify(['התגלות', 'מסתתר', 1237]));

            const panelBox = await sidecar.boundingBox();
            expect(panelBox).not.toBeNull();
            if (width < 600) {
              expect(panelBox.width).toBeGreaterThanOrEqual(width - 2);
              expect(Math.abs((panelBox.y + panelBox.height) - height)).toBeLessThanOrEqual(2);
            } else {
              expect(panelBox.x).toBeLessThanOrEqual(12);
              expect(panelBox.width).toBeLessThanOrEqual(522);
            }

            const calculation = drawer.locator('.sod29-number-v10-calculation-card');
            await expect(calculation).toBeVisible({ timeout: 20_000 });
            await calculation.click();
            const spatialStage = drawer.locator('[data-experience-capability="spatial-method-stage"][data-method-key="מסתתר"]');
            await expect(spatialStage).toBeVisible({ timeout: 20_000 });
            await expect(page.locator('[data-experience-capability="spatial-method-stage"]')).toHaveCount(1);

            const resultPreview = drawer.locator('[data-experience-action="number-result-preview"]');
            await expect(resultPreview).toBeVisible();
            await resultPreview.click();
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'number');
            await expect(page.locator('[data-experience-capability="contextual-sidecar"]')).toHaveCount(1);

            const back = drawer.locator('[data-experience-action="contextual-number-back"]');
            await expect(back).toBeVisible();
            await back.click();
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'focus');
            await expect(drawer.locator('.sod29-number-v10-expression strong')).toHaveText('התגלות');
            await expect(drawer.locator('[data-experience-capability="number-method-glance"] > button').filter({ hasText: 'מסתתר' }).first()).toHaveAttribute('aria-pressed', 'true', { timeout: 20_000 });

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);

            await page.screenshot({
              path: `test-results/release-visual/golden-1237-contextual-${width}.png`,
              fullPage: false,
            });
          }

          test('Golden 1237 uses the canonical mobile Bottom Sheet for focus → number preview → exact back at 390px', async ({ page }) => {
            await assertGolden1237ContextualFlow(page, 390);
          });

          test('Golden 1237 uses the canonical desktop left Sidecar for focus → number preview → exact back at 1440px', async ({ page }) => {
            await assertGolden1237ContextualFlow(page, 1440);
          });

          async function assertPost2029ContextualFlow(page, width) {
            const height = width < 600 ? 844 : 1000;
            const postPath = '/post/bennett-melach-631-78';
            let traceRequests = 0;
            page.on('request', (request) => {
              if (request.url().includes('/rpc/gematria_method_trace')) traceRequests += 1;
            });
            await page.route('**/post/bennett-melach-631-78*', async (route) => {
              const response = await page.request.get(`${BASE}/2029.html`);
              await route.fulfill({
                status: response.status(),
                headers: response.headers(),
                body: await response.body(),
              });
            });
            await page.setViewportSize({ width, height });
            await page.goto(`${BASE}${postPath}`, { waitUntil: 'networkidle' });

            const post = page.locator('[data-experience-surface="post-reading"]');
            await expect(post).toBeVisible({ timeout: 30_000 });

            const restRail = page.locator('.sod29-surface-context-rail');
            const contentMap = restRail.locator('[data-context-map-item]');
            await expect(contentMap).toHaveCount(5, { timeout: 30_000 });
            await expect(contentMap.nth(0)).toContainText('מלח');
            await expect(contentMap.nth(1)).toContainText('נפתלי בנט');
            await expect(contentMap.nth(3)).toContainText('ים המלח');
            await expect(contentMap.nth(4)).toContainText('ברית מלח');
            if (width < 600) {
              await expect(restRail).toBeHidden();
              await expect(page.locator('.sod29-surface-context-mobile-cue')).toContainText('בתוך הפוסט');
            } else {
              await expect(restRail).toBeVisible();
              await expect(restRail).toContainText('בתוך הפוסט');
            }

            const focusGroup = post.locator('[data-contextual-number-focus-group="true"]');
            await expect(focusGroup).toBeVisible({ timeout: 30_000 });
            expect(traceRequests).toBe(0);
            await expect(page.locator('[data-experience-capability="contextual-sidecar"]')).toHaveCount(0);

            await focusGroup.locator('[data-contextual-number-focus="true"]').first().click();

            const sidecar = page.locator('[data-experience-capability="contextual-sidecar"]');
            await expect(sidecar).toBeVisible({ timeout: 30_000 });
            await expect(sidecar).toHaveCount(1);
            await expect(sidecar).toHaveAttribute('data-desktop-projection', 'left-context-sidecar');
            await expect(sidecar).toHaveAttribute('data-mobile-projection', 'bottom-context-sheet');

            const learn = sidecar.locator('.sod29-learn-mark.scope-concept');
            await expect(learn).toBeVisible();
            await learn.getByRole('button', { name: 'איך זה עובד?' }).click();
            await expect(learn).toContainText('השיטה היא חלק מהטענה המספרית');
            await expect(learn).toContainText('מלח');
            await expect(learn).toContainText('רגיל');
            await expect(learn).toContainText('78');
            await learn.getByRole('button', { name: 'ראה את החישוב' }).click();

            const drawer = page.locator('.sod29-number-drawer2029');
            await expect(drawer).toBeVisible({ timeout: 30_000 });
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'focus');
            await expect(drawer.locator('.sod29-number-v10-expression strong')).toHaveText('מלח', { timeout: 20_000 });

            const regular = drawer.locator('[data-experience-capability="number-method-glance"] > button').filter({ hasText: 'רגיל' }).first();
            await expect(regular).toHaveAttribute('aria-pressed', 'true', { timeout: 20_000 });

            await expect.poll(async () => page.evaluate(() => {
              const key = Object.keys(sessionStorage).find((name) => name.startsWith('sod_research_context_v2:'));
              if (!key) return '';
              const stored = JSON.parse(sessionStorage.getItem(key) || 'null');
              const selection = stored?.selection || {};
              return JSON.stringify([
                selection.expression || null,
                selection.method || null,
                Number(selection.resultValue),
                selection.locator || null,
              ]);
            }), { timeout: 5_000 }).toBe(JSON.stringify(['מלח', 'רגיל', 78, '#source-region-salt-78']));

            const calculation = drawer.locator('.sod29-number-v10-calculation-card');
            await expect(calculation).toBeVisible({ timeout: 20_000 });
            await calculation.click();
            await expect(drawer.locator('[data-experience-capability="spatial-method-stage"][data-method-key="רגיל"]')).toBeVisible({ timeout: 20_000 });
            await expect(page.locator('[data-experience-capability="spatial-method-stage"]')).toHaveCount(1);
            expect(traceRequests).toBeGreaterThan(0);

            await drawer.locator('[data-experience-action="number-result-preview"]').click();
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'number');
            await expect(sidecar).toHaveCount(1);

            await drawer.locator('[data-experience-action="contextual-number-back"]').click();
            await expect(drawer).toHaveAttribute('data-contextual-number-mode', 'focus');
            await expect(drawer.locator('.sod29-number-v10-expression strong')).toHaveText('מלח');
            await expect(drawer.locator('[data-experience-capability="number-method-glance"] > button').filter({ hasText: 'רגיל' }).first()).toHaveAttribute('aria-pressed', 'true', { timeout: 20_000 });

            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);

            const panelBox = await sidecar.boundingBox();
            expect(panelBox).not.toBeNull();
            if (width < 600) {
              expect(panelBox.width).toBeGreaterThanOrEqual(width - 2);
              expect(Math.abs((panelBox.y + panelBox.height) - height)).toBeLessThanOrEqual(2);
            } else {
              expect(panelBox.x).toBeLessThanOrEqual(12);
              expect(panelBox.width).toBeLessThanOrEqual(522);
            }

            await page.screenshot({
              path: `test-results/release-visual/post-2029-contextual-${width}.png`,
              fullPage: false,
            });
          }

          test('Post 2029 Bennett fixture uses canonical mobile Bottom Sheet with lazy trace and exact back at 390px', async ({ page }) => {
            await assertPost2029ContextualFlow(page, 390);
          });

          test('Post 2029 Bennett fixture uses canonical desktop left Sidecar with lazy trace and exact back at 1440px', async ({ page }) => {
            await assertPost2029ContextualFlow(page, 1440);
          });

          test('reduced motion removes ambient animation', async ({ page }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const animationName = await page.locator('.sp29-core').evaluate((el) => getComputedStyle(el).animationName);
            expect(animationName).toBe('none');
          });

          test('gallery FIT_WHOLE_IMAGE preserves all source edges across aspect ratios and release widths', async ({ page }) => {
            for (const width of widths) {
              await page.setViewportSize({ width, height: width < 600 ? 844 : 1000 });
              await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
              for (const fixture of [
                { name: 'landscape', w: 1600, h: 900, tall: false },
                { name: 'portrait', w: 900, h: 1600, tall: true },
                { name: 'legacy-gematria-ratio', w: 1080, h: 1920, tall: true },
              ]) {
                const result = await page.evaluate(async ({ fixture }) => {
                  const root = document.createElement('div');
                  root.id = 'lb-release-fixture';
                  root.innerHTML = `<div class="lb-main${fixture.tall ? ' lb-scroll' : ''}" style="position:fixed;inset:0;width:100vw;height:100vh;display:flex;flex-direction:column;background:#000;z-index:2147483600"><div class="lb-imgpane" style="display:flex;flex:1 1 auto;width:100%;min-height:0"><img class="lb-img${fixture.tall ? ' tall' : ''}" alt="fixture" /></div><aside class="lb-panel" style="height:120px;flex-shrink:0">fixture</aside></div>`;
                  document.body.appendChild(root);
                  const img = root.querySelector('img');
                  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${fixture.w}" height="${fixture.h}" viewBox="0 0 ${fixture.w} ${fixture.h}"><rect width="100%" height="100%" fill="black"/><rect x="2" y="2" width="${fixture.w - 4}" height="${fixture.h - 4}" fill="none" stroke="white" stroke-width="4"/></svg>`;
                  img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
                  await img.decode();
                  const pane = root.querySelector('.lb-imgpane').getBoundingClientRect();
                  const box = img.getBoundingClientRect();
                  const style = getComputedStyle(img);
                  const out = {
                    objectFit: style.objectFit,
                    imageWidth: box.width,
                    imageHeight: box.height,
                    fullyInside: box.left >= pane.left - 0.5 && box.right <= pane.right + 0.5 && box.top >= pane.top - 0.5 && box.bottom <= pane.bottom + 0.5,
                  };
                  root.remove();
                  return out;
                }, { fixture });
                expect(result.objectFit).toBe('contain');
                expect(result.imageWidth).toBeGreaterThan(0);
                expect(result.imageHeight).toBeGreaterThan(0);
                expect(result.fullyInside).toBe(true);
              }
            }
          });

          test('shared focus-visible baseline remains visible in dark light and lab', async ({ page }) => {
            for (const mode of ['dark', 'light', 'lab']) {
              const suffix = mode === 'dark' ? '' : `?mode=${mode}`;
              await page.setViewportSize({ width: 390, height: 844 });
              await page.goto(`${BASE}${PATH}${suffix}`, { waitUntil: 'networkidle' });
              const button = page.locator('.sp29-mini-grid button').first();
              await expect(button).toBeVisible();

              // Exercise the same interaction modality that :focus-visible is designed for.
              // Programmatic element.focus() may legitimately suppress the ring, so walk the
              // real keyboard tab order until this target receives focus.
              let reachedByKeyboard = false;
              for (let i = 0; i < 40; i += 1) {
                await page.keyboard.press('Tab');
                reachedByKeyboard = await button.evaluate((el) => document.activeElement === el);
                if (reachedByKeyboard) break;
              }
              expect(reachedByKeyboard).toBe(true);
              await expect(button).toBeFocused();

              const focus = await button.evaluate((el) => {
                const s = getComputedStyle(el);
                return { style: s.outlineStyle, width: s.outlineWidth, color: s.outlineColor, offset: s.outlineOffset };
              });
              expect(focus.style).not.toBe('none');
              expect(parseFloat(focus.width)).toBeGreaterThanOrEqual(2);
              expect(parseFloat(focus.offset)).toBeGreaterThanOrEqual(2);
            }
          });

          test('200 percent text zoom and long Hebrew labels preserve layout at narrow width', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            await page.addStyleTag({ content: 'html{font-size:200%!important}' });
            await page.evaluate(() => {
              const target = document.querySelector('.sp29-mini-grid button');
              if (target) target.querySelector('span').textContent = 'כפתור מחקר עם תווית עברית ארוכה במיוחד שצריכה להישבר בצורה בטוחה בלי ליצור גלילה אופקית';
            });
            const metrics = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            expect(metrics.scrollWidth).toBe(metrics.clientWidth);
            await expect(page.locator('#sp29-title')).toBeVisible();
          });

          test('mixed bidi evidence keeps Hebrew context and isolated LTR URL readable without overflow', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 844 });
            await page.goto(`${BASE}${PATH}`, { waitUntil: 'networkidle' });
            const result = await page.evaluate(() => {
              const host = document.createElement('div');
              host.className = 'sod-bidi-evidence';
              host.innerHTML = 'מחקר 1237 · קישור <span class="sod-ltr-island" dir="ltr">https://sod1820.co.il/number/1237?ref=ABC-42</span> · פסוק א:ב';
              host.style.maxWidth = '100%';
              host.style.padding = '12px';
              document.querySelector('.sp29-mini')?.appendChild(host);
              const url = host.querySelector('[dir="ltr"]');
              const hs = getComputedStyle(host);
              const us = getComputedStyle(url);
              const box = host.getBoundingClientRect();
              return {
                hostDirection: hs.direction,
                urlDirection: us.direction,
                right: box.right,
                left: box.left,
                viewport: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              };
            });
            expect(result.hostDirection).toBe('rtl');
            expect(result.urlDirection).toBe('ltr');
            expect(result.left).toBeGreaterThanOrEqual(0);
            expect(result.right).toBeLessThanOrEqual(result.viewport + 0.5);
            expect(result.scrollWidth).toBe(result.viewport);
          });
