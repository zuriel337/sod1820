            const goldens = ['שלום', 'ברכה', 'שער נון', 'אנכי'];
            // The launch flag is pinned open, yet the public product still presents Raziel as locked until its setup and
          // verification complete (see the Raziel assertions below); this loop covers compute, discovery and share.
            await page.route('**/rest/v1/site_flags*', async (route) => route.fulfill({
              status: 200,
              contentType: 'application/json',
              body: JSON.stringify([{ key: 'lock_raziel_site', enabled: false, mode: 'all', message: '' }]),
            }));
            const install2029Rewrite = async (targetPage) => {
              await targetPage.route('**/2029/gematria/viral*', async (route) => {
                const response = await targetPage.request.get(`${BASE}/2029.html`);
                await route.fulfill({
                  status: response.status(),
                  headers: response.headers(),
                  body: await response.body(),
                });
              });
            };
            await install2029Rewrite(page);

            for (const width of [390, 1440]) {
              const aiRequests = [];
              page.on('request', (request) => {
                if (/ai-analyze|anthropic|openai/i.test(request.url())) aiRequests.push(request.url());
