name: Research Sync Acceptance
on:
  pull_request:
    paths:
      - 'src/lib/auth.js'
      - 'src/lib/research/ResearchProvider.jsx'
      - 'src/lib/research/researchSync*'
      - 'supabase/migrations/20260916141000_g3_personal_research_sync_hardening_v1.sql'
      - 'scripts/test-research-sync*'
      - 'test/research-sync-hardening.test.mjs'
      - '.github/workflows/research-sync-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Match the existing ELS gate's disposable runner-local PostgreSQL setup.
      # ECR's anonymous data quota failed before checkout; no registry is needed.
      - name: Start disposable PostgreSQL fixture without a registry pull
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres WITH PASSWORD 'fixture_only'"
          sudo -u postgres createdb research_sync_fixture
          PGPASSWORD=fixture_only psql -h localhost -U postgres -d research_sync_fixture -v ON_ERROR_STOP=1 -Atqc 'select current_database()'
      - run: node --test src/lib/research/researchSyncRuntime.test.js src/lib/research/researchSyncRecovery.test.js test/research-sync-hardening.test.mjs
      - name: Execute actual migration and adversarial SQL in disposable PostgreSQL
        env:
          PGPASSWORD: fixture_only
        run: psql -h localhost -U postgres -d research_sync_fixture -v ON_ERROR_STOP=1 -f scripts/test-research-sync.sql
      - run: npm ci
      - name: Install isolated mounted-provider test helper (no package/lockfile change)
        run: npm install --no-save --package-lock=false esbuild@0.28.2 react-test-renderer@19.3.0
      - name: Mounted React provider / principal boundary
        run: node --test scripts/test-research-sync-provider.mjs
