name: Tanakh Maqaf Regeneration Gate

on:
  push:
    branches:
      - gpt/tanakh-maqaf-word-boundaries-v1

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[tanakh-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/tanakh-maqaf-word-boundaries-v1
          fetch-depth: 1
      - name: Preserve current corpus and canonical ELS stream
        run: |
          cp tools/els/data/tk-letters.txt /tmp/tanakh-letters.before.txt
          cp public/tanakh-verses.json /tmp/tanakh-verses.before.json
      - name: Regenerate source corpus
        run: python3 scripts/tanakh/gen_tanakh.py
      - name: Preserve canonical Torah, replace only Neviim/Ketuvim, and verify ELS invariance
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          FIN = {'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'}
          old=json.loads(pathlib.Path('/tmp/tanakh-verses.before.json').read_text(encoding='utf-8'))
          fresh=json.loads(pathlib.Path('public/tanakh-verses.json').read_text(encoding='utf-8'))
          old_torah=[v for v in old['verses'] if v[0] < 5]
          fresh_nk=[v for v in fresh['verses'] if v[0] >= 5]
          merged={"books":fresh['books'],"method":"רגיל","bookRanges":old.get('bookRanges', fresh.get('bookRanges')),"verses":old_torah+fresh_nk}
          pathlib.Path('public/tanakh-verses.json').write_text(json.dumps(merged,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          def letters_of(t): return ''.join(FIN.get(c,c) for c in t if c!=' ')
          before=pathlib.Path('/tmp/tanakh-letters.before.txt').read_text(encoding='utf-8')
          assert len(before)==1204583, f'canonical ELS letters={len(before)} expected 1204583'
          new_letters=before[:304805]+''.join(letters_of(v[3]) for v in fresh_nk)
          if before != new_letters:
              raise SystemExit(f'ELS STREAM CHANGED: before_chars={len(before)} sha={hashlib.sha256(before.encode()).hexdigest()} after_chars={len(new_letters)} sha={hashlib.sha256(new_letters.encode()).hexdigest()}')
          om={(v[0],v[1],v[2]):v for v in old['verses']}
          nm={(v[0],v[1],v[2]):v for v in merged['verses']}
          if om.keys()!=nm.keys(): raise SystemExit('VERSE LOCATOR SET CHANGED')
          changed=[]
          for k in sorted(om):
              a,b=om[k],nm[k]
              if a[3]!=b[3]:
                  if k[0] < 5: raise SystemExit(f'TORAH MUTATION FORBIDDEN at {k}')
                  if a[4]!=b[4]: raise SystemExit(f'GEMATRIA CHANGED at {k}: {a[4]} -> {b[4]}')
                  changed.append((merged['books'][k[0]],k[1],k[2],b[3]))
          def q(s): return "'"+s.replace("'","''")+"'"
          sql=[]
          for book,ch,vs,text in changed:
              sql.append(f"UPDATE public.tanach_verses SET text={q(text)}, words=regexp_split_to_array({q(text)}, E'\\\\s+') WHERE book={q(book)} AND chapter={ch} AND verse={vs};")
          pathlib.Path('scripts/tanakh/generated_maqaf_updates.sql').write_text('\n'.join(sql)+'\n',encoding='utf-8')
          pathlib.Path('scripts/tanakh/generated_maqaf_summary.txt').write_text(
              f"scope=neviim_ketuvim_only\nchanged_verses={len(changed)}\nels_chars={len(before)}\nels_sha256={hashlib.sha256(before.encode()).hexdigest()}\ntorah_mutations=0\n",encoding='utf-8')
          print(f'PASS: ELS char-identical; Torah untouched; changed N/K verses={len(changed)}')
          PY
      - name: Commit regenerated corpus and DB update plan
        run: |
          rm -f public/tanakh-letters.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tanakh-verses.json scripts/tanakh/generated_maqaf_updates.sql scripts/tanakh/generated_maqaf_summary.txt
          if git diff --cached --quiet; then
            echo 'No corpus changes.'
          else
            git commit -m 'Regenerate Tanakh word boundaries [tanakh-generated]'
            git push origin HEAD:gpt/tanakh-maqaf-word-boundaries-v1
          fi
