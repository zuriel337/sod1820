name: Research Workspace wire once
on:
  pull_request:
    types: [reopened]
    branches: [gpt/els-research-journey-v2]
permissions:
  contents: write
jobs:
  wire:
    if: github.head_ref == 'gpt/research-workspace-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/research-workspace-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Guarded patch
        run: python3 scripts/patch-wire-universal-workspace.py
      - name: Verify Universal Finding contract
        run: node scripts/verify-universal-finding-contract.mjs
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot scaffolding and commit verified product code
        run: |
          rm scripts/patch-wire-universal-workspace.py .github/workflows/research-workspace-wire-once.yml
          git config user.name "GPT Research Agent 2"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(research): wire ELS Finding into global Workspace"
          git push origin HEAD:gpt/research-workspace-v1
