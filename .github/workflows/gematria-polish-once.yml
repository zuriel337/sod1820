name: Gematria Polish Once
on:
  push:
    branches: [gpt/gematria-legacy-drift-cleanup-v1]
permissions:
  contents: write
jobs:
  polish:
    if: github.event.head_commit.message != 'Polish Gematria cleanup wording final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/gematria-legacy-drift-cleanup-v1
      - name: Polish wording
        run: |
          node -e "const fs=require('fs'); for (const p of ['src/components/GematriaCalculatorLegacy.jsx','src/pages/BeitMidrashPage.jsx']) { let s=fs.readFileSync(p,'utf8'); s=s.replaceAll('מ-השיטות הזמינות','מהשיטות הזמינות'); fs.writeFileSync(p,s); }"
      - name: Verify no awkward wording
        run: '! grep -RIn "מ-השיטות הזמינות" src/components/GematriaCalculatorLegacy.jsx src/pages/BeitMidrashPage.jsx'
      - name: Commit
        run: |
          git config user.name "zuriel337"
          git config user.email "128194013+zuriel337@users.noreply.github.com"
          git add src/components/GematriaCalculatorLegacy.jsx src/pages/BeitMidrashPage.jsx
          git diff --cached --quiet || git commit -m "Polish Gematria cleanup wording final"
          git push origin HEAD:gpt/gematria-legacy-drift-cleanup-v1
