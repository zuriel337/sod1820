name: ELS Journey exact-anchor one-shot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.event.pull_request.head.ref == 'gpt/els-research-journey-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch canonical loadMatrix exact-anchor selection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/els/els-code.template.html')
          s = p.read_text(encoding='utf-8')
          old = '''    let idx=item.skip?st.res.hits.findIndex(h=>Math.abs(h.skip)===item.skip):-1;\n    if(idx<0){const g2=st.res.hits.findIndex(h=>Math.abs(h.skip)>=2);idx=g2>=0?g2:0;}'''
          new = '''    const exactStart=item.start!=null?Number(item.start):null;\n    const exactDir=item.dir===1||item.dir===-1?item.dir:null;\n    const exactRequested=Number.isFinite(exactStart)&&exactDir!=null&&item.skip!=null;\n    let idx=exactRequested\n      ?st.res.hits.findIndex(h=>Math.abs(h.skip)===Math.abs(Number(item.skip))&&h.start===exactStart&&h.dir===exactDir)\n      :(item.skip?st.res.hits.findIndex(h=>Math.abs(h.skip)===item.skip):-1);\n    // Journey exact-anchor requests must never silently jump to another occurrence.\n    // Legacy saved matrices (no start+dir) keep the historical skip-only fallback.\n    if(idx<0&&!exactRequested){const g2=st.res.hits.findIndex(h=>Math.abs(h.skip)>=2);idx=g2>=0?g2:0;}\n    if(idx<0&&exactRequested){toast("לא ניתן לעגן את הממצא המדויק");return;}'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one loadMatrix selection block, found {count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Rebuild canonical ELS artifact
        run: |
          cd tools/els
          python3 build.py

      - name: Verify Journey contract
        run: node scripts/verify-els-journey-contract.mjs

      - name: Verify exact-anchor patch and clean diff
        run: |
          grep -F 'exactRequested' tools/els/els-code.template.html
          grep -F 'לא ניתן לעגן את הממצא המדויק' tools/els/els-code.template.html
          git diff --check

      - name: Build app
        run: |
          npm ci
          npm run build

      - name: Commit generated patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'GPT Research Agent 2'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/els-journey-exact-anchor-one-shot.yml
          git add tools/els/els-code.template.html public/tzofen.html
          git commit -m 'feat(els): exact-anchor loadMatrix for Research Journey'
          git push origin HEAD:${{ github.head_ref }}
