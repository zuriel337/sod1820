name: 2029 Live Contracts

# Static, dependency-free contracts that must survive the retirement of the Legacy runtime.
# The assertions were salvaged from Legacy-era tests (see the header of each script); nothing here is new behaviour, a threshold or a budget.
# It runs on every pull request to main and can be dispatched by hand. No network, no browser, no secrets.
# The second job, perf-contracts-2029, builds the app and runs speed contracts that existed but ran nowhere (today: the Realtime/Phoenix chunk stays out of the 2029 entry).
# The third job, release-contracts-2029, runs release-path contracts that also ran nowhere: the server document metadata for public routes, the Beit Midrash strips, the production service worker, and the Number page (projection reads and the phone first screen).
# Its later steps (5.11.2026) add the contract suites of five surfaces that were green on main but ran in no workflow, plus one new contract:
# the Number page, Beit Midrash, the calculator, the Bible code opened to the public in its Classic form (release policy, URL continuity and the production worker transport),
# and the navigation symbols (every destination has its own catalogued picture; none is shared or silently falls back).
# The top bar contract (the crown at the centre, dark glass, the rounded arc) lives here too.
# The mounted calculator tests need react-test-renderer; it is installed for that one step only, pinned and without touching package.json or the lockfile, exactly as research-sync-gate.yml does.
# No threshold, budget or baseline is added or changed here; every file below passed on a clean `npm ci` checkout before it was wired.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contracts-2029:
    name: live-contracts-2029
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Canonical presentation contract (pure presentation functions, Home 2029, fast preview, public OG, number message)
        run: node scripts/test-2029-canonical-presentation.mjs
      - name: Live static contracts (sitemap, Heichal entry, ELS 2029 page, early access, WhatsApp edge functions, research viewer Human Gate)
        run: node scripts/test-2029-live-contracts.mjs
      - name: Avatar rendition contract (public storage avatars are served as small renditions; animation is kept)
        run: node --test src/lib/avatar.test.js

  perf-contracts-2029:
    name: perf-contracts-2029
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Realtime entry split (the deferred Realtime/Phoenix chunk is not in the 2029 entry; browser use of the SDK stays inside the checked subset)
        run: node --test test/realtime-entry-split-2029.test.mjs
      - name: First-load graph guard (shell and always-loaded chunks must not statically import the heavy modules moved to their own lazy chunks; reads the production build above)
        run: node scripts/test-2029-first-load-graph.mjs

  release-contracts-2029:
    name: release-contracts-2029
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Server document metadata parity (crawler, AI and social documents for public routes, including the Beit Midrash learning area)
        run: node scripts/test-2029-server-seo-ai-parity.mjs
      - name: Beit Midrash strips move only themselves, never the page
        run: node --test test/beit-midrash-rail-no-page-scroll-2029.test.mjs
      - name: Production service worker contract (native public images and renditions; private reads and writes stay wrapped) and personal continuity with the installed-app metadata of the same artifact
        run: |
          node scripts/build-public-reading-production.mjs
          node --test test/public-reading-production-artifact.test.mjs test/personal-continuity-2029.test.mjs
      - name: Authentication contract (permanent gate - the emitted production worker, the real Supabase client and the real auth module together - code requests and links, existing and new accounts, 6-10 digit codes, single-use codes, password, refresh, persistence, stale-worker recovery, no cross-user session, diagnostics without secrets)
        run: node --test test/auth-contract-2029.test.mjs test/auth-storage-resilience-2029.test.mjs test/auth-storage-compat-2029.test.mjs src/lib/authVerifyOtp.test.js test/public-reading-full-account-transport.test.mjs
      - name: Bible code open to the public, Classic (release policy, URL continuity, and the production worker transport; reads the protected review build generated by the step above)
        run: node --test test/public-reading-release-2029.test.mjs test/public-url-continuity-2029.test.mjs test/public-reading-full-account-transport.test.mjs
      - name: Public release feature state (what the release opens to everyone is open to the administrator too, and nothing waits for sign-in; what it keeps closed stays closed)
        run: node --test test/public-release-feature-state-2029.test.mjs
      - name: Number page contracts (value reads start with the node lookup and share one fn_number_lookup; the phone first screen keeps the number high)
        run: node --test test/entity-graph-anchor-reuse-2029.test.mjs test/number-projection-shared-reads-2029.test.mjs test/number-mobile-first-screen-2029.test.mjs
      # test/number-fullpage-preview-guards-2029.test.mjs is deliberately not here: its first test runs `git show dbbe91de…` on a commit of a retired
      # preview branch, which exists only in a full clone; the checkout of this job is shallow, so it cannot run here (it failed on the first real run).
      - name: Number page contracts, the rest of the suite (reading order, provenance, parallel projection, method experience, identity overlap, calculator return, public research)
        run: >
          node --test
          test/number-ai-analysis-2029.test.mjs
          test/number-anchor-universal-finding.test.mjs
          test/number-calculator-return-2029.test.mjs
          test/number-fullpage-provenance-2029.test.mjs
          test/number-identity-overlap-2029.test.mjs
          test/number-method-experience.test.mjs
          test/number-method-profile-reuse-2029.test.mjs
          test/number-parallel-projection-2029.test.mjs
          test/number-projection-reading-2029.test.mjs
          test/number-reading-order-2029.test.mjs
          test/number-zvi-public-research-2029.test.mjs
          src/lib/research/numberCrossingSemantics.test.js
          src/lib/research/numberMathFingerprint.test.js
          src/lib/research/numberMathProfile.test.js
          src/lib/research/numberMathProfileFinding.test.js
          src/lib/research/numberPhrasePresentationOrder.test.js
          src/lib/research/number2029LiveGlass.test.js
      # P0-A/B/C consumer contracts (PG2): source identity, occurrence and independence across Post, Topic, World and Number.
      # All seven were green on main but ran in no workflow; they read only repository files (no network, no browser, no git history). About 5 s together.
      # Proven on Node 24 on ci-verify/pg2-workflow-20261107 (71/71). world-corpus-continuation-2029 is bound to a committed snapshot (checksum): remove it from
      # this list if the owner retires that audit. Wiring tests is contract coverage, not consumer acceptance.
      - name: Source-identity consumer contracts (one witness identity, exact occurrences, no false independence, private evidence withheld, owner review API)
        run: >
          node --test
          test/connection-depth-fidelity.test.mjs
          test/one-tree-branch-contract-2029.test.mjs
          test/world-people-sources-2029.test.mjs
          test/world-gallery-triage-projection-2029.test.mjs
          test/post-content-interest-2029.test.mjs
          test/world-finding-review-api-2029.test.mjs
          test/world-corpus-continuation-2029.test.mjs
      # Analytics measurement contracts. All three ran in no workflow. They read only repository files and evaluate the emitted worker and the route effects in a VM
      # (no network, no browser). public-reading-observability had silently stopped running: its end marker had been deleted from src/App2029.jsx, the slice
      # then included `export default` and the route-effects proof failed with "module is not defined". Repaired in the same change.
      - name: Analytics measurement contracts (public GA4 transport and labels, anonymous RUM family, the route effects that start them, one-tree analytics contract)
        run: >
          node --test
          test/analytics-2029-one-tree-contract.test.mjs
          test/public-reading-real-gtag-shape.test.mjs
          test/public-reading-observability.test.mjs
          test/public-reading-analytics-worker.test.mjs
      - name: Navigation symbols (every destination has its own catalogued picture; none is shared and none falls back to the tools grid) and icon treatment
        run: node --test test/navigation-symbols-distinct-2029.test.mjs test/icon-treatment-2029.test.mjs
      - name: Top bar (the crown at the centre, dark glass, the rounded arc; one final design, one stylesheet, and the traps it hit stay handled)
        run: node --test test/topbar-crown-2029.test.mjs
      - name: Bottom command bar is one row (nothing lifts the Raziel orb off the centre line of the other four controls)
        run: node --test test/command-island-one-row-2029.test.mjs
      - name: Beit Midrash contracts (World lenses over the governed tree attachment, methods study, learning projection, study UI, source reading, route and method definitions; the Legacy-page method-registry script was removed with the Legacy runtime in 623b8d38a)
        run: >
          node --test
          test/beit-midrash-world-sections-2029.test.mjs
          test/beit-midrash-methods-study-2029.test.mjs
          test/beit-midrash-learning-projection-2029.test.mjs
          test/beit-midrash-world-study-ui-2029.test.mjs
          test/beit-midrash-source-reading-lesson-2029.test.mjs
          test/kingdom-beit-midrash-learning-route-2029.test.mjs
          scripts/test-beit-midrash-all-method-definitions.mjs
      - name: Calculator contracts, static (opening, compare, classic view, equals preview, pro, semantic surface, viral, English posts)
        run: >
          node --test
          scripts/test-calculator-2029-opening.mjs
          scripts/test-calculator-2029-compare.mjs
          scripts/test-calculator-2029-classic-view.mjs
          scripts/test-calculator-2029-equals-preview.mjs
          scripts/test-calculator-2029-pro.mjs
          scripts/test-calculator-2029-semantic-surface.mjs
          scripts/test-calculator-2029-viral.mjs
          test/post-english-calculator-2029.test.mjs
      - name: Calculator contracts, public canonical compatibility (reads the protected review build generated by the production step above)
        run: node --test test/public-calculator-canonical-compatibility.test.mjs
      - name: Calculator contracts, mounted (equals-preview lifecycle, community calculator runtime and continuity; react-test-renderer is a test-only helper, pinned, with no package or lockfile change)
        run: |
          npm install --no-save --package-lock=false react-test-renderer@19.3.0
          node --test test/calculator-equals-preview-lifecycle.test.mjs test/community-calculator-runtime-2029.test.mjs test/community-calculator-continuity-2029.test.mjs
      - name: Reading-mode research and continuity contracts (verified-principal research provider, exact historical pages, root vercel.json content pin; previously unwired, drifted from approved changes and repaired; the research provider test mounts the real provider and needs react-test-renderer from the step above)
        run: node --test test/doc37-research-reading-access.test.mjs test/public-continuity-closure-2029.test.mjs test/doc37-mixed-page-readiness.test.mjs
      - name: Preview worker admission policy (Preview-only write allow-list, 28 cases; repaired fixture, no product change)
        run: node --test scripts/test-integrated-preview-auth-guard.mjs
      # test/public-frame-access-2029.test.mjs is deliberately not here: one of its tests runs `git show 4987d7a1…` on a commit of a retired preview branch,
      # which exists only in a full clone; the checkout of this job is shallow. Its Preview-ceiling tests were repaired and pass in a full clone.
      - name: Frame contracts that had drifted from approved changes (opened destinations, release-aware feature state boundary, the one more panel, pinned rail budget, framed journey gate, personal layout, post-title bounds)
        run: >
          node --test
          test/admin-open-destinations-2029.test.mjs
          test/footer-2029.test.mjs
          test/unlocked-2029-preview-boundary.test.mjs
          test/life-journey-2029-chain.test.mjs
          test/post-topic-pinned-context-rail-2029.test.mjs
          test/personal-area-balanced-rtl-2029.test.mjs
          test/content-title-presentation.test.mjs
          test/dock-more-2029.test.mjs
          src/components/experience2029/frameRenewalShare2029.test.js
      # These ran in no workflow before (they were only run by hand with npm run test:cn-sg-security), so nothing stood between a change to the edge
      # middleware and Production. The production entry re-exports the root middleware.js, so a change to either is covered by the same run.
      - name: Edge middleware contracts (CN and SG quarantine policy and order, the SG rate limiter and its OIDC token resolver, good bots and AI crawlers pass, bad bots are refused, bot reads have no side effect, the production entry binds the audited middleware)
        run: |
          npm run test:cn-sg-security
          node --test middleware.test.js test/public-reading-middleware-entry.test.mjs test/bot-read-no-side-effect.test.mjs test/bot-read-sink-guard.test.mjs
      # Audit remediation 2026-11-06 (DEF-001, DEF-001b, DEF-002, DEF-007): offline source contracts for the e-mail exposure fix,
      # the slash-free sitemap addresses and the rule that no workflow names a test file that does not exist.
      - name: Audit remediation contracts (no client e-mail resolver, push RPC shape, slash-free sitemap addresses, workflow path references exist)
        run: node --test test/def001-email-exposure-contract.test.mjs test/sitemap-no-redirecting-locs-2029.test.mjs test/ci-workflow-references-exist.test.mjs test/public-foundation-seo.test.mjs test/public-video-asset-reader-2029.test.mjs test/public-video-source-2029.test.mjs test/def005-rpc-grants-contract.test.mjs test/def012-page-views-public-build.test.mjs test/api-card-bounded-cacheable-2029.test.mjs test/gallery-river-reserved-height-2029.test.mjs test/release-visual-egress-contract.test.mjs

      - name: Contracts repaired to the approved state (Raziel, World, Posts, Community, Contributors, Research Viewer, WhatsApp, Companion, golden and Preview-integration pins; previously unwired, they had drifted from merged owner-approved changes and were repaired without weakening any assertion)
        run: >
          node --test
          src/components/community2029/communityPublicReading2029.test.js
          src/components/contributor2029/publicContributor2029.test.js
          src/components/contributor2029/publicContributorPerson2029.test.js
          src/components/contributor2029/publicSourceCatalog2029.test.js
          src/lib/publicContinuityReaders2029.test.js
          src/lib/community/messageLinks.test.js
          src/lib/research/eventObservationCompiler.test.js
          src/lib/research/eventSystemMethodRuntime.test.js
          src/lib/research/goldenProjectorModes.test.js
          src/lib/research/nasrallahPost92Golden.test.js
          src/lib/research/razielOneShot2029.test.js
          test/companion-2029-public-source-shortcuts.test.mjs
          test/global-living-ribbon-state.test.mjs
          test/personal-self-preview-route.test.mjs
          test/post-hierarchy-raziel-2029.test.mjs
          test/posts-raziel-final-2029.test.mjs
          test/raziel-center-workspace-2029.test.mjs
          test/raziel-personal-area-companion-seam.test.mjs
          test/raziel-safe-actions-preview.test.mjs
          test/raziel-site-links.test.mjs
          test/research-viewer-entity-graph-lens.test.mjs
          test/research-viewer-graph-readpath.test.mjs
          test/now-publications-2029.test.mjs
          test/group-sources-now-2029.test.mjs
          test/or-geula-video-share-2029.test.mjs
          test/install-suggestion-2029.test.mjs
          test/wa-channel-world-2029-contract.test.mjs
          test/wa-trusted-author-tree-routing.test.mjs
          test/world-topic-gallery-state-map-2029.test.mjs
          test/world-gallery-entry-follow-chain-2029.test.mjs
          test/world-one-tree-preview-2029.test.mjs
      - name: Now centre contracts (ZURIEL 11.11.2026 — the pinned central message of at most 72 hours, the one source picker, the Home centre first and the featured card before the plane story; the Home strip test mounts the real component with react-test-renderer from the calculator step above; it was previously unwired and repaired)
        run: >
          node --test
          test/now-publications-2029.test.mjs
          test/home-live-updates-2029.test.mjs
          test/home-featured-post-2029.test.mjs
          test/companion-2029-one-feed-and-projector-rail.test.mjs
      - name: Connected golden theme contract (script runner)
        run: node scripts/test-connected-golden-2029.mjs
      - name: Robustness and rollout-order contracts (stale-chunk recovery and error boundary, /api/card deadline and glyphs, guest/member preferences split, push and RPC deploy-order manifests, ELS bridge anonymous bearer, missing-asset 404, client read de-duplication, bot-observability migrations; the asset-miss test reads the production build generated earlier in this job)
        run: >
          node --test
          test/app-recovery-2029.test.mjs
          test/api-card-deadline-glyphs-2029.test.mjs
          test/notification-prefs-guest-member-split.test.mjs
          test/push-subscription-rollout-order.test.mjs
          test/rpc-deploy-order-contract.test.mjs
          test/els-search-bridge-resolve-user.test.mjs
          test/supabase-client-read-dedupe.test.mjs
          src/lib/readDedupe.test.js
          test/bot-observability-migrations.test.mjs
          test/public-reading-asset-miss.test.mjs

      - name: Performance contracts (explicit column lists and one union count instead of repeated reads, batched topic findings, gallery paging, post cover priority, footer hidden while only the loading placeholder is shown so it cannot shift, Supabase preconnect; the public-candidate test reads the production build generated earlier in this job)
        run: >
          node --test
          src/lib/postReaderColumns.test.js
          src/lib/research/home2029Pulse.test.js
          src/lib/research/topicConvergenceBatch.test.js
          src/lib/research/worldProminenceInputs.test.js
          test/footer-loading-cls-2029.test.mjs
          test/gallery-overview-paging-2029.test.mjs
          test/home-doc37-launch-projection.test.mjs
          test/post2029-reading-cover.test.mjs
          test/public-reading-public-candidate.test.mjs
          test/shell-supabase-preconnect-2029.test.mjs

  # The SQL behaviour of the security migrations runs on a throwaway PostgreSQL container (never a live database).
  security-sql-contracts:
    name: security-sql-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: DEF-001, DEF-001b, DEF-004 and DEF-005 SQL regression (anon and authenticated cannot read e-mail addresses or visitor ids; proposed Storage policies and RPC grants behave as specified)
        run: bash scripts/run-def001-sql-test.sh

  # Permanent browser gate for sign-in: a real Chromium, the built public-reading artifact with its real service worker and the real
  # Supabase client on the production URL (mapped to a local fixture; Auth is an in-memory model, nothing leaves the runner).
  # Existing account, new account, password, e-mail link, session persistence, desktop / mobile / installed-app presentation and a stale worker.
  # Meta Pixel and AdSense on the 2029 public site (ZURIEL, 11.11.2026): the artifact is built WITH test marketing ids (the production ids come
  # from the Vercel environment at deploy time) and run in a real Chromium with the real worker and the deployment's real CSP.
  marketing-browser-2029:
    name: marketing-browser-2029
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the public-reading artifact with test marketing ids
        run: node scripts/build-public-reading-production.mjs
        env:
          VITE_META_PIXEL_ID: "1234567890123456"
          VITE_ADSENSE_CLIENT: ca-pub-0000000000000000
          VITE_ADSENSE_SLOT_POST: "0000000001"
          VITE_ADSENSE_SLOT_LIST: "0000000002"
      - name: Install the pinned browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Meta Pixel and AdSense (real CSP header + real worker), bots excluded
        run: node --test test/marketing-browser-2029.browser.mjs

  auth-browser-acceptance-2029:
    name: auth-browser-acceptance-2029
    # Pinned: Playwright 1.55 (pinned below) has no browser build for ubuntu-latest (26.04); the other browser gates use 24.04 too.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the public-reading artifact
        run: node scripts/build-public-reading-production.mjs
      - name: Install the pinned browser
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Sign-in acceptance in a real browser
        run: node --test test/auth-browser-acceptance-2029.browser.mjs test/auth-storage-browser-2029.browser.mjs
        env:
          AUTH_EVIDENCE_DIR: ${{ runner.temp }}/auth-evidence
      - name: Google Analytics 4 is not blocked (real CSP header + real worker)
        run: node --test test/ga-measurement-browser-2029.browser.mjs
      # Same built artifact, real worker and fixture: public storage video/audio play and seek (Range/206), images load, with and
      # without a version key or a media start fragment, first load and reload; a signed object never becomes a native load.
      - name: Public storage media through the real worker (play, seek, reload)
        # Playwright's Chromium build may not decode H.264; the runner's Google Chrome does, and then real playback is required.
        run: |
          if command -v google-chrome >/dev/null 2>&1; then export CHROMIUM_PATH="$(command -v google-chrome)" PUBLIC_MEDIA_REQUIRE_VIDEO_DECODE=1; fi
          node --test test/public-media-transport-2029.browser.mjs
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-browser-evidence
          path: ${{ runner.temp }}/auth-evidence
          if-no-files-found: ignore
