name: Runtime Lockfile Commit

on:
  push:
    branches:
      - claude/g3-2029-runtime-modernization-v1
    paths:
      - package.json
      - package-lock.json
      - .nvmrc
      - .github/workflows/runtime-lockfile-generate.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/g3-2029-runtime-modernization-v1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate clean lockfile
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm ls react react-dom vite @vitejs/plugin-react react-router-dom
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/runtime-lockfile-generate.yml
          git add package-lock.json .github/workflows/runtime-lockfile-generate.yml
          git commit -m "G3 runtime: regenerate React 19.3 lockfile"
          git push origin HEAD:claude/g3-2029-runtime-modernization-v1
