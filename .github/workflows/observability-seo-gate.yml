name: Observability/SEO Build Gate

# SOD1820_OBSERVABILITY_SEO_BUILD_GATE_CI (2026-09-07) — EXTEND_EXISTING.
# This PR gate owns build + bounded contract checks; checker semantics remain in their source modules.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # npm ci intentionally NOT used: package.json/package-lock.json are currently out of sync
      # repo-wide. Keep the existing installation behavior until that separate drift is repaired.
      - name: Install dependencies
        run: npm install

      - name: Observability/SEO route coverage check
        run: node scripts/check-observability-seo-gate.mjs

      - name: W2 Research contract tests
        run: |
          node --test \
            src/lib/research/researchComposerW2.test.js \
            src/lib/research/researchComposerW2.runtime.test.js \
            src/lib/research/researchComposerW2.358.test.js \
            src/lib/research/researchResultBundle.358.test.js \
            src/lib/research/researchW2Executors.358.test.js \
            src/lib/research/researchComposerW2.canonical358.test.js

      - name: Build
        run: npm run build
