name: Video Ingest Gate

on:
  pull_request:
    paths:
      - "supabase/functions/video-migrate/**"
      - "supabase/functions/agent-upload/**"
      - "supabase/functions/_shared/tiktokSourceResolver.js"
      - "scripts/test-video-migrate-tiktok-resolver.mjs"
      - "supabase/functions/video-transcribe/**"
      - "supabase/functions/wa-video-enrich/**"
      - "supabase/functions/_shared/sttTranscribe.js"
      - "supabase/functions/_shared/videoTranscriptPolicy.js"
      - "supabase/functions/_shared/postPublishPreflight.js"
      - "supabase/migrations/20261005020000_sys_save_post_service_only_acl_v1.sql"
      - "test/post-publishing-2029-chain.test.mjs"
      - "test/fixtures/post-publishing/**"
      - ".github/workflows/video-ingest-gate.yml"
  workflow_dispatch:

jobs:
  tiktok-source-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: TikTok source resolver + direct-video compatibility
        run: node scripts/test-video-migrate-tiktok-resolver.mjs
      - name: Agent remote video URL transport acceptance
        run: node --experimental-strip-types supabase/functions/agent-upload/url-video-mode.test.mts
      - name: Agent TikTok link-only upload acceptance
        run: node --experimental-strip-types supabase/functions/agent-upload/tiktok-mode.test.mts
      - name: Post publishing 2029 chain (preflight, shared STT, service-only writer ACL)
        run: node test/post-publishing-2029-chain.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase Edge runtime typecheck
        run: |
          deno check supabase/functions/video-migrate/index.ts
          deno check supabase/functions/agent-upload/index.ts
          deno check supabase/functions/video-transcribe/index.ts
          deno check supabase/functions/wa-video-enrich/index.ts