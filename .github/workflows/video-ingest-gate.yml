name: Video Ingest Gate

on:
  pull_request:
    paths:
      - "supabase/functions/video-migrate/**"
      - "supabase/functions/agent-upload/**"
      - "supabase/functions/_shared/tiktokSourceResolver.js"
      - "scripts/test-video-migrate-tiktok-resolver.mjs"
      - "supabase/functions/video-transcribe/**"
      - "supabase/functions/wa-video-enrich/**"
      - "supabase/functions/_shared/sttTranscribe.js"
      - "supabase/functions/_shared/videoSemanticMap.js"
      - "supabase/functions/_shared/videoTranscriptPolicy.js"
      - "supabase/functions/_shared/postPublishPreflight.js"
      - "supabase/functions/_shared/mediaPosterLane.js"
      - "supabase/functions/media-thumb-queue/**"
      - "scripts/media-thumbs.mjs"
      - "supabase/migrations/20261005020000_sys_save_post_service_only_acl_v1.sql"
      - "supabase/migrations/20261005030000_post_writers_id_alloc_advisory_lock_v1.sql"
      - "supabase/migrations/20261005040000_video_transcripts_single_original_invariant_v1.sql"
      - "test/post-publishing-2029-chain.test.mjs"
      - "scripts/test-video-semantic-tree-projector-v1.mjs"
      - "src/lib/research/videoSemanticMap.js"
      - "src/lib/research/goldenProjectorModes.js"
      - "src/components/experience2029/GoldenProjectorModeLayer2029.jsx"
      - "src/components/experience2029/ContextualVideoLayer2029.jsx"
      - "src/components/experience2029/SurfaceContextRail2029.jsx"
      - "supabase/migrations/20261007104500_video_semantic_tree_projector_v1.sql"
      - "test/fixtures/post-publishing/**"
      - ".github/workflows/video-ingest-gate.yml"
  workflow_dispatch:

jobs:
  tiktok-source-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: TikTok source resolver + direct-video compatibility
        run: node scripts/test-video-migrate-tiktok-resolver.mjs
      - name: Agent remote video URL transport acceptance
        run: node --experimental-strip-types supabase/functions/agent-upload/url-video-mode.test.mts
      - name: Agent TikTok link-only upload acceptance
        run: node --experimental-strip-types supabase/functions/agent-upload/tiktok-mode.test.mts
      - name: Post publishing 2029 chain (preflight, shared STT, service-only writer ACL)
        run: node test/post-publishing-2029-chain.test.mjs
      - name: Video semantic tree + contextual projector acceptance
        run: node --test scripts/test-video-semantic-tree-projector-v1.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Supabase Edge runtime typecheck
        run: |
          # Deno 2.9 resolves @supabase/functions-js types through npm:openai; auto node_modules makes that deterministic.
          deno check --node-modules-dir=auto supabase/functions/video-migrate/index.ts
          deno check --node-modules-dir=auto supabase/functions/agent-upload/index.ts
          deno check --node-modules-dir=auto supabase/functions/video-transcribe/index.ts
          deno check --node-modules-dir=auto supabase/functions/wa-video-enrich/index.ts
          deno check --node-modules-dir=auto supabase/functions/media-thumb-queue/index.ts