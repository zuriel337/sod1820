name: Gematria Core Consumers Once
on:
  push:
    branches: [gpt/gematria-core-consumers-adapter-v1]
jobs:
  verify:
    if: github.event.head_commit.message != 'Remove temporary Gematria core consumers workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Canonical contract tests
        run: node --test src/lib/research/gematriaCalculationContract.test.js src/lib/research/coreEngine.test.js
      - name: Build
        run: npm run build
