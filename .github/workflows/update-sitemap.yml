name: עדכון אוטומטי של Sitemap

# DEF-019 (audit 2026-11-06): the daily schedule was removed. The production sitemap is generated dynamically (/sitemap.xml -> api/public-sitemap)
# and a committed static public/sitemap.xml would shadow it (scripts/gen-sitemap.mjs and the production build both say so). Manual dispatch stays
# for a human who wants a one-off static export; it still commits only when public/sitemap.xml changes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Regenerate sitemap (מ-Supabase)
        run: node scripts/gen-sitemap.mjs

      - name: Commit sitemap if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- public/sitemap.xml; then
            git add public/sitemap.xml
            git commit -m "עדכון אוטומטי של sitemap.xml"
            git push
          else
            echo "sitemap unchanged"
          fi
