name: Number 2029 Owner Gate

on:
  pull_request:
    paths:
      - '.github/workflows/number-2029-owner-gate.yml'
      - 'src/pages/Number2029Page.jsx'
      - 'src/pages/number2029.css'
      - 'src/components/number2029/**'
      - 'src/lib/research/numberExpressionFocus.js'
      - 'src/lib/research/entityHubProjection.js'
      - 'src/lib/research/entityHubProjection.progressive.test.js'
      - 'src/lib/supabase.js'
      - 'src/lib/palette.js'
      - 'test/number-2029-owned-opening-contract.test.mjs'
      - 'tests/number-2029-owner.spec.cjs'
      - 'tests/number-owner-scenario.cjs'
      - 'tests/ci-isolated-test.cjs'
      - 'tests/playwright-storage-egress-guard.cjs'
      - 'scripts/ci-isolation/**'
      - 'test/ci-isolation/**'
      - 'test/fixtures/ci-2029/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  number-2029:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Only dependency/tool setup has network access; never execute package hooks.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned browser tools without package hooks
        run: |
          npm install --prefix "$RUNNER_TEMP/ci-tools" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          node "$RUNNER_TEMP/ci-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "PLAYWRIGHT_DIR=$RUNNER_TEMP/ci-tools" >> "$GITHUB_ENV"
          echo "PERF_CHROME=$(node -e "console.log(require('$RUNNER_TEMP/ci-tools/node_modules/playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Isolated Number semantic contracts, egress regressions and both builds
        run: bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/number-owner.sh source
      - name: Verified frozen input and isolated Number browser acceptance
        env:
          SOD_CI_SNAPSHOT: ${{ github.workspace }}/test/fixtures/ci-2029/browser.json.gz
        run: |
          # Number coverage is distinct from World/Entry. No live capture/fallback.
          snapshot_sha="$(node scripts/ci-isolation/number-owner-snapshot.cjs)"
          export SOD_CI_SNAPSHOT_SHA256="$snapshot_sha"
          bash scripts/ci-isolation/offline.sh bash scripts/ci-isolation/number-owner.sh browser
      # No raw DOM/screenshots/reports or private input are uploaded by this gate.
