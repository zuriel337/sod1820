name: Number 2029 Owner Gate

on:
  pull_request:
    paths:
      - '.github/workflows/number-2029-owner-gate.yml'
      - 'src/pages/Number2029Page.jsx'
      - 'src/pages/number2029.css'
      - 'src/components/number2029/**'
      - 'src/lib/research/numberExpressionFocus.js'
      - 'src/lib/palette.js'
      - 'test/number-2029-owned-opening-contract.test.mjs'
      - 'tests/number-2029-owner.spec.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  number-2029:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Number owner semantic / legacy-route contract
        run: node --test test/number-2029-owned-opening-contract.test.mjs
      - name: Build both generations without public cutover
        run: npm run build
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start isolated 2029 preview
        run: |
          cp dist/2029.html dist/index.html
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/sod-number-2029-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/2029 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sod-number-2029-preview.log
          exit 1
      - name: Read-only Number full-page browser acceptance
        run: npx playwright test tests/number-2029-owner.spec.cjs --workers=1 --reporter=line
      - name: Preview diagnostics on failure
        if: failure()
        run: cat /tmp/sod-number-2029-preview.log || true
