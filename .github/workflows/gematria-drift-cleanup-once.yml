name: Gematria Drift Cleanup Once

on:
  push:
    branches:
      - gpt/gematria-legacy-drift-cleanup-v1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Polish Gematria fixed-count cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/gematria-legacy-drift-cleanup-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish wording
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/pages/BeitMidrashPage.jsx';
          let s = fs.readFileSync(p, 'utf8');
          s = s.replaceAll('מ-השיטות הזמינות', 'מהשיטות הזמינות');
          fs.writeFileSync(p, s);
          NODE
      - name: Install dependencies
        run: npm install
      - name: Focused contract test
        run: node --test src/lib/research/gematriaCalculationContract.test.js
      - name: Build
        run: npm run build
      - name: Fixed-count scan
        run: |
          ! grep -RIn -E '19 שיטות|20 שיטות|19 השיטות|20 השיטות|מתוך 19|מ-19 השיטות|מ-20 השיטות' src/pages/CommunityCalculatorPage.jsx src/components/GematriaCalculatorLegacy.jsx src/pages/BeitMidrashPage.jsx src/lib/gematria.js supabase/functions/ai-analyze/index.ts
      - name: Commit polish branch-only
        run: |
          git config user.name "zuriel337"
          git config user.email "128194013+zuriel337@users.noreply.github.com"
          git add src/pages/BeitMidrashPage.jsx
          git diff --cached --quiet || git commit -m "Polish Gematria fixed-count cleanup"
          git push origin HEAD:gpt/gematria-legacy-drift-cleanup-v1
