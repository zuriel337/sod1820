name: Agent Dispatch Contract Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/*agent_event_dispatch_runtime*.sql"
      - "supabase/migrations/*claude_code_routine_transport*.sql"
      - "supabase/migrations/*openai_agents_gpt_wake*.sql"
      - "supabase/migrations/*unified_ai_cost_truth*.sql"
      - "src/lib/aiProviderRouter.js"
      - "src/lib/cost.js"
      - "test/agent-dispatch-contract.test.mjs"
      - "test/gpt-agent-wake-contract.test.mjs"
      - "test/ai-provider-router-contract.test.mjs"
      - ".github/workflows/agent-dispatch-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Work-log + Claude Code Routine architecture contract
        run: node test/agent-dispatch-contract.test.mjs

      - name: GPT OpenAI Agents API wake architecture contract
        run: node test/gpt-agent-wake-contract.test.mjs

      - name: Unified AI provider router + cost fail-closed contract
        run: node test/ai-provider-router-contract.test.mjs
