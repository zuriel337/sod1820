name: Agent Dispatch Contract Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/*agent_event_dispatch_runtime*.sql"
      - "supabase/functions/agent-dispatch/**"
      - "test/agent-dispatch-contract.test.mjs"
      - ".github/workflows/agent-dispatch-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bounded specialist core tests
        run: node --experimental-strip-types supabase/functions/agent-dispatch/core.test.mts

      - name: Migration + Edge architecture contract
        run: node test/agent-dispatch-contract.test.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge TypeScript check
        run: deno check --node-modules-dir=auto supabase/functions/agent-dispatch/index.ts
