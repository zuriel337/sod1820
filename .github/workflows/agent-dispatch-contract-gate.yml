name: Agent Dispatch Contract Gate

on:
  pull_request:
    paths:
      - "supabase/migrations/*dispatch*.sql"
      - "supabase/migrations/*claude_code_routine*.sql"
      - "test/agent-dispatch-contract.test.mjs"
      - ".github/workflows/agent-dispatch-contract-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Work-log + Claude Code Routine architecture contract
        run: node test/agent-dispatch-contract.test.mjs
