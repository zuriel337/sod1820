name: TEMP Plane Media Ingress
on:
  push:
    branches:
      - gpt/plane-video-global-20261001

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact originals from temporary Dropbox transport
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -L 'https://uc49c668166595dfd559779a8883.dl.dropboxusercontent.com/cd/0/get/DJLAnhnbI-IRFGtI2PVnHDeY06Phe98XkDtXecyimdS1oI4dFj32BPOpH7qN_L5F5F8sXvVp3TV30xbcdkQy9ZlkHNNuWCbv9JFANCdVrPcjLg2XK38WkGcHObZlfuX_ZopIkUonwjVbRk5u-sqYPrM5GgVkkNFJ8ggdWGnkWmMSlg/file?c_luid=bc1a06a4' -o video.mp4
          curl --fail-with-body -L 'https://uc32c56321817e41bb8474a72a70.dl.dropboxusercontent.com/cd/0/get/DJKKsUAGdqWbKXaRT2ceJPNI-71ellR1ZXR1YL_O8LQaJq9uu9yzsm6CV2uOJmobFf-xOCqhHfcG5cGfUICgOFoaqTiJujsemOPOSI-_xskDCJXaka6Mfk5pbV5zAXCidq0FNDYn8ibM4ktg-k6HsCulIuN4Y0oB94lumV2PvTLEyQ/file?c_luid=bc1a06a4' -o poster.jpg
          test "$(stat -c%s video.mp4)" = "1784816"
          test "$(sha256sum video.mp4 | awk '{print $1}')" = "b6242b915021562437c4eef62f2c27b267dff88f72262065759867af38b18ed6"
          test "$(stat -c%s poster.jpg)" = "165771"
          test "$(sha256sum poster.jpg | awk '{print $1}')" = "9d1e941f3d4af30ac46ca15d26c7c2586d8f55b367f8dfc28ba4bcd5c076ea45"

      - name: Upload exact video through canonical governed ingress
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST 'https://linswmnnkjxvweumprav.supabase.co/functions/v1/agent-upload'             -H 'x-agent-upload-ticket: 2c41478be64df9f1d3c2479d4c2c887e0e501cd1307e016ca11002b943aca57b'             -H 'content-type: video/mp4'             --data-binary '@video.mp4' | tee video-receipt.json
          grep -q '"verified":true' video-receipt.json

      - name: Upload exact poster through canonical governed ingress
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST 'https://linswmnnkjxvweumprav.supabase.co/functions/v1/agent-upload'             -H 'x-agent-upload-ticket: 9f819419e16dfcc0ae1a8a236b723e0eeda2341e1cbfa09686a3ac5be9a7da04'             -H 'content-type: image/jpeg'             --data-binary '@poster.jpg' | tee poster-receipt.json
          grep -q '"verified":true' poster-receipt.json
