name: Legacy Production Lock

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-production-lock:
    name: legacy-production-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73a27597364c9af683
        with:
          persist-credentials: false
      - name: Reject a 2029 canonical-production cutover
        run: node scripts/test-legacy-production-lock.mjs
