name: Production Release and Legacy Compatibility

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-production-lock:
    name: legacy-production-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preserve the Legacy fallback routes and launch flag
        run: node scripts/test-legacy-production-lock.mjs
      - name: Install the existing locked middleware dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify explicit 2029 publication and deployment separation
        run: node scripts/test-public-reading-main-release-contract.mjs
      - name: Verify negative cases for the release and retired-branch boundary
        run: node --test test/public-reading-main-release-contract.test.mjs
