name: Package Lock Sync Verify Once
on:
  push:
    branches: [gpt/package-lock-sync-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install from lockfile
        run: npm ci
      - name: Build
        run: npm run build
