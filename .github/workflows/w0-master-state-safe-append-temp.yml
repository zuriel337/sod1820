name: W0 Master State Safe Append

on:
  push:
    branches:
      - gpt/w0-final-canonical-closure-seo-gate-fix
    paths:
      - .github/workflows/w0-master-state-safe-append-temp.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/w0-final-canonical-closure-seo-gate-fix
          fetch-depth: 1

      - name: Append W0 reconciliation without rewriting history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          master_path = Path('SOD1820_MASTER_STATE.md')
          delta_path = Path('docs/w0-2027-master-state-supersession-delta-v1.md')
          master = master_path.read_text(encoding='utf-8')
          delta = delta_path.read_text(encoding='utf-8')

          marker = '## §23.32 — W0 2027 ADAPTIVE EXPERIENCE · HUMAN-GATE RECONCILIATION — 9.9.2026'
          if marker in master:
              print('Master State already contains §23.32; no append needed.')
              raise SystemExit(0)

          start_key = '## 1. Proposed additive Master State entry — 2026-09-09 W0 2027 Adaptive Experience reconciliation\n\n'
          end_key = '\n---\n\n## 2. Historical sections this dated delta supersedes only in stated scope'
          start = delta.index(start_key) + len(start_key)
          end = delta.index(end_key, start)
          quoted = delta[start:end]

          lines = []
          for line in quoted.splitlines():
              if line == '>':
                  lines.append('')
              elif line.startswith('> '):
                  lines.append(line[2:])
              else:
                  lines.append(line)
          section = '\n'.join(lines).strip()
          section = section.replace(
              '### W0 2027 ADAPTIVE EXPERIENCE · HUMAN-GATE RECONCILIATION — 9.9.2026',
              marker,
              1,
          )
          section = section.replace(
              '**Release state at decision time:** W0 specification package and DB rule v2 changes exist; long-form/additive docs remain branch-only until explicit ZURIEL release. `DB-LIVE rule != main-documented != merged != deployed != UI-live`.',
              '**Release reconciliation update (9.9.2026):** PR #393 (`095c52742f6d4ba58785f721090404bd8084678f`) merged the W0 v5.4/System-Frame/Research-Studio/Owner-Index package to `main`; `research_workspace_law v2` and `workspace_layout_standard v2` are DB-LIVE with one active v2 each. The 2027 product UI is still NOT IMPLEMENTED/NOT LIVE by that release. This §23.32 append is the remaining documented-state reconciliation and becomes main-documented only when this follow-up is separately merged.'
          )

          # Add a normal Change Log row inside the existing §CL table, preserving every prior row.
          cl_start = master.index('## §CL. CHANGE LOG')
          cl_end = master.index('\n---\n', cl_start)
          cl_block = master[cl_start:cl_end]
          nums = [int(n) for n in re.findall(r'^\|\s*(\d+)\s*\|', cl_block, re.M)]
          next_num = max(nums) + 1 if nums else 1
          cl_row = (
              f'| {next_num} | 9.9.2026 | **W0 2027 Adaptive Experience canonical reconciliation:** Roadmap v5.4 + Product Map/System Frame/Research Studio/Owner Index package merged via PR #393; active workspace laws v2; Number/Phrase `CONNECT NOW · REDESIGN LATER`; legacy CC future UI absorbed into W5/W6; Post root URL `/:slug` protected; §23.32 adds the dated supersession without deleting history | Human-Gate ZURIEL + W0 independent challenge/reconciliation | presentation/phasing locks only; capability/truth/provenance/security/Human-Gate preserved | `MERGED` docs package · `DB LIVE` rule layer · `2027 UI NOT IMPLEMENTED` |'
          )
          if 'W0 2027 Adaptive Experience canonical reconciliation' not in cl_block:
              master = master[:cl_end].rstrip() + '\n' + cl_row + '\n\n' + master[cl_end:].lstrip('\n')

          master = master.rstrip() + '\n\n---\n\n' + section + '\n'
          master_path.write_text(master, encoding='utf-8')
          print(f'Appended §23.32 and Change Log row #{next_num}.')
          PY

          git diff --check
          git diff -- SOD1820_MASTER_STATE.md

      - name: Commit safe append to branch
        shell: bash
        run: |
          if git diff --quiet -- SOD1820_MASTER_STATE.md; then
            echo "No Master State change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SOD1820_MASTER_STATE.md
          git commit -m "docs: apply W0 2027 Master State reconciliation"
          git push origin HEAD:gpt/w0-final-canonical-closure-seo-gate-fix
