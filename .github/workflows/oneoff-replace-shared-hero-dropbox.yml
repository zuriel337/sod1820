name: One-off Replace Shared Hero from Dropbox

on:
  push:
    branches:
      - gpt/replace-shared-hero-from-dropbox-20260930

permissions:
  contents: write

jobs:
  replace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact original from Dropbox
        env:
          DROPBOX_URL: 'https://uc777bac2c1a8d56ce0b02f0fdb0.dl.dropboxusercontent.com/cd/0/get/DJHEQ2_9LOytSXPWS7fb-VIMdYQa41DJB_C9zIWX1_7bMYmy49S4tQegBlz7SQinb3LHgB957Exou-sjuRHlMfnZo1Kp7FJroVAJzs77hV-RDgi7ZnNWi7a_V7Q_WZhw-mO5zyDDIH9_aLSvPWHPy30FLi8t_uQDJoioljCpPZ-okw/file?c_luid=bc1a06a4'
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --output /tmp/shared-hero.png "$DROPBOX_URL"
          test "$(stat -c %s /tmp/shared-hero.png)" = "1470880"

      - name: Verify Dropbox content hash and exact PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('/tmp/shared-hero.png').read_bytes()
          assert len(data)==1470880
          assert data[:8]==b'\x89PNG\r\n\x1a\n'
          block=4*1024*1024
          digests=b''.join(hashlib.sha256(data[i:i+block]).digest() for i in range(0,len(data),block))
          h=hashlib.sha256(digests).hexdigest()
          assert h=='2f8cc4ff62359e66e88885c94b74c0203fc317a17e8b34529937f9636abe2028', h
          w,hgt=struct.unpack('>II',data[16:24])
          print(f'verified exact Dropbox original: {len(data)} bytes, {w}x{hgt}')
          PY

      - name: Replace shared Hero asset byte-for-byte
        run: |
          set -euo pipefail
          cp /tmp/shared-hero.png public/home-hero-gate-888.png
          cmp --silent /tmp/shared-hero.png public/home-hero-gate-888.png
          git diff --check
          git status --short

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit asset replacement only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/home-hero-gate-888.png
          git commit -m "Legacy: replace shared Hero 888 asset"
          git push origin HEAD:gpt/replace-shared-hero-from-dropbox-20260930
