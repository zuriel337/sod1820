  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const HERO_SRC = '/home-rosh-hashana-5787.jpg?v=3';
        const CIPHER_URL = '/צופן-מדהים-בתורה-הקדושה';
        const HOME = [/^\/$/, /^\/home-new$/, /^\/בית-חדש$/];
        const HEICHAL = [/^\/research/, /^\/beit-midrash/, /^\/code/, /^\/heichal/];
        const isMatch = (list) => list.some((re) => re.test(location.pathname));
        const buildLink = (className) => {
          const a = document.createElement('a');
          a.href = CIPHER_URL;
          a.className = className;
          a.setAttribute('aria-label','פתח את הצופן המלא — אשלים מלאכה התשפ״ו');
          const img = document.createElement('img');
          img.src = HERO_SRC;
          img.alt = "כי לה׳ המלוכה — חג שמח ושנה טובה · הצצה לכיוון החדש";
          img.decoding = 'async';
          img.fetchPriority = 'high';
          a.appendChild(img);
          return a;
        };
        const syncHero = () => {
          document.querySelectorAll('.seasonal-site-hero').forEach((n)=>n.remove());
          const gate = document.querySelector('.hn-livegate');
          if (isMatch(HEICHAL)) {
            gate?.querySelector('.legacy-home-hero-link')?.remove();
            gate?.querySelector('.legacy-home-hero-img')?.remove();
            return;
          }
          if (isMatch(HOME)) {
            if (!gate) return;
            const oldImg = gate.querySelector(':scope > .legacy-home-hero-img');
            if (oldImg) oldImg.remove();
            if (!gate.querySelector(':scope > .legacy-home-hero-link')) {
              const link = buildLink('legacy-home-hero-link');
              link.querySelector('img').className = 'legacy-home-hero-img';
              gate.insertBefore(link, gate.firstChild);
            }
            return;
          }
          const nav = document.querySelector('nav');
          if (!nav || nav.parentNode.querySelector(':scope > .seasonal-site-hero')) return;
          const shell = document.createElement('div');
          shell.className = 'seasonal-site-hero';
          shell.appendChild(buildLink('seasonal-site-hero-link'));
          nav.insertAdjacentElement('afterend', shell);
        };
        let raf = 0;
        const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(syncHero); };
        const observer = new MutationObserver(schedule);
        observer.observe(document.documentElement,{childList:true,subtree:true});
        const push = history.pushState.bind(history), replace = history.replaceState.bind(history);
        history.pushState = (...args) => { push(...args); schedule(); };
        history.replaceState = (...args) => { replace(...args); schedule(); };
        addEventListener('popstate',schedule);
        schedule();
        setTimeout(syncHero,300);
        setTimeout(syncHero,1200);
      })();
    </script>
