<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SOD1820 · Connected 2029 Preview</title>
<style>
:root{--bg:#06070b;--surface:rgba(15,17,25,.78);--surface2:rgba(24,27,38,.68);--ink:#f4f0e6;--muted:#a8a9b3;--line:rgba(220,189,105,.18);--gold:#d8b862;--gold2:#f0d98e;--blue:#8ec7ff;--ok:#81d49a;--warn:#e1b968;--radius:20px;--shadow:0 24px 80px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{background:#05060a}body{margin:0;color:var(--ink);background:radial-gradient(circle at 78% 8%,rgba(102,81,34,.19),transparent 30%),radial-gradient(circle at 18% 55%,rgba(34,73,110,.15),transparent 36%),linear-gradient(180deg,#080910,#05060a 60%,#040509);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line);padding:26px 18px;background:rgba(5,6,10,.74);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:11px;align-items:center}.mark{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,217,142,.45);display:grid;place-items:center;color:var(--gold2);box-shadow:0 0 28px rgba(216,184,98,.15)}.brand b{letter-spacing:.08em}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav a{padding:10px 12px;border:1px solid transparent;border-radius:12px;color:#c8c8cf}.nav a:hover,.nav a.active{border-color:var(--line);background:rgba(216,184,98,.07);color:var(--gold2)}.nav .disabled{opacity:.5;cursor:not-allowed}.side-note{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.6}.side-note b{color:var(--gold2)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(18px,4vw,50px);border-bottom:1px solid var(--line);background:rgba(6,7,11,.77);backdrop-filter:blur(18px)}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--ink);padding:9px 12px;border-radius:12px;cursor:pointer}.btn.primary{border-color:rgba(216,184,98,.42);background:rgba(216,184,98,.10);color:var(--gold2)}
.content{padding:clamp(24px,4vw,56px);max-width:1240px;margin:0 auto}.hero{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:30px;padding:clamp(28px,5vw,58px);background:linear-gradient(135deg,rgba(216,184,98,.11),rgba(49,74,104,.11) 58%,rgba(13,15,22,.72));box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;inset:auto -90px -120px auto;width:280px;height:280px;border:1px solid rgba(216,184,98,.12);border-radius:50%;box-shadow:0 0 80px rgba(216,184,98,.06) inset}.eyebrow{color:var(--gold2);font-size:12px;letter-spacing:.14em;text-transform:uppercase}.hero h1{font-size:clamp(34px,6vw,72px);line-height:.98;margin:13px 0 18px;max-width:820px}.hero p{max-width:760px;color:#c7c8cf;line-height:1.8;font-size:clamp(15px,1.7vw,19px)}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:18px}.card{grid-column:span 4;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:20px;min-height:155px}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card h3{margin:0 0 8px;font-size:17px}.card p,.card li{color:var(--muted);line-height:1.65;font-size:14px}.tag{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--gold2);margin-bottom:12px}.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.linkchip{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#d8d9df;font-size:12px}.linkchip:hover{color:var(--gold2);background:rgba(216,184,98,.06)}
.raziel{position:fixed;inset-inline-end:26px;bottom:22px;z-index:20;width:min(390px,calc(100vw - 32px));border:1px solid rgba(142,199,255,.30);border-radius:22px;background:rgba(10,13,20,.93);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(0,0,0,.5);overflow:hidden}.raziel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid rgba(142,199,255,.15)}.raziel-head b{color:#cfe9ff}.raziel-body{padding:14px 15px;color:#c7d2df;line-height:1.65;font-size:13px}.raziel-actions{padding:0 15px 15px;display:flex;gap:7px;flex-wrap:wrap}.raziel-actions button{font:inherit}.trace{margin-top:10px;color:#768393;font-size:11px}.context-strip{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}.context-strip span{padding:6px 9px;border-radius:999px;background:rgba(142,199,255,.06);border:1px solid rgba(142,199,255,.14);font-size:11px;color:#abc8df}
.mobile-nav{display:none}.statusline{margin-top:18px;color:#8d909a;font-size:12px}.statusline strong{color:var(--ok)}
@media(max-width:900px){.app{display:block}.sidebar{display:none}.topbar{padding:12px 14px}.content{padding:18px 14px 110px}.grid{grid-template-columns:1fr}.card,.card.wide,.card.full{grid-column:1}.hero{border-radius:22px;padding:26px 20px}.raziel{inset-inline:12px;bottom:72px;width:auto}.mobile-nav{position:fixed;display:flex;z-index:30;bottom:0;inset-inline:0;background:rgba(7,8,12,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mobile-nav a{font-size:11px;color:#a9aab1;padding:6px}.mobile-nav a.active{color:var(--gold2)}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">ס</div><div><b>SOD 1820</b><small>מערכת המחקר · 2029 Preview</small></div></div>
    <nav class="nav" id="desktopNav"></nav>
    <div class="side-note"><b>Preview מחובר</b><br>Production הישן ממשיך זמנית. כאן בודקים את שפת המערכת החדשה בלבד.</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb" id="crumb"></div><div class="top-actions"><button class="btn" id="returnBtn">↩ חזרה מדויקת</button><button class="btn primary" id="razielBtn">✦ רזיאל</button></div></header>
    <section class="content" id="view"></section>
  </main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<section class="raziel" id="razielPanel">
  <div class="raziel-head"><b>✦ רזיאל · אותו חוקר בכל המערכת</b><button class="btn" id="closeRaziel">×</button></div>
  <div class="raziel-body" id="razielBody"></div>
  <div class="raziel-actions" id="razielActions"></div>
</section>
<script>
const surfaces={
 home:{label:'בית',title:'המחקר מתחיל מכאן',eyebrow:'HOME / DISCOVER',desc:'כניסה אחת שמראה מה חי עכשיו, מה מחכה למחקר, ומה כדאי להמשיך — בלי להפוך את הבית למאגר של כרטיסים.',cards:[['עכשיו','Global Now','אותות, עדכונים ומסעות שנכון לפגוש עכשיו — כפרויקטורים של אותה מציאות, לא Truth חדש.'],['המשך מחקר','Resume','חזרה למסע, מקור או שאלה פתוחה בדיוק מהמקום שבו נעצרת.'],['גילוי','Discover','כניסה ל־World, לספרים ולמחקר חדש דרך הקשר אחד שנשמר.']],links:['world','books','workspace'],raziel:'אני רואה את הבית כנקודת ניווט, לא כיעד סופי. אפשר להמשיך למה שחי עכשיו, לפתוח מקור, או לחזור למחקר האחרון.'},
 world:{label:'עולם',title:'עולם אחד · הרבה דרכי מבט',eyebrow:'WORLD / ONE REALITY',desc:'ה־World מחבר Number, Expression, Source, Event, Person, ELS ומסעות דרך יחסים מוסברים. הוא אינו גרף שממציא אמת מקרבה.',cards:[['צירים חיים','Research Anchors','עוגנים, התכנסויות ויחסים — עם הפרדה בין evidence, interpretation ו־candidate.'],['למה זה מחובר?','Explain Why','כל מעבר משמעותי צריך להיות ניתן להסבר דרך מקור, Finding, method או lineage.'],['עדשות','Dynamic Lenses','אותה מציאות יכולה להיראות דרך זמן, מקור, מחקר, אדם או נושא — בלי להחליף את הזהויות.']],links:['home','books','heichal'],raziel:'כאן אני יכול להסביר למה שני דברים מחוברים, מה חזק ומה רק פרשני, ולהציע את הצעד המחקרי הבא במקום רק להראות קווים.'},
 books:{label:'ספרים ומקורות',title:'מקור קודם לפרשנות',eyebrow:'BOOKS / SOURCES',desc:'ספר, מסמך, פסוק או מקור חיצוני נשארים ישויות עם witness, locator ו־provenance. מהם יוצאים Observations ו־Findings שאפשר לחקור במקומות אחרים.',cards:[['קורא ממוקד','Source Reader','המקור נשאר קריא בפני עצמו, עם locator מדויק וחזרה למקום.'],['מה הוצאנו מכאן?','Typed Observations','מספרים, ביטויים, תאריכים, אנשים ואירועים נשמרים עם origin role — לא רק כטקסט שנשלח ל־AI.'],['פתח בהקשר','Research Bridge','מהמקור אפשר לעבור ל־World, להיכל או למסע בלי לאבד מאיפה הגענו.']],links:['world','heichal','workspace'],raziel:'אם פתחת מקור, אני לא אמור לסכם אותו סתם. אני משתמש ב־locator, ב־Observations ובשאלת המחקר שלך כדי להראות מה באמת רלוונטי.'},
 heichal:{label:'היכל',title:'מצב מחקר עמוק',eyebrow:'HEICHAL / DEEP RESEARCH',desc:'היכל אינו שער חובה. הוא מצב עבודה עמוק שמקבל את אותו Research Context שכבר התחיל בבית, בעולם או במקור.',cards:[['תוכנית מחקר','Research Plan','Capability, anchors, tools, depth, budget, escalation ו־stop condition — לפני ריצה יקרה.'],['כלים','Canonical Capabilities','גימטריה, ELS, מקורות, השוואה וכלים עתידיים נשארים אצל ה־owners שלהם ומתחברים דרך Result Bundles.'],['בקרת עומק','Minimum Sufficient Intelligence','מתחילים בזול ובדטרמיניסטי; מעמיקים או מפעילים challenger רק כשזה יכול לשנות החלטה.']],links:['world','books','workspace'],raziel:'בהיכל אני עובר מ״מה ידוע״ ל״מה צריך לבדוק עכשיו״. אני בונה תוכנית, מפעיל רק את הכלים המוצדקים, ומחזיר תוצאה עם provenance וחוסר־ודאות.'},
 workspace:{label:'האזור שלי',title:'כל המחקר שלך במקום אחד',eyebrow:'MY WORKSPACE',desc:'ה־Workspace הוא projection אישי על אותו Research OS — לא Store נוסף. כאן חוזרים למסעות, שמירות, שאלות פתוחות ותרומות.',cards:[['מסעות','Journeys','רצף מחקר שאפשר לחזור אליו עם exact return, לא היסטוריית לינקים בלבד.'],['נשמר למחקר','Saved Research','אותן זהויות שכבר קיימות במערכת, עם ההקשר שבו שמרת אותן.'],['פתוח להמשך','Open Questions','שאלות וחוסרים הם research state אמיתי שאפשר להמשיך ממנו, לא פתקים שנשכחים.']],links:['home','world','heichal'],raziel:'כאן אני אמור לזהות מה פתוח, מה השתנה מאז המחקר האחרון, ומה הצעד עם Information Gain הכי גבוה — בלי ליצור ״זיכרון״ מקביל.'}
};
const navOrder=['home','world','books','heichal','workspace'];
const qs=new URLSearchParams(location.search);let current=qs.get('surface')||'home';if(!surfaces[current]) current='home';
const ctx=JSON.parse(localStorage.getItem('sod2029PreviewCtx')||'{"root":"home","path":[]}');
function href(s){const q=new URLSearchParams(location.search);q.set('surface',s);return '?'+q.toString()}
function navHtml(){return navOrder.map(k=>`<a href="${href(k)}" class="${k===current?'active':''}">${surfaces[k].label}</a>`).join('')+`<a class="disabled" title="נבנה בסשן Golden 1237">דף המספר · 1237 ↗</a>`}
desktopNav.innerHTML=navHtml();mobileNav.innerHTML=navHtml();
function remember(){if(ctx.path[ctx.path.length-1]!==current)ctx.path.push(current);if(ctx.path.length>12)ctx.path.shift();localStorage.setItem('sod2029PreviewCtx',JSON.stringify(ctx))}
remember();
function render(){const s=surfaces[current];crumb.innerHTML=`SOD1820 / ${ctx.root==='home'?'מחקר':'מסע'} / <strong>${s.label}</strong>`;view.innerHTML=`<article class="hero"><div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p>${s.desc}</p><div class="context-strip"><span>Research Context נשמר</span><span>Raziel אחד</span><span>return_exact</span><span>2029 target</span></div><div class="hero-actions"><button class="btn primary" onclick="openRaziel()">✦ שאל את רזיאל בהקשר הזה</button><a class="btn" href="${href(s.links[0])}">המשך למשטח הבא ←</a></div><div class="statusline"><strong>BRANCH PREVIEW</strong> · לא main · לא production · לא Truth authority</div></article><div class="grid">${s.cards.map((c,i)=>`<section class="card ${i===0?'wide':''}"><div class="tag">${c[1]}</div><h3>${c[0]}</h3><p>${c[2]}</p></section>`).join('')}<section class="card full"><div class="tag">CONNECTED SURFACES</div><h3>המשך מאותו הקשר</h3><p>המעבר בין המשטחים אינו מאפס את המחקר. ה־root, המסלול וחזרת־הדיוק נשארים זמינים.</p><div class="links">${s.links.map(k=>`<a class="linkchip" href="${href(k)}">${surfaces[k].label} ←</a>`).join('')}</div></section></div>`;renderRaziel()}
function renderRaziel(){const s=surfaces[current];razielBody.innerHTML=`${s.raziel}<div class="trace">Context: ${ctx.path.map(k=>surfaces[k]?.label||k).join(' ← ')}</div>`;razielActions.innerHTML=`<button class="btn primary" onclick="alert('Preview: כאן תופעל ask_raziel עם Context Pack של '+surfaces[current].label)">חקור מכאן</button><button class="btn" onclick="location.href='${href('heichal')}'">פתח בהיכל</button><button class="btn" onclick="location.href='${href('workspace')}'">שמור למסע</button>`}
function openRaziel(){razielPanel.style.display='block';renderRaziel()}window.openRaziel=openRaziel;razielBtn.onclick=openRaziel;closeRaziel.onclick=()=>razielPanel.style.display='none';
returnBtn.onclick=()=>{if(ctx.path.length>1){ctx.path.pop();const prev=ctx.path.pop();localStorage.setItem('sod2029PreviewCtx',JSON.stringify(ctx));location.href=href(prev)}else history.back()};
render();
</script>
</body>
</html>
