<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SOD1820 · Connected 2029 Preview</title>
<style>
:root{--bg:#06070b;--surface:rgba(15,17,25,.80);--ink:#f4f0e6;--muted:#a8a9b3;--line:rgba(220,189,105,.18);--gold:#d8b862;--gold2:#f0d98e;--blue:#8ec7ff;--ok:#81d49a;--radius:20px;--shadow:0 24px 80px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{background:#05060a}body{margin:0;color:var(--ink);background:radial-gradient(circle at 78% 8%,rgba(102,81,34,.19),transparent 30%),radial-gradient(circle at 18% 55%,rgba(34,73,110,.15),transparent 36%),linear-gradient(180deg,#080910,#05060a 60%,#040509);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;border-inline-end:1px solid var(--line);padding:26px 18px;background:rgba(5,6,10,.74);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:20px}.brand{display:flex;gap:11px;align-items:center}.mark{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,217,142,.45);display:grid;place-items:center;color:var(--gold2)}.brand small{display:block;color:var(--muted);margin-top:3px}.nav{display:grid;gap:7px}.nav a{padding:10px 12px;border:1px solid transparent;border-radius:12px;color:#c8c8cf}.nav a:hover,.nav a.active{border-color:var(--line);background:rgba(216,184,98,.07);color:var(--gold2)}.nav .disabled{opacity:.5;cursor:not-allowed}.side-note{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:12px;line-height:1.6}.side-note b{color:var(--gold2)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px clamp(18px,4vw,50px);border-bottom:1px solid var(--line);background:rgba(6,7,11,.77);backdrop-filter:blur(18px)}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--ink);padding:9px 12px;border-radius:12px;cursor:pointer}.btn.primary{border-color:rgba(216,184,98,.42);background:rgba(216,184,98,.10);color:var(--gold2)}
.content{padding:clamp(24px,4vw,56px);max-width:1240px;margin:0 auto}.hero{border:1px solid var(--line);border-radius:30px;padding:clamp(28px,5vw,58px);background:linear-gradient(135deg,rgba(216,184,98,.11),rgba(49,74,104,.11) 58%,rgba(13,15,22,.72));box-shadow:var(--shadow)}.eyebrow{color:var(--gold2);font-size:12px;letter-spacing:.14em}.hero h1{font-size:clamp(34px,6vw,72px);line-height:.98;margin:13px 0 18px;max-width:820px}.hero p{max-width:760px;color:#c7c8cf;line-height:1.8;font-size:clamp(15px,1.7vw,19px)}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:18px}.card{grid-column:span 4;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:20px;min-height:155px}.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}.card h3{margin:0 0 8px}.card p{color:var(--muted);line-height:1.65}.tag{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--gold2);margin-bottom:12px}.links,.context-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.linkchip,.context-strip span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px}.context-strip span{border-color:rgba(142,199,255,.14);color:#abc8df;background:rgba(142,199,255,.06)}
.raziel{display:none;position:fixed;inset-inline-end:26px;bottom:22px;z-index:50;width:min(420px,calc(100vw - 32px));border:1px solid rgba(142,199,255,.30);border-radius:22px;background:rgba(10,13,20,.97);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(0,0,0,.55);overflow:hidden}.raziel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid rgba(142,199,255,.15)}.raziel-head b{color:#cfe9ff}.raziel-body{padding:14px 15px;color:#c7d2df;line-height:1.65;font-size:13px}.raziel-actions{padding:0 15px 15px;display:flex;gap:7px;flex-wrap:wrap}.trace{margin-top:10px;color:#768393;font-size:11px}.raziel-result{margin-top:12px;padding:12px;border:1px solid rgba(142,199,255,.16);border-radius:14px;background:rgba(142,199,255,.05)}.raziel-result b{color:#cfe9ff}.statusline{margin-top:18px;color:#8d909a;font-size:12px}.statusline strong{color:var(--ok)}.mobile-nav{display:none}
@media(max-width:900px){.app{display:block}.sidebar{display:none}.topbar{padding:12px 14px}.content{padding:18px 14px 110px}.grid{grid-template-columns:1fr}.card,.card.wide,.card.full{grid-column:1}.hero{border-radius:22px;padding:26px 20px}.raziel{inset-inline:12px;bottom:72px;width:auto;max-height:72vh;overflow:auto}.mobile-nav{position:fixed;display:flex;z-index:40;bottom:0;inset-inline:0;background:rgba(7,8,12,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mobile-nav a{font-size:11px;color:#a9aab1;padding:6px}.mobile-nav a.active{color:var(--gold2)}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="mark">ס</div><div><b>SOD 1820</b><small>מערכת המחקר · 2029 Preview</small></div></div><nav class="nav" id="desktopNav"></nav><div class="side-note"><b>Preview מחובר</b><br>Production הישן ממשיך זמנית. כאן בודקים את שפת המערכת החדשה בלבד.</div></aside><main class="main"><header class="topbar"><div class="crumb" id="crumb"></div><div class="top-actions"><button class="btn" id="returnBtn">↩ חזרה מדויקת</button><button class="btn primary" id="razielBtn">✦ רזיאל</button></div></header><section class="content" id="view"></section></main></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<section class="raziel" id="razielPanel"><div class="raziel-head"><b>✦ רזיאל · אותו חוקר בכל המערכת</b><button class="btn" id="closeRaziel">×</button></div><div class="raziel-body" id="razielBody"></div><div class="raziel-actions" id="razielActions"></div></section>
<script>
const surfaces={
 home:{label:'בית',title:'המחקר מתחיל מכאן',eyebrow:'HOME / DISCOVER',desc:'כניסה אחת שמראה מה חי עכשיו, מה מחכה למחקר ומה כדאי להמשיך — בלי להפוך את הבית למאגר כרטיסים.',cards:[['עכשיו','Global Now','אותות, עדכונים ומסעות שנכון לפגוש עכשיו.'],['המשך מחקר','Resume','חזרה למסע, מקור או שאלה פתוחה בדיוק מהמקום שבו נעצרת.'],['גילוי','Discover','כניסה ל־World, לספרים ולמחקר חדש דרך הקשר אחד שנשמר.']],links:['world','books','workspace'],raziel:'אני רואה את הבית כנקודת ניווט, לא כיעד סופי.',research:'הצעד המשתלם כאן הוא לזהות מה השתנה מאז המחקר האחרון ולבחור מסלול אחד עם Information Gain גבוה.'},
 world:{label:'עולם',title:'עולם אחד · הרבה דרכי מבט',eyebrow:'WORLD / ONE REALITY',desc:'ה־World מחבר Number, Expression, Source, Event, Person, ELS ומסעות דרך יחסים מוסברים.',cards:[['צירים חיים','Research Anchors','עוגנים, התכנסויות ויחסים עם הפרדה בין evidence, interpretation ו־candidate.'],['למה זה מחובר?','Explain Why','כל מעבר משמעותי ניתן להסבר דרך מקור, Finding, method או lineage.'],['עדשות','Dynamic Lenses','אותה מציאות דרך זמן, מקור, מחקר, אדם או נושא.']],links:['home','books','heichal'],raziel:'כאן אני מסביר למה דברים מחוברים ומה חזק מול מה שרק פרשני.',research:'אני הייתי פותח קודם את הקשר שמגובה ביותר מ־capability אחד, ואז בודק אם הראיות באמת עצמאיות.'},
 books:{label:'ספרים ומקורות',title:'מקור קודם לפרשנות',eyebrow:'BOOKS / SOURCES',desc:'ספר, מסמך, פסוק או מקור חיצוני נשארים ישויות עם witness, locator ו־provenance.',cards:[['קורא ממוקד','Source Reader','המקור נשאר קריא בפני עצמו עם locator מדויק.'],['מה הוצאנו מכאן?','Typed Observations','מספרים, ביטויים, תאריכים, אנשים ואירועים עם origin role.'],['פתח בהקשר','Research Bridge','מעבר ל־World, להיכל או למסע בלי לאבד את המקור.']],links:['world','heichal','workspace'],raziel:'אם פתחת מקור, אני משתמש ב־locator וב־Observations במקום לסכם סתם.',research:'במחקר אמיתי כאן הייתי בודק קודם אילו Observations כבר הופקו מהמקור, מה חסר, ורק אז מפעיל AI על החלק הרלוונטי.'},
 heichal:{label:'היכל',title:'מצב מחקר עמוק',eyebrow:'HEICHAL / DEEP RESEARCH',desc:'היכל הוא מצב עבודה עמוק שמקבל את אותו Research Context שכבר התחיל במקום אחר.',cards:[['תוכנית מחקר','Research Plan','Capability, anchors, tools, depth, budget, escalation ו־stop condition.'],['כלים','Canonical Capabilities','גימטריה, ELS, מקורות, השוואה וכלים עתידיים נשארים אצל ה־owners שלהם.'],['בקרת עומק','Minimum Sufficient Intelligence','מתחילים בזול ובדטרמיניסטי; מעמיקים רק כשצריך.']],links:['world','books','workspace'],raziel:'בהיכל אני עובר מ״מה ידוע״ ל״מה צריך לבדוק עכשיו״.',research:'כאן הייתי מנסח Plan קצר: מה השאלה, אילו capabilities צריכים לרוץ, מה התקציב ומה יגרום לעצור או להסלים.'},
 workspace:{label:'האזור שלי',title:'כל המחקר שלך במקום אחד',eyebrow:'MY WORKSPACE',desc:'ה־Workspace הוא projection אישי על אותו Research OS — לא Store נוסף.',cards:[['מסעות','Journeys','רצף מחקר עם exact return.'],['נשמר למחקר','Saved Research','אותן זהויות שכבר קיימות במערכת עם ההקשר שבו נשמרו.'],['פתוח להמשך','Open Questions','שאלות וחוסרים הם research state שאפשר להמשיך ממנו.']],links:['home','world','heichal'],raziel:'כאן אני מזהה מה פתוח ומה השתנה מאז המחקר האחרון.',research:'הפעולה הנכונה כאן היא לדרג את השאלות הפתוחות לפי Information Gain ולהחזיר אותך למסע המדויק במקום לפתוח מחקר חדש.'}
};
const navOrder=['home','world','books','heichal','workspace'];
const qs=new URLSearchParams(location.search);let current=qs.get('surface')||'home';if(!surfaces[current])current='home';
const ctx=JSON.parse(localStorage.getItem('sod2029PreviewCtx')||'{"root":"home","path":[]}');
function href(s){const q=new URLSearchParams(location.search);q.set('surface',s);return '?'+q.toString()}
function navHtml(){return navOrder.map(k=>`<a href="${href(k)}" class="${k===current?'active':''}">${surfaces[k].label}</a>`).join('')+`<a class="disabled">דף המספר · בסשן Golden נפרד</a>`}
desktopNav.innerHTML=navHtml();mobileNav.innerHTML=navHtml();if(ctx.path[ctx.path.length-1]!==current)ctx.path.push(current);if(ctx.path.length>12)ctx.path.shift();localStorage.setItem('sod2029PreviewCtx',JSON.stringify(ctx));
function render(){const s=surfaces[current];crumb.innerHTML=`SOD1820 / מחקר / <strong>${s.label}</strong>`;view.innerHTML=`<article class="hero"><div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p>${s.desc}</p><div class="context-strip"><span>Research Context נשמר</span><span>Raziel אחד</span><span>return_exact</span><span>2029 target</span></div><div class="hero-actions"><button class="btn primary" onclick="openRaziel()">✦ שאל את רזיאל בהקשר הזה</button><a class="btn" href="${href(s.links[0])}">המשך למשטח הבא ←</a></div><div class="statusline"><strong>BRANCH PREVIEW</strong> · לא main · לא production · Raziel כאן הוא interaction preview, לא תשובת AI חיה</div></article><div class="grid">${s.cards.map((c,i)=>`<section class="card ${i===0?'wide':''}"><div class="tag">${c[1]}</div><h3>${c[0]}</h3><p>${c[2]}</p></section>`).join('')}<section class="card full"><div class="tag">CONNECTED SURFACES</div><h3>המשך מאותו הקשר</h3><p>המעבר בין המשטחים אינו מאפס את המחקר.</p><div class="links">${s.links.map(k=>`<a class="linkchip" href="${href(k)}">${surfaces[k].label} ←</a>`).join('')}</div></section></div>`;renderRaziel(false)}
function renderRaziel(showResult){const s=surfaces[current];razielBody.innerHTML=`${s.raziel}<div class="trace">Context: ${ctx.path.map(k=>surfaces[k]?.label||k).join(' ← ')}</div>${showResult?`<div class="raziel-result"><b>Preview של המשך מחקר</b><br>${s.research}<div class="trace">ביישום החי: canonical facts → Context Pack → Router → Raziel → Result Bundle/next action</div></div>`:''}`;razielActions.innerHTML=`<button class="btn primary" onclick="runPreviewResearch()">חקור מכאן</button><button class="btn" onclick="location.href='${href('heichal')}'">פתח בהיכל</button><button class="btn" onclick="location.href='${href('workspace')}'">שמור למסע</button>`}
function openRaziel(){razielPanel.style.display='block';renderRaziel(false)}function runPreviewResearch(){renderRaziel(true)}window.openRaziel=openRaziel;window.runPreviewResearch=runPreviewResearch;razielBtn.onclick=openRaziel;closeRaziel.onclick=()=>razielPanel.style.display='none';
returnBtn.onclick=()=>{if(ctx.path.length>1){ctx.path.pop();const prev=ctx.path.pop();localStorage.setItem('sod2029PreviewCtx',JSON.stringify(ctx));location.href=href(prev)}else history.back()};render();
</script>
</body></html>
