<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">SOD1820 Research OS — הצצה למערכת המחקר</title>
  <desc id="d">מסך עתידי כהה עם 1820 במרכז וקשרים למספרים, מילים, פסוקים, אנשים, זמן ומבנים.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="72%"><stop stop-color="#19102f"/><stop offset=".55" stop-color="#080b17"/><stop offset="1" stop-color="#03050a"/></radialGradient>
    <radialGradient id="orb" cx="45%" cy="38%"><stop stop-color="#2d6ba8"/><stop offset=".48" stop-color="#17234c"/><stop offset="1" stop-color="#0b0d1b"/></radialGradient>
