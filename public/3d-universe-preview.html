<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOD1820 · Royal Knowledge Universe</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#030208;color:#f7e7b0;font-family:system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:28px;box-sizing:border-box}.brand{letter-spacing:.3em;color:#d7b55a;font-size:12px}.title{font-size:clamp(28px,5vw,64px);margin-top:10px;text-shadow:0 0 30px #d7a83a}.hint{position:absolute;bottom:28px;right:28px;color:#a9a0a5;font-size:13px}.panel{position:absolute;left:28px;bottom:28px;min-width:260px;padding:16px 20px;border:1px solid #80652d;background:#080713cc;backdrop-filter:blur(12px);border-radius:18px}.panel b{font-size:24px;color:#ffe49a}.panel small{display:block;color:#aaa0a7;margin-top:6px}.door{cursor:pointer}.door:hover{filter:brightness(1.4)}</style></head><body><div id="hud"><div class="brand">SOD1820 · ROYAL KNOWLEDGE UNIVERSE</div><div class="title">היכל השערים</div><div class="hint">לחץ על שער · גלול להתקרב · גרור לסובב</div><div class="panel" id="panel"><b>מָשִׁיחַ</b><small>בחר שער כדי לצלול</small></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import*as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const S=new T.Scene();S.background=new T.Color(0x030208);S.fog=new T.FogExp2(0x030208,.012);const C=new T.PerspectiveCamera(52,innerWidth/innerHeight,.1,300);C.position.set(0,5,25);const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);const O=new OrbitControls(C,R.domElement);O.enableDamping=true;O.target.set(0,3,0);S.add(new T.AmbientLight(0x77708a,.55));const L=new T.PointLight(0xffd66e,110,55);L.position.set(0,9,12);S.add(L);const L2=new T.PointLight(0x435cff,60,60);L2.position.set(-15,0,-12);S.add(L2);function text(t,size=1,color='#f9df96'){const c=document.createElement('canvas');c.width=1024;c.height=256;const x=c.getContext('2d');x.clearRect(0,0,1024,256);x.font=`700 ${size*58}px Arial`;x.textAlign='center';x.textBaseline='middle';x.shadowColor=color;x.shadowBlur=24;x.fillStyle=color;x.fillText(t,512,128);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(7*size,1.75*size,1);return s}function glow(color=0xd7b55a){const m=new T.MeshBasicMaterial({color,transparent:true,opacity:.18,side:T.DoubleSide});return new T.Mesh(new T.TorusGeometry(2.8,.08,16,96),m)}const stars=new T.BufferGeometry(),p=new Float32Array(4200);for(let i=0;i<p.length;i++)p[i]=(Math.random()-.5)*120;stars.setAttribute('position',new T.BufferAttribute(p,3));S.add(new T.Points(stars,new T.PointsMaterial({color:0xd7b55a,size:.035,transparent:true,opacity:.65})));const root=new T.Group();S.add(root);const m=text('מָשִׁיחַ',1.45);m.position.set(0,10,-1);root.add(m);const sub=text('358  ·  878  ·  1331  ·  552',.42,'#cbb57b');sub.position.set(0,8.2,0);root.add(sub);const doors=[{id:'878',label:'878',sub:'מילוי · היכל ההתכנסויות',x:-9},{id:'1358',label:'1358',sub:'גדול · עולם הפוך',x:-3},{id:'67',label:'67',sub:'מסתתר · חכמה → בינה',x:3},{id:'1820',label:'1820',sub:'Hub · היכל האוצרות',x:9}];const groups=[];doors.forEach((d,i)=>{const g=new T.Group();g.position.set(d.x,2,0);g.userData=d;const ring=glow(i%2?0x9c6bff:0xd7b55a);g.add(ring);const core=new T.Mesh(new T.IcosahedronGeometry(1.5,3),new T.MeshStandardMaterial({color:i%2?0x44308a:0x8f6d22,emissive:i%2?0x34206e:0x6e4b12,emissiveIntensity:1,metalness:.8,roughness:.22}));g.add(core);const a=text(d.label,1.0);a.position.y=-.1;g.add(a);const b=text(d.sub,.24,'#bfb7a6');b.position.y=-2.3;g.add(b);root.add(g);groups.push(g)});const room=new T.Mesh(new T.CylinderGeometry(15,15,2,.64,1,true),new T.MeshBasicMaterial({color:0x171122,side:T.BackSide,transparent:true,opacity:.32}));room.position.y=3;root.add(room);const ray=new T.Raycaster(),mouse=new T.Vector2(),panel=document.getElementById('panel');addEventListener('pointerdown',e=>{mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,C);const h=ray.intersectObjects(groups,true);if(!h.length)return;let g=h[0].object;while(g.parent&&!g.userData.id)g=g.parent;const d=g.userData;panel.innerHTML=`<b>${d.label}</b><small>${d.sub}</small>`;O.target.copy(g.position);C.position.set(g.position.x*.35+0,g.position.y+2,13)});let z=0;function loop(){requestAnimationFrame(loop);z+=.003;root.rotation.y=Math.sin(z)*.018;groups.forEach((g,i)=>{g.position.y=2+Math.sin(z*2+i)*.12;g.rotation.y+=.004});O.update();R.render(S,C)}loop();addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
